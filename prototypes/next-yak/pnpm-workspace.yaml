packages:
  - 'packages/*'
  - 'app'

# This prototype is deliberately NOT part of the repository root workspace
# (`/pnpm-workspace.yaml` only lists `apps/*` and `packages/*`), so it has its
# own lockfile and never touches the published @sanity/ui dependency graph.
allowBuilds:
  '@swc/core': true
  esbuild: true

# next-yak evaluates `*.yak.ts` token modules with Node's native type stripping, which is only on
# by default from Node 22.18 (next-yak declares no `engines`, so on 22.14 it fails with
# `Unknown file extension ".ts"`). This VM runs 22.14.
nodeOptions: --experimental-strip-types

catalog:
  next-yak: ^9.10.2
  react: ^19.2.4
  react-dom: ^19.2.4
  vite: ^8.3.4
  '@vitejs/plugin-react': ^6.1.2
  '@vitejs/plugin-react-swc': ^4.3.3
  tsdown: ^0.23.1
  '@swc/core': ~1.15.47
