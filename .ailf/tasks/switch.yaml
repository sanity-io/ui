        reason: 'Switch API — required `label` prop, controlled checked/onChange; the component sets role=switch itself'
  prompt:
    text: |
      Add a controlled "Email notifications" on/off switch using the `@sanity/ui` package. Show the JSX.
  assertions:
    - type: llm-rubric
      template: task-completion
