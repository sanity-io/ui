  prompt:
    text: |
      I'm using VStack from `@sanity/ui` to stack several Text components that represent article paragraphs. The gap spacing looks correct visually, but inspecting the DOM shows every Text rendering as a `<span>`. Show a corrected JSX example.
  assertions:
    - type: llm-rubric
      template: task-completion
      criteria:
        - Provides a corrected example with Text using `as="p"` inside the VStack
        - Keeps each paragraph as its own Text, rather than merging them into one
        - Keeps the VStack as the container that stacks the paragraphs
    - type: llm-rubric
      template: code-correctness
      criteria:
        - Every Text inside the VStack sets `as="p"` (or another block-level element such as `as="div"`)
        - VStack uses `gap=` (not `space=`)
        - Text and VStack are imported from '@sanity/ui'
        - JSX is syntactically valid
    - type: contains
      value: 'gap='
    - type: contains-any
      value: ['as="p"', 'as="div"']
    # Scoped to VStack: a correct answer may say "gap, not space=" in prose.
    - type: not-contains
      value: '<VStack space='
  baseline:
    enabled: true
    rubric: full
