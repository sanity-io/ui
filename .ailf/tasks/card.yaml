  title: 'Card — tone vocabulary across Card, Button and Badge'
  area: sanity-ui-v5
  docCoverage: false
  referenceSolution: reference-solutions/card/card-cross-component-tone-vocabulary.tsx
  context:
    docs:
      - id: e751904e-4bbe-4ac6-8bb3-a91d445bded4
        path: ui/components/card
        locator:
          kind: sanity-content-lake
          projectId: 3do82whm
          dataset: next
          documentId: e751904e-4bbe-4ac6-8bb3-a91d445bded4
          perspective: rqgKNUCe1
        reason: 'Card tone vocabulary (neutral/positive/suggest/caution/critical); a toned message leads with the state in words or carries an icon'
      - id: ea580011-a37c-4dba-b1a0-30a27e47530f
        path: ui/components/button
        locator:
          kind: sanity-content-lake
          projectId: 3do82whm
          dataset: next
          documentId: ea580011-a37c-4dba-b1a0-30a27e47530f
          perspective: rqgKNUCe1
        reason: "v5 Button tone is narrower (neutral/critical); a destructive confirm is level='primary' tone='critical' with a `text` label"
      - id: b8cb486b-7c49-4096-9b88-89e6ba8831ff
        path: ui/components/badge
        locator:
          kind: sanity-content-lake
          projectId: 3do82whm
          dataset: next
          documentId: b8cb486b-7c49-4096-9b88-89e6ba8831ff
          perspective: rqgKNUCe1
        reason: 'v5 Badge takes the same five tones as Card, its label goes in `text`, and a toned Badge needs a second channel (state-first text or iconStart)'
  prompt:
    text: |
      Build a destructive delete-confirmation panel with `@sanity/ui`: a Card wrapping the message, a status Badge flagging the action as permanent, a Cancel button and a confirm Button that deletes. Show the JSX.
  assertions:
    - type: llm-rubric
      template: task-completion
      criteria:
        - The Card uses tone="critical"
        - The confirm Button uses tone="critical" (with level="primary" as the main action) and the Cancel button is not critical
        - The Badge uses tone="critical" and its label either leads with the state in words or carries an iconStart
        - The layout reads as a confirmation panel
    - type: llm-rubric
      template: code-correctness
      criteria:
        - Card, Button and Badge are all imported from '@sanity/ui'
        - Uses only valid v5 tones — no tone="default" or tone="primary" on any of the three, and nothing beyond neutral or critical on Button
        - Button and Badge labels are set through the `text` prop; Button uses `level`, not v3's `mode`
    - type: contains
      value: 'tone="critical"'
    - type: not-contains
      value: 'tone="default"'
  baseline:
    enabled: true
    rubric: full

