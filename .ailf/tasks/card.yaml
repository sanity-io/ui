- id: sanity-ui-v5-card-tone-css-variable-scope
  mode: literacy
  title: 'Card — semantic colour properties, not tone ramp variables, in custom markup'
  area: sanity-ui-v5
  docCoverage: false
  referenceSolution: reference-solutions/card/card-tone-css-variable-scope.tsx
  context:
    docs:
      - path: ui/tokens/semantic-tokens
        reason: "Custom markup takes colour from the semantic properties (var(--separator-low), var(--foreground-high)), which resolve in both schemes; inside a toned element they remap to that tone's ramp"
      - path: ui/foundations/color-guidelines
        reason: 'Ordinary borders and rules use --separator-low; never a hex value or a base token such as --gray-200, which ignores the colour scheme'
  prompt:
    text: |
      I tried using `var(--tone-200)` for a custom divider line outside a card and it shows nothing. Show the corrected code.
  assertions:
    - type: llm-rubric
      template: task-completion
      criteria:
        - Provides a corrected divider example
        - The corrected divider uses var(--separator-low) (or var(--separator-high) for a deliberate border)
        - The divider stays custom markup outside a card, as in the question
    - type: llm-rubric
      template: code-correctness
      criteria:
        - The divider colour is not a hard-coded hex value or a base palette token such as var(--gray-200)
        - No `--tone-*` variable remains in the corrected divider
        - The CSS and any JSX are syntactically valid
    - type: contains
      value: '--separator-'
    # Scoped to a border declaration: a correct answer may name --gray-200 while
    # rejecting it, but it should not write it into the fix.
    - type: not-contains
      value: 'solid var(--gray-'
  baseline:
    enabled: true
    rubric: full
