- id: sanity-ui-v5-card-layout-props-type-error
  mode: literacy
  title: 'Card — layout props are not supported and fail the type check'
  area: sanity-ui-v5
  docCoverage: false
  context:
    docs:
      - id: e751904e-4bbe-4ac6-8bb3-a91d445bded4
        path: ui/components/card
        locator:
          kind: sanity-content-lake
          projectId: 3do82whm
          dataset: next
          documentId: e751904e-4bbe-4ac6-8bb3-a91d445bded4
          perspective: rqgKNUCe1
        reason: 'Card accepts only density, tone, margin* and as — passing flexGrow, width, overflow, padding, minWidth or position directly is a TypeScript error; layout sizing goes on a wrapping Box or Flex'
      - id: a0cb0c96-7426-4fef-b3a0-af7a0b5742f9
        path: ui/components/box
        locator:
          kind: sanity-content-lake
          projectId: 3do82whm
          dataset: next
          documentId: a0cb0c96-7426-4fef-b3a0-af7a0b5742f9
          perspective: rqgKNUCe1
        reason: 'Box for layout control as the recommended wrapper around Card'
  prompt:
    text: |
      I'm trying to make a Card from the `@sanity/ui` package fill the available space inside a Flex container. I passed `flexGrow={1}` to the Card, TypeScript underlines it, and the Card stays its original size. What's the correct pattern?

      Show a working JSX example.
  assertions:
    - type: llm-rubric
      template: task-completion
      criteria:
        - Wraps the Card in a Box or Flex that carries flexGrow and any sizing props
        - The wrapper holding flexGrow is a direct child of the parent Flex container
        - Provides a working JSX example
    - type: llm-rubric
      template: code-correctness
      criteria:
        - Card has no flexGrow, width, overflow, padding, minWidth or position prop
        - Box, Flex, and Card are imported from the '@sanity/ui' package
        - JSX is syntactically valid
    # Any prop may come before flexGrow on the wrapper.
    - type: regex
      value: "<(Box|Flex)\\b[^>]*\\bflexGrow="
  baseline:
    enabled: true
    rubric: full

- id: sanity-ui-v5-card-v3-to-v5-prop-migration
  mode: literacy
  title: 'Card — v3 props (padding, radius, shadow) are no longer supported'
  area: sanity-ui-v5
  docCoverage: false
  context:
    docs:
      - id: e751904e-4bbe-4ac6-8bb3-a91d445bded4
        path: ui/components/card
        locator:
          kind: sanity-content-lake
          projectId: 3do82whm
          dataset: next
          documentId: e751904e-4bbe-4ac6-8bb3-a91d445bded4
          perspective: rqgKNUCe1
        reason: "Card v5 API — density and tone replace v3's padding/radius/shadow/border/scheme props; density is the only spacing control and a Box must not be nested inside Card to re-create a v3 padding value"
  prompt:
    text: |
      I'm migrating a Card from v3 where I used `padding={4}` and `radius={2}` for styling. On the new Card from the `@sanity/ui` package, TypeScript rejects both props. Show the corrected Card.
  assertions:
    - type: llm-rubric
      template: task-completion
      criteria:
        - Replaces `padding={4}` and `radius={2}` with a single `density` value on the Card
        - Does not nest a Box inside the Card to re-create the old padding
        - Provides a corrected example using density and tone
    - type: llm-rubric
      template: code-correctness
      criteria:
        - Uses density values from the v5 scale (compact, regular, loose)
        - Does not pass padding, radius, shadow, border, or scheme directly to Card
        - Card is imported from the '@sanity/ui' package
        - JSX is syntactically valid
    - type: contains-any
      value: ['density=', 'tone=']
  baseline:
    enabled: true
    rubric: full

- id: sanity-ui-v5-card-tone-status-communication
  mode: literacy
  title: 'Card — choose the correct tone for semantic status communication'
  area: sanity-ui-v5
  docCoverage: false
  context:
    docs:
      - id: e751904e-4bbe-4ac6-8bb3-a91d445bded4
        path: ui/components/card
        locator:
          kind: sanity-content-lake
          projectId: 3do82whm
          dataset: next
          documentId: e751904e-4bbe-4ac6-8bb3-a91d445bded4
          perspective: rqgKNUCe1
        reason: 'Card tone values, purpose, and paired icon guidance'
  prompt:
    text: |
      Using the Card component from `@sanity/ui`, implement four status card variants for a billing dashboard:

      1. A card representing a successful payment transaction
      2. A card representing a credit card that will expire next month (needs attention but not blocking)
      3. A card representing a failed transaction (critical error)
      4. A card representing a standard document in the list (no special status)

      Requirements:
      - Choose the correct `tone` prop value for each scenario
      - Pair each toned card with an appropriate icon (import each icon from its own `@sanity/icons` subpath)
      - Set `density="regular"` on each card
      - Do NOT use `tone="default"`, `tone="transparent"` or `tone="muted"` — those v3 values were removed

      Show the JSX for all four cards.
  assertions:
    - type: llm-rubric
      template: task-completion
      criteria:
        - Successful payment uses tone='positive'
        - Expiring credit card uses tone='caution' (not 'critical')
        - Failed transaction uses tone='critical'
        - Standard document uses tone='neutral' or no tone prop
        - Each toned card (positive/caution/critical) includes an associated icon
        - No card uses tone='default', tone='transparent' or tone='muted'
    - type: llm-rubric
      template: code-correctness
      criteria:
        - Icons are imported from per-icon '@sanity/icons' subpaths (e.g. CheckmarkCircleIcon from '@sanity/icons/CheckmarkCircle'), not as named exports from the '@sanity/icons' root
        - Card is imported from '@sanity/ui'
        - All cards use density="regular" and no border, radius, shadow or padding prop is passed to Card
  baseline:
    enabled: true
    rubric: full

