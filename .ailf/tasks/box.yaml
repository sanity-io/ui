- id: sanity-ui-v5-box-scale-integer-vs-css-string-props
  mode: literacy
  title: 'Box — spacing-scale integers vs CSS-string sizing props'
  area: sanity-ui-v5
  docCoverage: false
  referenceSolution: reference-solutions/box/box-scale-integer-vs-css-string-props.tsx
  context:
    docs:
      - id: a0cb0c96-7426-4fef-b3a0-af7a0b5742f9
        path: ui/components/box
        locator:
          kind: sanity-content-lake
          projectId: 3do82whm
          dataset: next
          documentId: a0cb0c96-7426-4fef-b3a0-af7a0b5742f9
          perspective: rqgKNUCe1
        reason: 'Box prop value model — scale-step integers (padding, margin, radius) vs CSS strings (width, height)'
  prompt:
    text: |
      Using Box and Card from the `@sanity/ui` package, build a 260px-wide sidebar Box with padding 4 containing an inner Card. Show the JSX.
  assertions:
    - type: llm-rubric
      template: task-completion
      criteria:
        - The sidebar Box width is set as the string "260px"
        - padding on the Box is set as the integer 4
        - The inner Card gets its padding and corner radius from the density prop, not from padding or radius props
    - type: llm-rubric
      template: code-correctness
      criteria:
        - Box spacing-scale props (padding, margin, radius) are integers with no quotes
        - CSS-value props (width, height) are strings
        - Does not write padding="4" or width={260}
        - Box and Card are imported from the '@sanity/ui' package
    - type: contains-any
      value: ['width="260px"', "width='260px'", "width={'260px'}", 'width={"260px"}']
    - type: not-contains
      value: 'padding="4"'
    - type: contains
      value: 'padding={4}'
  baseline:
    enabled: true
    rubric: full
