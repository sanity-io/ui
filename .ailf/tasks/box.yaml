- id: sanity-ui-v5-box-vs-card-structural-layout
  mode: literacy
  title: 'Box — use Box instead of Card for structural regions'
  area: sanity-ui-v5
  docCoverage: false
  context:
    docs:
      - id: a0cb0c96-7426-4fef-b3a0-af7a0b5742f9
        path: ui/components/box
        locator:
          kind: sanity-content-lake
          projectId: 3do82whm
          dataset: next
          documentId: a0cb0c96-7426-4fef-b3a0-af7a0b5742f9
          perspective: rqgKNUCe1
        reason: 'Box usage guidelines — when to use and when not to use'
      - id: e751904e-4bbe-4ac6-8bb3-a91d445bded4
        path: ui/components/card
        locator:
          kind: sanity-content-lake
          projectId: 3do82whm
          dataset: next
          documentId: e751904e-4bbe-4ac6-8bb3-a91d445bded4
          perspective: rqgKNUCe1
        reason: 'Card usage guidelines — for comparison'
  prompt:
    text: |
      You are building a Sanity Studio-style layout using the Sanity UI design system.

      Using VStack, Box, Card, and Flex from the `@sanity/ui` package, implement the following layout:

      1. A navigation sidebar rendered as a <nav> landmark with a right border
      2. Inside it, a header strip containing a title and a close button, separated from the rest by a bottom border
      3. A scrollable content area below the header
      4. A main content region (rendered as <main>) that fills the remaining space and uses column flex direction

      Requirements:
      - Use the correct component for each region — structural layout regions must NOT use Card
      - The <nav> must have an aria-label
      - The main region must support overflow scrolling for its content

      Show the complete JSX structure with correct component choices and props.
  assertions:
    - type: llm-rubric
      template: task-completion
      criteria:
        - Renders the nav as Box or Flex (not Card) with as='nav' and aria-label
        - Renders the main content region as Flex (not Card) with as='main' and flexDirection='column'
        - Uses Box or Flex (not Card) for the header strip inside the nav
        - Applies borderRight to the nav Box/Flex and borderBottom to the header Box/Flex
    - type: llm-rubric
      template: code-correctness
      criteria:
        - Box and Flex are imported from the '@sanity/ui' package
        - No Card component is used for the sidebar, toolbar, or main area
        - No onClick is added to any Box or Flex element
  baseline:
    enabled: true
    rubric: full

- id: sanity-ui-v5-box-as-prop-semantic-aria
  title: 'Box — semantic elements via the as prop with ARIA requirements'
  mode: literacy
  area: sanity-ui-v5
  docCoverage: false
  context:
    docs:
      - id: a0cb0c96-7426-4fef-b3a0-af7a0b5742f9
        path: ui/components/box
        locator:
          kind: sanity-content-lake
          projectId: 3do82whm
          dataset: next
          documentId: a0cb0c96-7426-4fef-b3a0-af7a0b5742f9
          perspective: rqgKNUCe1
        reason: 'Box as prop — semantic elements and ARIA requirements'
  prompt:
    text: |
      Using the Box component from the `@sanity/ui` package, demonstrate correct usage of the `as` prop for three different scenarios:

      1. A page with a primary navigation that requires an accessible label
      2. A page section that should register as a landmark in screen readers
      3. A Box used purely as a spacing wrapper (no semantic meaning needed)

      For each scenario:
      - Show the correct `as` value and any required ARIA attributes

      Do NOT use <button>, <dialog>, or <select> via the as prop.
  assertions:
    - type: llm-rubric
      template: task-completion
      criteria:
        - as='nav' includes aria-label when multiple navs could exist on the page
        - as='section' includes either a heading child or aria-label to register as a landmark
        - The spacing wrapper example uses as='div' or omits as (default div), with no unnecessary ARIA
        - No behavioral elements (button, dialog, select) are used with as prop
    - type: llm-rubric
      template: code-correctness
      criteria:
        - ARIA attributes are correctly applied — not missing on landmarks that require them
        - Box is imported from the '@sanity/ui' package
        - JSX is syntactically valid
  baseline:
    enabled: true
    rubric: full

- id: sanity-ui-v5-box-styling-props-versus-inline-styles
  mode: literacy
  title: 'Box — use styling props instead inline styles to adjust appearance'
  area: sanity-ui-v5
  docCoverage: false
  context:
    docs:
      - id: a0cb0c96-7426-4fef-b3a0-af7a0b5742f9
        path: ui/components/box
        locator:
          kind: sanity-content-lake
          projectId: 3do82whm
          dataset: next
          documentId: a0cb0c96-7426-4fef-b3a0-af7a0b5742f9
          perspective: rqgKNUCe1
        reason: "Box Best practices — dos and don'ts for how to use Box"
  prompt:
    text: |
      You are building a piece of the interface that needs a light gray background, padding on all sides, a height of 100vh, a minimum width of 260 pixels and a border on the right.

      Using  Box from the `@sanity/ui` package, implement the following layout:

      1. A container rendered as a <div> with a right border
      2. Inside it, a single <span> with "Text" as its child
      3. The container should have a minimum width of 260px, height of 100vh, a light gray background, a 1px gray border on the right side only, and padding on top, left, right, and bottom.

      Requirements:
      - Use Box's styling props to set the following visual attributes
        - background
        - padding
        - border right
        - min width
        - height
      - No inline styles can be used

      Show the complete JSX structure with correct component choices and props.
  assertions:
    - type: llm-rubric
      template: task-completion
      criteria:
        - Renders the component as Box with no style attribute
        - The Box has the following props
          - tone="neutral"
          - padding={[ANY INTEGER]}
          - borderRight={true}
          - minWidth="260px"
          - height="100vh"
    - type: llm-rubric
      template: code-correctness
      criteria:
        - Box is imported from the '@sanity/ui' package
        - No Flex or Card component is used
        - No inline styles exist on the component
  baseline:
    enabled: true
    rubric: full

