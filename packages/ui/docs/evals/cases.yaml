  # Real pre-fix agent output. `marginBottom` on Heading/Text used to be
  # labelled a violation here, and counted as the most common layout-prop
  # mistake (1,218 Heading and 1,030 Text occurrences). It is valid: v5
  # TypographyProps extends MarginProps. That snippet is now a conforming case
  # below; these two still break the rule.
  - kind: violates
    guidelines: ['no-layout-props-on-typography-or-actions']
    code:
      - |
        import { Text } from '@sanity/ui-v5'
        export function FieldLabel({ children }) {
          return <Text as="label" size={0} weight="medium" display="block" marginBottom={1}>{children}</Text>
        }
      - |
        import { Button, Flex } from '@sanity/ui-v5'
        export function Actions({ onSave }) {
          return <Flex gap={2}><Button text="Save" onClick={onSave} width="fill" marginTop={2} /></Flex>
        }
  - kind: conforms
    guidelines: ['no-layout-props-on-typography-or-actions']
    code:
      # Margins are props on Text and Heading. A judgment that fires here is wrong.
      - |
        import { Heading, Text, VStack } from '@sanity/ui-v5'
        export function Section({ title, body }) {
          return (
            <VStack>
              <Heading as="h4" size={0} marginBottom={3}>{title}</Heading>
              <Text size={0} muted as="p" marginTop={2}>{body}</Text>
            </VStack>
          )
        }
      - |
        import { Box, Heading, Text, VStack } from '@sanity/ui-v5'
        export function Section({ title, body }) {
          return (
            <VStack gap={3}>
              <Heading as="h4" size={0}>{title}</Heading>
              <Box marginTop={2}><Text size={0} muted as="p">{body}</Text></Box>
            </VStack>
          )
        }
      - |
        import { Text } from '@sanity/ui-v5'
        export function Caption({ children }) {
          return <Text size={0} muted align="center">{children}</Text>
        }
  # Real pre-fix agent output. `style={{}}` on a DS component is the single
  # largest error class in the corpus: 13,670 CSS properties across the run
  # history, led by width (1,021), height (854), minWidth (771), padding
  # (534) — all of which have a prop.
  - kind: violates
    guidelines: ['prop-before-inline-style']
    code:
      - |
        import { Box, Flex, Text } from '@sanity/ui-v5'
        export function Panel({ children }) {
          return (
            <Box style={{ width: '100%', overflowX: 'auto' }}>
              <Flex alignItems="center" gap={2} style={{ backgroundColor: '#f5f5f5', borderRadius: '4px', padding: '0 12px' }}>
                <Text size={0}>{children}</Text>
              </Flex>
            </Box>
          )
        }
      - |
        import { Card } from '@sanity/ui-v5'
        export function Tile({ children }) {
          return <Card density="regular" style={{ height: '100%' }}>{children}</Card>
        }
  - kind: conforms
    guidelines: ['prop-before-inline-style']
    code:
      - |
        import { Box, Flex, Text } from '@sanity/ui-v5'
        export function Panel({ children }) {
          return (
            <Box width="fill" overflowX="auto">
              <Flex alignItems="center" gap={2} radius={2} paddingX={3}>
                <Text size={0}>{children}</Text>
              </Flex>
            </Box>
          )
        }
      # The legitimate case: no prop path exists for either of these, so the
      # rule deliberately allows them. A judgment that fires here is wrong.
      - |
        import { Box } from '@sanity/ui-v5'
        export function Sheet({ children }) {
          return <Box style={{ transform: 'translateY(-2px)', backgroundImage: 'linear-gradient(#000, #fff)' }}>{children}</Box>
        }
  # The `no-emojis` family. The shared rule and its three component
  # refinements are labelled together on the same case wherever a snippet
  # breaks both: an emoji in a Heading violates `heading-no-emojis` and
  # `no-emojis` at once, the same refines-chain shape as the icon-only cases
  # above. Fixtures necessarily contain the emojis the rule forbids.
  - kind: violates
    guidelines: ['heading-no-emojis', 'no-emojis']
    code:
      - |
        import { Heading } from '@sanity/ui-v5'
        export function SectionTitle() {
          return <Heading as="h2" size={2}>🚀 Deployments</Heading>
        }
      - |
        import { Heading } from '@sanity/ui-v5'
        export function SectionTitle() {
          return <Heading as="h2" size={2}>Deployments ✅</Heading>
        }

  - kind: conforms
    guidelines: ['heading-no-emojis', 'heading-no-icons', 'no-emojis']
    code:
      - |
        import { Heading } from '@sanity/ui-v5'
        export function SectionTitle() {
          return <Heading as="h2" size={2}>Deployments</Heading>
        }
      # The symbol sits on an adjacent element with its own accessible name,
      # not inside the Heading. A judgment that fires here is wrong.
      - |
        import { Badge, Flex, Heading } from '@sanity/ui-v5'
        import { RocketIcon } from '@sanity/icons/Rocket'
        export function SectionTitle() {
          return (
            <Flex alignItems="center" gap={2}>
              <Heading as="h2" size={2}>Deployments</Heading>
              <Badge tone="positive" text="Live" iconStart={RocketIcon} />
