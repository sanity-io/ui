# Labelled cases for the guidelines that carry `rel: agent-test`.
#
# Shape follows ESLint's RuleTester, which eslint-plugin-sanity-ui already
# uses for the same rules: a case is explicitly valid or invalid for a named
# rule. Nothing is inferred from absence.
#
#   kind        `conforms` or `violates` — what this code does to the
#               guidelines named below. A `must` guideline's natural
#               illustration is a conforming case; a `must-not`'s is a
#               violating one.
#   guidelines  the guideline item ids this case is evidence for. A case is
#               UNLABELLED for any guideline it does not name — not a
#               negative. Omission used to mean 'clean', which silently
#               mislabelled every existing case whenever a guideline was
#               added.
#   code        the snippet, or a list of snippets sharing this entry's kind
#               and guidelines. Each is its own data point; the list only
#               saves repeating the labels. Small on purpose: a case needing
#               a screenful of context tests retrieval, not judgment.
#
# `guidelines` rather than `rules` because DSDS retires that word —
# terms.yaml: `use: item / not: entry, rule, criterion` — and because
# Tools/dsds-jev-eval already uses 'rules' for ESLint rule ids.
#
# To add a case: append one entry. To make another guideline assessable: add
# `checks`/`$extensions` to it in the corpus, then add at least one
# conforming and one violating case naming it here.

cases:
  - kind: violates
    guidelines: ['no-onclick-on-card']
    code:
      - |
        import { Card, Text } from '@sanity/ui-v5'
        export function Row({ item, onOpen }) {
          return <Card onClick={() => onOpen(item)}><Text>{item.title}</Text></Card>
        }
      - |
        import { Card, Text } from '@sanity/ui-v5'
        export function ClickableCard({ item, onOpen }) {
          return <Card padding={3} onClick={() => onOpen(item)}><Text>{item.title}</Text></Card>
        }
  - kind: conforms
    guidelines: ['no-onclick-on-card']
    code:
      - |
        import { Card, PressArea, Text } from '@sanity/ui-v5'
        export function Row({ item, onOpen }) {
          return <PressArea onClick={() => onOpen(item)} aria-label={`Open ${item.title}`}>
            <Card><Text>{item.title}</Text></Card>
          </PressArea>
        }
      - |
        import { Card, PressArea, Text } from '@sanity/ui-v5'
        export function ClickableCard({ item, onOpen }) {
          return <PressArea onClick={() => onNavigate(item)} aria-label={`Go to ${item.title}`}>
            <Card density="compact"><Text>Go to {item.title}</Text></Card>
          </PressArea>
        }
  - kind: violates
    guidelines: ['flex-no-onclick']
    code:
      - |
        import { Flex, Text } from '@sanity/ui-v5'
        export function Toolbar({ onSelect }) {
          return <Flex gap={2} onClick={onSelect}><Text>Filter</Text></Flex>
        }
      - |
        import { HStack, Text } from '@sanity/ui-v5'
        export function Bar({ onOpen }) {
          return <HStack gap={2} onClick={() => onOpen()}><Text>Open</Text></HStack>
        }
  - kind: conforms
    guidelines: ['flex-no-onclick']
    code:
      - |
        import { Button, Flex } from '@sanity/ui-v5'
        export function Toolbar({ onSelect }) {
          return <Flex gap={2}><Button text="Filter" onClick={onSelect} /></Flex>
        }
      - |
        import { Flex, PressArea, Text } from '@sanity/ui-v5'
        export function Toolbar({ onSelect }) {
          return <PressArea onClick={onSelect}><Flex gap={2}><Text>Filter</Text></Flex>
        }
  - kind: violates
    guidelines: ['spacing-is-an-integer-scale-token']
    code: |
      import { Box, Text } from '@sanity/ui-v5'
      export function Panel() {
        return <Box padding="2"><Text>Body</Text></Box>
      }
  - kind: conforms
    guidelines: ['spacing-is-an-integer-scale-token']
    code: |
