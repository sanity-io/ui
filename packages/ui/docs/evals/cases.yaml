  - kind: violates
    guidelines: ['button-icon-only-accessible-name', 'icon-only-control-needs-name']
    code: |
      import { IconButton } from '@sanity/ui-v5'
      import { TrashIcon } from '@sanity/icons/Trash'
      export function DeleteAction({ onDelete }) {
        return <IconButton icon={TrashIcon} onClick={onDelete} />
