  - kind: conforms
    guidelines: ['badge-no-emojis', 'no-emojis']
    code:
      - |
        import { Badge } from '@sanity/ui-v5'
        import { CheckmarkIcon } from '@sanity/icons/Checkmark'
        export function PublishState() {
