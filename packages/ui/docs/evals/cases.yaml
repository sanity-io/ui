  - kind: conforms
    guidelines: ['no-emojis']
    code:
      # The carve-out: `no-emojis` permits user reactions. The emoji is
      # user-supplied content, not a design decision. A judgment that fires
      # here is wrong.
      - |
        import { Button, Flex } from '@sanity/ui-v5'
        export function Reactions({ reactions, onToggle }) {
          return (
            <Flex gap={1}>
              {reactions.map((reaction) => (
                <Button
                  key={reaction.id}
                  text={`${reaction.emoji} ${reaction.count}`}
                  onClick={() => onToggle(reaction.id)}
                />
              ))}
            </Flex>
          )
        }
  # `prefer-component-over-native-element`. The most-violated rule in the
  # mined corpus that had no question: 332 of 2,176 real generated files
  # (15%) trip `sanity-ui/no-native-html-elements`.
  #
  # The negative cases matter more than usual here. The rule covers a closed
  # list — div, span, p, button, h1-h6, ul, ol, li, a, hr — and the corpus
  # positively requires native `<table>` markup (see the data-table and
  # sortable-data-table chunks). A judgment that fires on a table is wrong.
  - kind: violates
    guidelines: ['prefer-component-over-native-element']
    code:
      - |
        import { Text } from '@sanity/ui-v5'
        export function Panel({ title, body }) {
          return (
            <div className="panel">
              <h2>{title}</h2>
              <p>{body}</p>
            </div>
          )
        }
      - |
        import { Card } from '@sanity/ui-v5'
        export function Actions({ onSave, href }) {
          return (
            <Card>
              <button onClick={onSave}>Save</button>
              <a href={href}>Read more</a>
              <hr />
            </Card>
          )
        }
  - kind: conforms
    guidelines: ['prefer-component-over-native-element']
    code:
      - |
        import { Box, Divider, Heading, Text } from '@sanity/ui-v5'
        export function Panel({ title, body }) {
          return (
            <Box padding={3}>
              <Heading as="h2" size={2}>{title}</Heading>
              <Text size={1}>{body}</Text>
              <Divider />
            </Box>
          )
        }
      # The carve-out: table markup has no component equivalent and the
      # corpus's own data-table chunks require it. A judgment that fires
      # here is wrong.
      - |
        import { Box, Text } from '@sanity/ui-v5'
        export function AssetTable({ rows }) {
          return (
            <Box padding={3}>
              <table>
                <thead>
                  <tr><th scope="col"><Text size={0}>Name</Text></th></tr>
                </thead>
                <tbody>
                  {rows.map((r) => (
                    <tr key={r.id}><td><Text size={1}>{r.name}</Text></td></tr>
                  ))}
                </tbody>
              </table>
            </Box>
          )
        }

  # ═══ Judgment questions, moved from template-cases.yaml on 2026-09-23 ═══
  # ── tone-is-semantic → tone-signals-state ────────────────────────────────
  # The decorative half of the rule: a tone with no real state behind it.
  - kind: violates
    guidelines: ['tone-signals-state']
    code:
      - |
        import { Text } from '@sanity/ui-v5'
        export function Greeting({ name }) {
          return <Text size={3} tone="critical">Welcome back, {name}</Text>
        }
      - |
        import { Badge } from '@sanity/ui-v5'
        export function CategoryTag({ category }) {
          return <Badge tone="positive" text={category} />
        }
      # Tone used to make a section title stand out. Nothing is in a state.
      - |
        import { Heading } from '@sanity/ui-v5'
        export function GettingStarted() {
          return <Heading as="h2" size={2} tone="caution">Getting started</Heading>
        }
  - kind: conforms
    guidelines: ['tone-signals-state']
    code:
      - |
        import { Text } from '@sanity/ui-v5'
        export function Greeting({ name }) {
          return <Text size={3}>Welcome back, {name}</Text>
        }
      - |
        import { Badge } from '@sanity/ui-v5'
        export function PublishState() {
          return <Badge tone="positive" text="Published" />
        }
      # A plain category carries no state, so it stays neutral.
      - |
        import { Badge } from '@sanity/ui-v5'
        export function CategoryTag({ category }) {
          return <Badge text={category} />
        }
      # Emphasis comes from size and heading level, not tone.
      - |
        import { Heading } from '@sanity/ui-v5'
        export function GettingStarted() {
          return <Heading as="h2" size={3}>Getting started</Heading>
        }

  # ── color-alone → second-channel-required ────────────────────────────────
  # Meaning carried by one channel only. The status dot is colour and nothing
  # else, so it breaks both rules. Tone plus descriptive text is the pairing
  # rule's concern alone: the broad rule accepts any visible text, so those
  # cases are labelled for tone-paired-with-second-channel only.
  - kind: violates
    guidelines: ['second-channel-required', 'tone-paired-with-second-channel']
    code:
      - |
        import { Icon } from '@sanity/ui-v5'
        import { CircleIcon } from '@sanity/icons/Circle'
        export function SyncDot({ ok }) {
          return <Icon icon={CircleIcon} tone={ok ? 'positive' : 'critical'} />
        }
  # Tone and text, no icon. The text describes the event but never names the state.
  - kind: violates
    guidelines: ['tone-paired-with-second-channel']
    code:
      - |
        import { Badge } from '@sanity/ui-v5'
        export function ErrorMarker() {
          return <Badge tone="critical" text="Failed" />
        }
      - |
        import { Text } from '@sanity/ui-v5'
        export function SuccessMessage() {
          return <Text tone="positive">Process complete</Text>
        }
      - |
        import { Text } from '@sanity/ui-v5'
        export function TimeoutMessage() {
          return <Text tone="critical">Timed out</Text>
        }
  - kind: conforms
    guidelines: ['second-channel-required', 'tone-paired-with-second-channel']
    code:
      - |
        import { Flex, Icon, Text } from '@sanity/ui-v5'
        import { ErrorOutlineIcon } from '@sanity/icons/ErrorOutline'
