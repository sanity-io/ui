kind: component
id: tabs-panel
name: Tabs.Panel
description: The content for one tab. It shows when its value matches the selected Tabs value, and stays hidden otherwise.
metadata:
  tags: [tabs, tablist, tabpanel, navigation, views, tab, sections]
  status:
    status: beta
sections:
  - kind: guidelines
    for: all
    framing: how-to-use
    items:
      - id: tabpanel-tabindex
        level: must
        statement: Tab.Panel has a default tabindex of 0 to enable focusing when there is no focusable content. Tab panels with focusable content should unset the panel’s tabindex so that the panel’s first focusable component receives focus instead.
      - id: tabpanel-value-matches-tab
        level: must
        statement: Give Tabs.Panel the same value as its Tabs.Tab.
      - id: don-conditionally-render-tabpanels-hidden
        level: must-not
        statement: "Don't render Tabs.Panel conditionally. Unselected panels stay mounted with display none. Their content keeps its state."
      - level: should
        statement: Use layout props such as padding on Tabs.Panel for spacing inside the panel.
  - kind: guidelines
    for: agent
    framing: how-to-use
    items:
      - level: must-not
        statement: Don't set id or aria-labelledby on Tabs.Panel. It sets both from value.

refs:
  - to: tabs
    rel: relates-to
    note: The family this panel belongs to.
  - to: tabs-list
    rel: relates-to
    note: The row that holds the tabs.
  - to: tab
    rel: relates-to
    note: The button that selects this panel.

sourceFiles:
  - platform: react
    file: packages/ui/src/components/tabs/Tabs.tsx
imports:
  - platform: react
    code: import { Tabs } from '@sanity/ui'
    package: '@sanity/ui'
$extensions:
  com.sanity.ui:
    implementationStatus:
      context: Implementation status. Lets a tool tell a component that is coming from one that does not exist, without parsing the status note.
      implemented: true
