kind: component
id: checkbox
name: Checkbox
description: Enables the selection of an item or option.
metadata:
  tags: [checkbox, form, input, selection, boolean, check, multi-select, toggle, indeterminate]
  status:
    status: beta
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To select one or more items within a group in a multiselect context.
      - level: should
        statement: As a way to select or deselect every item from a list or table.
      - level: should
        statement: To toggle one or more boolean options within a form context.
      - level: should-not
        statement: When selection triggers immediate feedback. Use Switch instead.
        alternatives:
          - to: switch
      - level: should-not
        statement: 'When only one item from a group can be selected. Use Radio or Select (5–20 options) instead.'
        alternatives:
          - to: radio
          - to: select
  - kind: guidelines
    for: all
    framing: how-to-use
    items:
      - refs:
          - to: forms#programmatic-name-required
            rel: same-as
      - level: must-not
        statement: Use Checkbox without an accessible name. A nameless checkbox is announced as an unlabeled checkbox.
      - level: must
        statement: In table and list rows, name each Checkbox with aria-labelledby pointing at the cell that names the row. Use aria-label for a header checkbox such as select all, which has no visible text beside it.
        example:
          title: Row selection with aria-labelledby
          description: Select-all and per-row checkboxes in a table. Each row checkbox points at its name cell.
          ref:
            href: ../examples/checkbox-2.tsx
            rel: source
      - refs:
          - to: forms#pair-checked-with-onchange
            rel: same-as
      - refs:
          - to: forms#stack-options-vertically
            rel: same-as
      - level: should
        statement: Use indeterminate for a parent checkbox that controls a group with mixed state.
      - level: should
        statement: Use a fieldset and legend for groups of checkboxes.
      - refs:
          - to: forms#stack-fields-vertically
            rel: same-as
      - refs:
          - to: shared-foundations#error-state-never-disabled
            rel: same-as
      - level: must-not
        statement: "Don't use indeterminate for form options. It represents a mixed group state, not a value. Use it only for a 'select all' parent."
      - refs:
          - to: forms#no-mixed-controlled-uncontrolled
            rel: same-as
  - kind: guidelines
    for: agent
    framing: how-to-use
    items:
      - id: checkbox-has-accessible-name
        level: must
        statement: Every Checkbox has an accessible name from a linked label element, aria-label or aria-labelledby. Checkbox has no label prop.
        checkedBy: manual
      - refs:
          - to: forms#error-prop-needs-visible-message
            rel: same-as
      - level: must-not
        statement: "Using a checked state that represents a negative action ('Don't subscribe'). Instead: Map checked to the positive action ('Subscribe to the newsletter')."
  - kind: guidelines
    for: all
    title: Content
    tags: [content]
    items:
      - refs:
          - to: content-guidelines#sentence-case-all-system-set
            rel: same-as
      - level: should
        statement: Pair the checked state with the positive action ("Send me weekly digests", not "Don't send me weekly digests").
      - refs:
          - to: forms#label-no-trailing-period
            rel: same-as
  - kind: guidelines
    for: all
    title: Accessibility
    description: 'Target conformance: WCAG Level AA.'
    tags: [accessibility]
    items:
      - level: must
        statement: The Checkbox has no name of its own (WCAG 4.1.2). Name it through a linked label element, aria-label or aria-labelledby.
      - level: should
        statement: 'With hasError, the Checkbox sets aria-invalid on the input and shows error styling on the mark. Pair it with a visible error message that the input describes.'
      - refs:
          - to: forms#aria-label-overrides-name
            rel: same-as
      - refs:
          - to: forms#aria-labelledby-references-name
            rel: same-as
      - refs:
          - to: forms#label-available-to-screen-readers
            rel: same-as
      - refs:
          - to: forms#error-described-in-text
            rel: same-as
      - refs:
          - to: forms#border-contrast
            rel: same-as
  - kind: section
    for: all
    freeform:
      - title: Example — controlled value with a linked label
        body: |-
          ```
          import { Checkbox } from '@sanity/ui'

          <Checkbox
            id="newsletter"
            checked={subscribed}
            onChange={(e) => setSubscribed(e.currentTarget.checked)}
          />
          <label htmlFor="newsletter">Subscribe to the newsletter</label>
          ```

          Use `checked` and `onChange` to control the checkbox from React state. `indeterminate` does not fire `onChange`. Set it imperatively to reflect a mixed group state, and toggle `checked` alongside it from the same handler. The `id` and `htmlFor` pair gives the checkbox its name. Use `aria-label` instead when the text can't be rendered visibly.
alternatives:
  - to: switch
    note: boolean toggle that takes effect immediately
  - to: radio
    note: single-select within a group
  - to: select
    note: single or multi-select dropdown when there are many options
refs:
  - href: https://www.figma.com/design/5mhVqXlldJEEB2VWZeKQ4i/Sanity-UI?node-id=31897-66
    rel: design
    role: Figma component (v5)
sourceFiles:
  - platform: react
    file: packages/ui/src/components/checkbox/Checkbox.tsx
imports:
  - platform: react
    code: import { Checkbox } from '@sanity/ui'
    package: '@sanity/ui'
traits:
  - traitType: state
    kind: boolean
    id: enabled
    description: Standard unchecked state.
  - traitType: state
    kind: boolean
    id: focused
    description: Focus ring on :focus-visible.
  - traitType: state
    kind: boolean
    id: checked
    description: Filled mark with a checkmark icon.
  - traitType: state
    kind: boolean
    id: indeterminate
    description: Filled mark with a horizontal-line icon for mixed group state.
  - traitType: state
    kind: boolean
    id: disabled
    description: Muted appearance, removed from tab order.
  - traitType: state
    kind: boolean
    id: hasError
    description: Red mark styling and aria-invalid on the input for a validation error.
$extensions:
  com.sanity.ui:
    implementationStatus:
      context: Implementation status. Lets a tool tell a component that is coming from one that does not exist, without parsing the status note.
      implemented: true
    migrationGuide:
      context: 'Migration guide for this component, covering the codemod and the changes it cannot make. Held as an extension because it is temporary: migration tooling and porting agents read it, and it should be dropped when Sanity UI 3 support ends.'
      guidance: |-
        The v5 Checkbox is the input itself, with no label wrapper. It has no visible text and no name of its own. In v3, a separate `<label htmlFor>` named the Checkbox. In v5, link a label element with `id` and `htmlFor`, or use `aria-label` or `aria-labelledby`.

        ### Detailed list of differences

        | v3 pattern | v5 pattern | Notes |
        | :---- | :---- | :---- |
        | `<label htmlFor="x">Label</label><Checkbox id="x" />` | `<Checkbox id="x" /><label htmlFor="x">Label</label>` | Same association. Use `Text as="label"` if you need the Sanity UI text styles |
        | `<Checkbox checked />` | `<Checkbox checked />` | Same `checked`/`onChange` API |
        | `<Checkbox indeterminate />` | `<Checkbox indeterminate />` | Same, set imperatively on the underlying input |
        | All native `<input>` attributes (`name`, `value`, `required`, `aria-*`) | Forwarded unchanged | Pass them as before |

        ### Breaking changes

        - **`customValidity` removed.** Handle validation outside the component, and pass `hasError` to show the error state.

        ### Codemod

        Run `pnpx @sanity/ui-codemod latest:checkbox --paths <paths> --toPackage @sanity/ui`. It updates the import and warns about `customValidity`. It does not rewrite `label` props or wrapping label elements. Fix those by hand.
