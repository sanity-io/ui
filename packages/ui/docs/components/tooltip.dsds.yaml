kind: component
id: tooltip
name: Tooltip
description: A floating text label that shows information when a user hovers or focuses an element.
metadata:
  tags: [tooltip, label, hover, focus, supplementary, help, hint, description]
  status:
    status: beta
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To explain the function of an icon-only button.
      - level: should
        statement: To provide supplementary information that enhances understanding but isn't critical for the task.
      - level: should-not
        statement: The information is necessary for the user to complete a task. Use inline text or banners instead.
      - level: should-not
        statement: To contain interactive elements such as buttons. Use Popover instead.
        alternatives:
          - to: popover
      - level: should-not
        statement: When you are restating text that is already visible on the screen.
      - refs:
          - to: tooltip#no-tooltip-on-disabled
            rel: same-as
      - id: tooltip-only-on-interactive-elements
        level: must-not
        statement: Never use Tooltip on a non-interactive element — text, a Badge, an Indicator, an Avatar, a bare Icon, or a Box or Card. Its trigger must be a button, a link, or a PressArea. Either put the information in visible text or wrap the non-interactive element in a PressArea.
  - kind: guidelines
    for: all
    framing: how-to-use
    items:
      - level: must
        statement: For an icon-only trigger, give the trigger its own aria-label and make it focusable (use IconButton or Button, not a bare Icon). Tooltip's content sets aria-describedby — a description, not the trigger's accessible name; a bare Icon is aria-hidden by default and cannot receive focus.
        tags: [accessibility]
      - level: should
        statement: Limit text to a maximum of 50 characters where possible.
      - level: should
        statement: "Start with a verb if describing an action (for example, 'Edit profile' rather than 'Profile editor')."
      - level: should
        statement: Omit the Tooltip entirely when the label text is already visible next to the trigger.
      - level: should
        statement: "Wrap a toolbar of tooltipped triggers in TooltipGroup so the row's tooltips behave as one group."
        uses:
          - to: tooltip-group
      - level: must-not
        statement: Don't put interactive content like links or buttons inside a Tooltip — use Popover instead.
        alternatives:
          - to: popover
      - id: no-tooltip-on-disabled
        level: must-not
        statement: A disabled or loading control does not trigger a Tooltip, because keyboard users cannot reach it. If the Tooltip must show on a disabled element, wrap that element in a PressArea and put the Tooltip on the PressArea.
        refines:
          - to: accessibility-guidelines#disabled-control-no-tooltip
  - kind: guidelines
    for: agent
    framing: how-to-use
    items:
      - level: must
        statement: Tooltip needs the entry-file setup in the `installation` guide. It is built on the Interest Invokers API, which is not yet in every browser, and without that setup tooltips do not show where it is missing.
      - level: must
        statement: Tooltip must appear on both hover and keyboard focus — not hover-only.
        tags: [accessibility]
      - level: must
        statement: Tooltip wraps a single child element. It clones that child to inject aria-describedby — you do not need to wire it manually.
      - level: must
        statement: The child of Tooltip must be a single React element (not a string, fragment, or array).
      - level: must
        statement: The child must render an element that accepts interestfor — in practice a button or an anchor with href. Button and IconButton both work; a Box, Text, or bare Icon does not.
      - level: must
        statement: The label prop is called content. There is no text prop. Do not use `title` instead — it compiles, but it renders the browser's own tooltip, not this one.
      - level: must
        statement: There is no disabled prop. To suppress a tooltip conditionally, render the trigger with or without the Tooltip wrapper.
      - level: should
        statement: Set portal only when an ancestor clips or misplaces the label.
      - level: may
        statement: Set the same anchorName on a Tooltip and a Popover to attach both to one trigger, with the Tooltip nested inside the Popover.
      - refs:
          - to: tooltip#no-tooltip-on-disabled
            rel: same-as
      - level: must-not
        statement: 'Using Tooltip for critical task information. Instead: Show necessary information inline — users should not be required to hover to find it.'
  - kind: section
    for: agent
    freeform:
      - title: How it works
        body: |-
          Tooltip renders its label as a popover hint and clones its child to attach `aria-describedby` and the `interestfor` attribute that shows it. Hover and focus handling comes from the Interest Invokers API rather than from React event handlers.

          Clicking the trigger hides the label and suppresses it until the pointer leaves the trigger or focus moves away. This keeps a tooltip from covering whatever the click opened — a Popover on the same button, for example.

          Positioning is CSS, not JavaScript. `placement` maps to a class that uses CSS anchor positioning, and viewport flipping comes from `position-try-fallbacks`.
  - kind: section
    for: all
    freeform:
      - title: Setup
        body: |-
          Tooltip is built on the Interest Invokers API (the `interestfor` attribute), which is not yet available in every browser. The entry-file setup in the `installation` guide loads a polyfill, only where the browser lacks native support. Without it, tooltips will not show in those browsers.

alternatives:
  - to: popover
    note: Use when the floating content is interactive or contains more than a short label. Share a trigger with a Tooltip via `anchorName`
refs:
  - href: https://www.figma.com/design/5mhVqXlldJEEB2VWZeKQ4i/Sanity-UI?node-id=33882-565
    rel: design
    role: Figma component (v5)
  - to: tooltip-group
    rel: relates-to
    note: Wrap a toolbar of tooltips so they behave as one group.
  - to: button
    rel: relates-to
    note: The most common trigger for a Tooltip
  - to: icon-button
    rel: relates-to
    note: The most common trigger for a Tooltip
  - to: indicator
    rel: relates-to
    note: Use a Tooltip for an indicator's meaning only when no adjacent text label is present. Wrap the Indicator in a PressArea so the Tooltip has a trigger.
sourceFiles:
  - platform: react
    file: packages/ui/src/components/tooltip/Tooltip.tsx
imports:
  - platform: react
    code: import { Tooltip } from '@sanity/ui'
    package: '@sanity/ui'
traits:
  - traitType: variant
    kind: enum
    id: placement
    description: >-
      Position of the floating label relative to its trigger. Keeps the label in
      the viewport and clear of whatever sits next to the trigger. Each value
      declares a fallback on the opposite side, so the browser flips the label
      rather than letting it overflow.
    values:
      - id: top
        description: Above the trigger, centered.
      - id: top-start
        description: Above, aligned to the start edge.
      - id: top-end
        description: Above, aligned to the end edge.
      - id: right
        description: >-
          Right of the trigger, centered. For narrow sidebars where vertical
          space is limited.
      - id: right-start
        description: Right, aligned to the start edge.
      - id: right-end
        description: Right, aligned to the end edge.
      - id: bottom
        description: >-
          Below the trigger, centered. The default. The safe default for a
          toolbar or an inline control.
      - id: bottom-start
        description: Below, aligned to the start edge.
      - id: bottom-end
        description: Below, aligned to the end edge.
      - id: left
        description: >-
          Left of the trigger, centered. For narrow sidebars where vertical
          space is limited.
      - id: left-start
        description: Left, aligned to the start edge.
      - id: left-end
        description: Left, aligned to the end edge.
  - traitType: variant
    kind: boolean
    id: portal
    description: >-
      Renders the floating label into document.body through a React portal
      instead of inline. Rarely needed — the label already sits in the browser's
      top layer, so overflow ancestors do not clip it. Reach for it when an
      ancestor with transform, filter, or contain creates a containing block
      that breaks anchor positioning. Portalled content does not render during
      server-side rendering.
$extensions:
  com.sanity.ui:
    implementationStatus:
      context: Implementation status. Lets a tool tell a component that is coming from one that does not exist, without parsing the status note.
      implemented: true
    migrationGuide:
      context: 'Migration guide for this component, covering the codemod and the changes it cannot make. Held as an extension because it is temporary: migration tooling and porting agents read it, and it should be dropped when Sanity UI 3 support ends.'
      guidance: |-
        The v3 Tooltip was positioned by Floating UI, rendered through a portal, and configured with a large set of props. The v5 Tooltip is built on Interest Invokers, the Popover API, and CSS anchor positioning, so most of that configuration is now handled by the browser.

        ### **Key differences**

        - **`content` keeps its name.** The prop that holds the label is `content` in both versions.
        - **Positioning is CSS, not JavaScript.** Floating UI is gone. `placement` maps to a CSS class, and viewport flipping uses `position-try-fallbacks`.
        - **No `disabled` prop.** Conditionally render the trigger with or without the Tooltip wrapper instead.
        - **`TooltipDelayGroupProvider` is replaced by `TooltipGroup`**, which is a rendered element rather than a context provider.
        - **Card styling props are gone.** v3 rendered a `TooltipCard` and accepted `radius`, `shadow`, `padding`, and `scheme`. v5 applies a fixed surface style.
        - **No arrow.** The `arrow` prop is removed.
        - **The polyfills entry point is now required.** See Setup.

        ### **Detailed list of differences**

        | v3 prop | v5 prop | Notes |
        | :---- | :---- | :---- |
        | `content` | `content` | Same purpose |
        | `children` | `children` | Now required, and must render a `<button>` or `<a href>` |
        | `placement` | `placement` | Same values, same default (`'bottom'`) |
        | `portal` | `portal` | Now `boolean` only; v3 also accepted a portal name string |
        | `disabled` | — | Removed. Conditionally render the Tooltip wrapper instead. |
        | `arrow` | — | Removed |
        | `animate` | — | Removed. The show and hide transition is always applied. |
        | `fallbackPlacements`, `allowedAutoPlacements` | — | Removed. CSS `position-try-fallbacks` flips the tooltip automatically. |
        | `boundaryElement` | — | Removed. The viewport is the boundary. |
        | `radius`, `shadow`, `padding`, `scheme` | — | Removed. The tooltip surface has a fixed style. |
        | `zOffset`, `onActivate` | — | Removed. The browser's top layer handles stacking. |
        | — | `anchorName` | New. Share one trigger between a Tooltip and a Popover. |
        | `TooltipDelayGroupProvider` | `TooltipGroup` | Now a rendered element, not a context provider |
