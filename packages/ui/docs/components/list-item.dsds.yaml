kind: component
id: list-item
name: List.Item
description: A non-interactive row inside a List.
metadata:
  tags: [list, item, row, li]
  status:
    status: beta
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: A row that shows content and takes no action, such as a summary entry or a read-only record.
      - level: should-not
        statement: A row the user can press, select or navigate. Use List.ItemButton instead.
        alternatives:
          - to: list-item-button
  - kind: guidelines
    for: all
    framing: how-to-use
    items:
      - id: don-list-item-outside-list
        level: must-not
        statement: Don't use List.Item outside of a List. It renders as <li> and requires a <ul> or <ol> parent.
      - level: should
        statement: Lay out the row's children yourself, for example with Flex, when the row holds an image and text. List.Item adds no padding and no density.
      - id: don-place-more-one-interactive
        level: must-not
        statement: Don't place an interactive element, such as a button or link, inside List.Item. Use List.ItemButton for the row's action, so it has one press target.
  - kind: guidelines
    for: agent
    framing: how-to-use
    items:
      - refs:
          - to: list#subcomponents-not-named-exports
            rel: same-as
      - level: must-not
        statement: Do not use List.Item for an interactive row. Use List.ItemButton, which takes `density`, `start`, `end`, `text` and `subtext`. List.Item has none of these props.
      - level: must-not
        statement: Do not pass paddingX, paddingY, padding or margin to List.Item. Those props are not part of its API.
      - level: must-not
        statement: Don't pass `trailing` to List.Item. Use `end` on List.ItemButton.
  - kind: guidelines
    for: all
    title: Accessibility
    tags: [accessibility]
    items:
      - level: should
        statement: A decorative preview image (`List.ItemImage`) whose `alt` repeats the row's own name announces that name twice. Mark it decorative instead.
      - level: must-not
        statement: '`List.Item` renders as `<li>`. Do not use it outside a `<ul>` or `<ol>`.'
  - kind: section
    for: agent
    freeform:
      - title: Composition pattern
        body: |-
          List.Item is always a direct child of List. Its children render as the row's content. It has no start or end slots, because those belong to List.ItemButton.

          ```tsx
          import { Flex, List, Text } from '@sanity/ui'

          <List>
            <List.Item>
              <Flex align="center" gap={3}>
                <List.ItemImage src="/thumb.jpg" alt="" />
                <Text size={1}>My document</Text>
              </Flex>
            </List.Item>
          </List>
          ```

          For a row the user can press, put a List.ItemButton inside the List.Item instead. See **List.ItemButton** for the density values and slots.

  - kind: section
    for: all
    freeform:
      - title: Examples
        body: |-
          A non-interactive row, with a thumbnail and text:

          ```tsx
          import { Flex, List, Text } from '@sanity/ui'

          <List>
            <List.Item>
              <Flex align="center" gap={3}>
                <List.ItemImage src="/thumb.jpg" alt="Document thumbnail" />
                <Text size={1}>My document</Text>
              </Flex>
            </List.Item>
          </List>
          ```

          A pressable row. The List.ItemButton is the only child, so the row has one press target:

          ```tsx
          import { List } from '@sanity/ui'

          <List>
            <List.Item>
              <List.ItemButton text="My document" subtext="Last edited 2 hours ago" />
            </List.Item>
          </List>
          ```
refs:
  - href: https://www.figma.com/design/5mhVqXlldJEEB2VWZeKQ4i/Sanity-UI?node-id=32243-2
    rel: design
    role: Figma component (v5)
  - to: list
    rel: relates-to
    note: The parent component. See **List** for full compound component docs
  - to: list-item-button
    rel: relates-to
    note: The pressable row. Put it inside List.Item
  - to: list-item-image
    rel: relates-to
    note: Thumbnail image for the row
sourceFiles:
  - platform: react
    file: packages/ui/src/components/list/List.tsx
imports:
  - platform: react
    code: import { List } from '@sanity/ui'
    package: '@sanity/ui'

$extensions:
  com.sanity.ui:
    implementationStatus:
      context: Implementation status. Lets a tool tell a component that is coming from one that does not exist, without parsing the status note.
      implemented: true
