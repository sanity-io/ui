kind: component
id: menu-content
name: Menu.Content
description: The list that holds a contextual menu's items. It renders with role="menu", lays its items out in a column, and needs an accessible name.
metadata:
  tags: [menu, content, list, menu-content, role-menu]
  status:
    status: beta
sections:
  - kind: guidelines
    for: all
    framing: how-to-use
    items:
      - level: must
        statement: Give Menu.Content an `aria-label` or `aria-labelledby`. The type requires one of them.
      - level: must
        statement: Put only Menu.Button, Menu.Submenu and Menu.Divider inside Menu.Content. Other children break the role="menu" pattern.
      - level: should
        statement: Show at least two items. For a single action, use a Button.
  - kind: guidelines
    for: agent
    framing: how-to-use
    items:
      - level: must-not
        statement: Don't set `role` on Menu.Content. It sets role="menu" itself.
  - kind: guidelines
    for: all
    title: Accessibility
    tags: [accessibility]
    items:
      - level: must
        statement: Name every Menu.Content with its trigger's text, through `aria-labelledby`, or with an `aria-label` that says what the menu does, such as 'Document actions'.
alternatives:
  - to: menu
refs:
  - to: menu
    rel: relates-to
    note: The parent component. Menu passes its `menu` prop to this part.
  - to: menu-button
    rel: relates-to
    note: The items this list holds.
  - to: menu-submenu
    rel: relates-to
    note: A nested list this list can hold.

sourceFiles:
  - platform: react
    file: packages/ui/src/components/menu/Menu.tsx
imports:
  - platform: react
    code: import { Menu } from '@sanity/ui'
    package: '@sanity/ui'
$extensions:
  com.sanity.ui:
    implementationStatus:
      context: Implementation status. Lets a tool tell a component that is coming from one that does not exist, without parsing the status note.
      implemented: true
