kind: component
id: eyebrow
name: Eyebrow
description: Displays a small amount of text that contextualizes or categorizes a subject.
metadata:
  tags: [typography, eyebrow, label, category, kicker, uppercase, font]
  status:
    status: stable
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: "A short category name or content type placed directly above a Heading (for example, 'Case study', 'New feature', 'Guide')."
      - level: should
        statement: Context for a group of titles in a list, so readers can tell what each title leads to.
      - level: should-not
        statement: To label a TextInput, Select or other input. Use a label element linked with htmlFor instead.
      - level: should-not
        statement: For body copy, descriptions, metadata, or long strings. Use Text instead.
        alternatives:
          - to: text
      - level: should-not
        statement: As a heading element, or to title a group of navigation links. Use Heading instead.
        alternatives:
          - to: heading
      - id: status-state-published-draft-beta
        level: should-not
        statement: For a status or state (Published, Draft, Beta). Use Badge instead — Eyebrow carries no state semantics.
        alternatives:
          - to: badge
  - kind: guidelines
    for: all
    framing: how-to-use
    items:
      - id: eyebrow-no-manual-uppercase
        level: must
        statement: Pass eyebrow text as written, with no text-transform override and no all-caps string literal — the component applies the uppercase treatment and letter-spacing itself.
        example:
          title: How to satisfy this
          description: Read the source string and confirm it is not typed in all caps. Confirm no style or className sets text-transform on the Eyebrow.
        checkedBy: manual
      - id: eyebrow-paired-with-heading
        level: should
        statement: Place each Eyebrow directly above the Heading it categorizes, inside a shared stack with a small gap (gap={1} or gap={2} in a VStack).
        example:
          title: How to satisfy this
          description: Confirm the Eyebrow and its Heading share a VStack parent with a small gap. Confirm the Eyebrow is not used on its own without an adjacent Heading.
        checkedBy: manual
      - level: should
        statement: Keep Eyebrow text to one to three words, with no trailing punctuation.
      - level: must-not
        statement: 'Using Eyebrow as the label in a form field. Instead: Use a label element linked to the input with htmlFor.'
        alternatives:
          - to: text
            note: Set as='label' and link it with htmlFor.
  - kind: guidelines
    for: agent
    framing: how-to-use
    items:
      - level: must
        statement: weight and tone take a single value. Only size, align, truncate, and the margin props accept responsive arrays.
      - level: must-not
        statement: Do not use Eyebrow without an adjacent Heading — its purpose is to introduce one.
  - kind: guidelines
    for: all
    title: Content
    tags: [content]
    items:
      - refs:
          - to: content-guidelines#sentence-case-all-system-set
            rel: same-as
      - level: should
        statement: Keep to a single word or short phrase. "Case study," not "This is a case study about our redesign process."

  - kind: guidelines
    for: all
    title: Accessibility
    tags: [accessibility]
    items:
      - level: must
        statement: Eyebrow text must maintain 4.5:1 contrast against the background for standard text and 3:1 for large text (WCAG 1.4.3 AA). Check contrast again with `muted` set, since it lowers the color level.
      - level: should
        statement: Eyebrow defaults to `<span>`, an inline, non-semantic element. Use `as="p"` if the eyebrow needs to read as its own block-level text node.
      - level: should
        statement: An eyebrow is visually distinct but carries no heading semantics of its own — it does not create a new heading level or landmark. Don't rely on it to convey document structure; the Heading it precedes still needs the correct `as` level.
      - id: eyebrow-tone-needs-second-channel
        level: must-not
        statement: Do not use `tone` alone to convey a category's meaning — pair it with an icon or make sure the same meaning is stated in the adjacent heading or body text.

        refines:
          - to: shared-foundations#tone-paired-with-second-channel
alternatives:
  - to: text
    note: Body copy, descriptions, and metadata
  - to: badge
    note: Inline status labels with semantic tone
  - to: heading
    note: The semantic heading Eyebrow introduces
sourceFiles:
  - platform: react
    file: packages/ui/src/components/eyebrow/Eyebrow.tsx
imports:
  - platform: react
    code: import { Eyebrow } from '@sanity/ui'
    package: '@sanity/ui'
traits:
  - traitType: variant
    kind: enum
    id: size
    description: Font size drawn from the label type tokens.
    values:
      - id: '0'
        description: Smallest. Dense list contexts where each item has its own eyebrow.
      - id: '1'
        description: Small. Compact card headers.
      - id: '2'
        description: Standard (default). Above a section or page heading.
      - id: '3'
        description: Large. Above a prominent, large-size Heading.
      - id: '4'
        description: Extra large. Rare — hero sections with a large Heading below.
  - traitType: variant
    kind: enum
    id: weight
    description: Font weight.
    values:
      - id: regular
        description: Rare. A deliberately quieter eyebrow next to a heavy heading.
      - id: medium
        description: A softer alternative to the default.
      - id: semibold
        description: Standard weight (default). Reads as a label at a glance.
      - id: bold
        description: Rare. Extra emphasis when the eyebrow must compete with its heading.
  - traitType: variant
    kind: enum
    id: tone
    description: Semantic text color.
    values:
      - id: neutral
        description: Default. No semantic meaning.
      - id: suggest
        description: Suggested or recommended content.
      - id: positive
        description: Healthy, successful, or completed content.
      - id: caution
        description: Content that needs attention.
      - id: critical
        description: Deprecated, failing, or blocking content.
  - traitType: variant
    kind: boolean
    id: muted
    description: Reduces visual prominence. Applies the muted variant of the current tone when tone is also set.
  - traitType: variant
    kind: boolean
    id: trim
    description: Removes extra whitespace above and below the text box for precise alignment with an adjacent Heading.
$extensions:
  com.sanity.ui:
    implementationStatus:
      context: Implementation status. Lets a tool tell a component that is coming from one that does not exist, without parsing the status note.
      implemented: true
    migrationGuide:
      context: 'Migration guide for this component, covering the codemod and the changes it cannot make. Held as an extension because it is temporary: migration tooling and porting agents read it, and it should be dropped when Sanity UI 3 support ends.'
      codemod: |-
        Eyebrow replaces v3's small, uppercase text component used above headings. Form field labels are a different role: use a label element linked with htmlFor, not Eyebrow.

        `accent` is remapped to `tone="suggest"`. `textOverflow` is replaced by `truncate` — both `"ellipsis"` and `"clip"` map to `truncate={1}`. `flex`, `width`, and `maxWidth` are removed; the codemod converts them to an inline `style` object. The codemod also adds `as="div"` and `trim` so migrated markup keeps v3's block-level behavior and vertical spacing.

        Run the codemod: `pnpx @sanity/ui-codemod latest:label --paths <paths> --toPackage @sanity/ui`.
      guidance: |-
        Eyebrow replaces v3's small, uppercase, all-caps text component used above headings and section titles. Form field labels are a different role: use a label element linked with htmlFor, not Eyebrow.

        ### Key differences

        - v5 components use CSS classes with a static stylesheet instead of `styled-components`.
        - The v3 component rendered a `<div>` by default. `Eyebrow` renders `<span>`. The codemod adds `as="div"` explicitly. This keeps migrated instances' original layout behavior.
        - `accent` replaced by `tone`. v3's `accent` was a boolean; `tone` takes a full semantic value. The codemod maps `accent` to `tone="suggest"`.
        - `textOverflow="ellipsis"` replaced by `truncate={1}`. v3's `textOverflow` only supported single-line truncation; `truncate` also accepts values above `1` for multi-line clamping.
        - `flex`, `width`, and `maxWidth` removed. The v3 component accepted these as scale-based layout props. `Eyebrow` accepts none of them — wrap it in `Box` for layout control instead.
        - `trim` added. The codemod sets `trim={true}` on every migrated instance to preserve v3's vertical spacing.
        - Margin props added. `Eyebrow` now accepts `margin`, `marginX`, `marginY`, and per-side margin props.

        ### Detailed list of differences

        | v3 prop | v5 prop (`Eyebrow`) | Notes |
        | :---- | :---- | :---- |
        | `accent={true}` | `tone="suggest"` | Renamed and remapped. `accent` was boolean; `tone` takes a semantic value. |
        | `textOverflow="ellipsis"` | `truncate={1}` | Renamed and remapped. `textOverflow="clip"` also maps to `truncate={1}`. |
        | `flex` | — | Removed. Wrap in `Box` and set `flex`/`flexGrow` there. |
        | `width` | — | Removed. Wrap in `Box` and set `width` there. |
        | `maxWidth` | — | Removed. Wrap in `Box` and set `maxWidth` there. |
        | — (default `as="div"`) | `as="div"` | The codemod sets this explicitly, since `Eyebrow` defaults to `"span"`. |
        | — | `trim` | The codemod sets `trim={true}` to match v3's vertical spacing. |
        | — | `margin*` | New. `Eyebrow` accepts margin props directly. |
        | `align`, `muted`, `size`, `weight` | Same | Carry over unchanged. |

        ### Breaking changes

        - `accent` prop removed. The v3 component's accent has no `Eyebrow` boolean equivalent — use `tone="suggest"`.
        - `textOverflow` prop removed. The v3 `textOverflow="ellipsis"` does nothing on `Eyebrow`. Use `<Eyebrow truncate={1}>`.
        - `flex`, `width`, and `maxWidth` props removed. `Eyebrow` accepts no layout props — move them to a wrapping `Box`.
        - `styled-components` no longer used. Custom styled-components extensions of the v3 component will not work on `Eyebrow`.
        - The default rendered element changes from `<div>` to `<span>` unless `as="div"` is set explicitly.

        ### Codemod

        A codemod is available to ease the changes above. Run the command below with the path to the file or folder you want to migrate. Use spaces to pass more than one path.

        ```
        pnpx @sanity/ui-codemod latest:label --paths <paths> --toPackage @sanity/ui
        ```

        The codemod renames the element to `Eyebrow`, remaps `accent` and `textOverflow`, and converts `flex`/`width`/`maxWidth` to an inline `style` object. It also adds `as="div"` and `trim={true}` to every migrated instance. This keeps existing layouts at their original spacing and block-level behavior. If a component instance cannot be migrated automatically or needs manual review, the codemod inserts a comment prefixed with "UI-POC-CODEMOD TODO."
