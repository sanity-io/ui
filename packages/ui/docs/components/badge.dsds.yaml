kind: component
id: badge
name: Badge
description: A label used to communicate status, category, count, or other metadata inline.
metadata:
  tags: [badge, status, label, tag, count, indicator, chip, published, draft]
  status:
    status: beta
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: Communicating status (Published, Draft, Deprecated, In Review).
      - level: should
        statement: Labeling categories, tags, or types inline within a list or table.
      - level: should
        statement: Showing counts or numeric indicators.
      - level: should-not
        statement: For actions — use Button instead.
        alternatives:
          - to: button
      - level: should-not
        statement: For long text. Badges are for scanning, not reading.
  - kind: guidelines
    for: agent
    framing: when-to-use
    title: When to use
    items:
      - level: should-not
        statement: Don't use Badge for inline status prose. Use Text with a tone instead.
        alternatives:
          - to: text
  - kind: guidelines
    for: all
    framing: how-to-use
    items:
      - level: must
        statement: 'A toned Badge''s `text` leads with the state, such as "Error" or "Warning: expires soon", or the Badge carries an `iconStart` that reinforces it. Text that describes the item instead, such as "Failed" or "Timed out", needs the icon.'
        refines:
          - to: shared-foundations#tone-paired-with-second-channel
      - level: should
        statement: Use `text` as the primary way to add a Badge label. `children` should only be used in rares cases where internal text needs specific styling.
      - refs:
          - to: content-guidelines#label-length-by-element
            rel: same-as
      - level: should
        statement: Use tone='neutral' for plain metadata and a semantic tone (positive, suggest, caution, critical) for status.
        refines:
          - to: shared-foundations#tone-signals-state
      - level: should
        statement: Use the iconStart prop for a leading icon. Don't nest an Icon as a child — iconStart sizes and aligns it against the badge's own padding automatically.
      - level: should-not
        statement: Don't place more than 3 badges in a single row. Group related statuses or use a table for dense data.
      - level: must-not
        statement: Don't use Badge for actions. Use Button instead.
        alternatives:
          - to: button
      - id: badge-no-emojis
        level: must-not
        statement: Never put an emoji in a Badge's `text` or `children`. If the badge needs a symbol, use `iconStart` instead..
        checks:
          - href: ../evals/cases.yaml
            role: agent-test
        checkedBy: assisted
        refines:
          - to: shared-foundations#no-emojis
        $extensions:
          io.jev:
            type: boolean
  - kind: guidelines
    for: agent
    framing: how-to-use
    items:
      - level: should-not
        statement: Don't use `children` to add text to Badge unless it is critical to add custom styling. Use the `text` prop instead.
      - level: must-not
        statement: Never place an icon within Badge within `children`. `iconStart` is used for adding icons.
      - level: must-not
        statement: 'Using Badge as a clickable element without keyboard handling. Instead: Use Button for any interactive control.'
  - kind: guidelines
    for: all
    title: Accessibility
    tags: [accessibility]
    items:
      - level: should
        statement: '**Badge is not an icon-plus-count control.** When Badge shows a bare count next to another icon (a comment icon with a "3" badge), the icon still needs its own alternative — Badge''s visible number does not substitute for it. See the Accessibility foundation''s icon-and-value rule.'
      - level: should
        statement: '**Not a substitute for `aria-selected` or `aria-current`.** Badge conveys status inline; it does not set any ARIA state on a parent row. If the badge marks the current or selected item in a list, add `aria-current` or `aria-selected` on the row itself.'
alternatives:
  - to: button
  - to: text
refs:
  - href: https://www.figma.com/design/5mhVqXlldJEEB2VWZeKQ4i/Sanity-UI?node-id=32275-2381
    rel: design
    role: Figma component (v5)
sourceFiles:
  - platform: react
    file: packages/ui/src/components/badge/Badge.tsx
imports:
  - platform: react
    code: import { Badge } from '@sanity/ui'
    package: '@sanity/ui'
traits:
  - traitType: variant
    kind: enum
    id: tone
    description: Semantic color of the badge.
    values:
      - id: neutral
        description: Gray. Default. No semantic meaning.
      - id: positive
        description: Green. Success, published, healthy.
      - id: suggest
        description: Purple. Educational moments, promotions, soft nudges.
      - id: caution
        description: Yellow/amber. Needs attention, in review.
      - id: critical
        description: Red. Error, failed, rejected, deprecated.
$extensions:
  com.sanity.ui:
    implementationStatus:
      context: Implementation status. Lets a tool tell a component that is coming from one that does not exist, without parsing the status note.
      implemented: true
