kind: component
id: select
name: Select
description: Allows the user to choose one option from medium-size set (5-20) within a dropdown list.
metadata:
  tags: [select, dropdown, form, input, single-select, option, picker, optgroup]
  status:
    status: beta
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To select from a medium set of options (5–20).
        refines:
          - to: forms#choose-control-by-option-count
      - level: should
        statement: To group related options under headings. Select renders native `optgroup` labels.
      - refs:
          - to: forms#choose-control-by-option-count
            rel: same-as
      - level: should-not
        statement: When there are more than 20 options to choose from, or when the options are asynchronously loaded. Use a TextInput with a filtered list instead.
        alternatives:
          - to: text-input
      - level: should-not
        statement: When there are 4 or fewer options inside a form context. Use Radio instead.
        alternatives:
          - to: radio
      - level: should-not
        statement: To allow freeform text input. Use TextInput.
        alternatives:
          - to: text-input
      - level: should-not
        statement: When an option needs an icon, a description, or any markup beyond text. Options are native `option` elements and hold text only. Use a Popover with Buttons instead.
        alternatives:
          - to: popover
      - level: should-not
        statement: When selecting an option navigates to another location. Use Link instead.
        alternatives:
          - to: link
  - kind: guidelines
    for: all
    framing: how-to-use
    items:
      - id: pass-options-children-select-renders
        level: must
        statement: Pass the options as children. Select renders a native `select`. Each option is an `option` element, and `optgroup` groups them.
        checkedBy: manual
      - refs:
          - to: forms#pair-with-visible-label
            rel: same-as
      - refs:
          - to: content-guidelines#sentence-case-all-system-set
            rel: same-as
        tags: [content]
      - level: should
        statement: Constrain the width from the parent. Select fills its container. Wrap it in a Box or a grid cell to size it.
      - level: should
        statement: Keep select option labels concise and lead with the word that distinguishes the option. Labels are scanned, not read, and a label longer than the field runs under the picker icon.
        tags: [content]
      - level: should
        statement: Label an `optgroup` with the trait its options share, not with a verb.
        tags: [content]
      - level: should
        statement: Pre-select a default option when a clear default exists.
      - level: should
        statement: Order select options logically. When in doubt, order alphabetically or numerically.
      - level: should
        statement: Use `density="loose"` in forms with wide spacing. `regular` is the default and sets padding to space 1; `loose` sets it to space 2.
      - refs:
          - to: forms#stack-fields-vertically
            rel: same-as
      - checkedBy: manual
        refs:
          - to: shared-foundations#error-state-never-disabled
            rel: same-as
      - level: must-not
        statement: Don't add your own dropdown arrow. Select draws the picker icon itself, and the icon ignores pointer events.
        checkedBy: manual
      - level: must-not
        statement: Don't mix Select and a Popover option list in a related group of filter UI — the group should exclusively use one pattern.
        checkedBy: manual
  - kind: guidelines
    for: agent
    framing: how-to-use
    items:
      - level: should
        statement: Use a visible label in form contexts.
      - level: must-not
        statement: 'Do not pass `fontSize`, `padding`, `radius` or `space`. Select does not accept them. Instead: use `density` for padding; the type size and the radius are fixed.'
        checkedBy: manual

  - kind: guidelines
    for: all
    title: Accessibility
    tags: [accessibility]
    items:
      - refs:
          - to: forms#label-available-to-screen-readers
            rel: same-as
      - refs:
          - to: forms#programmatic-name-required
            rel: same-as
      - level: should
        statement: '**Border contrast.** The default border must reach 3:1 against the field background (WCAG 1.4.11) — check this in both light and dark themes.'
      - level: should
        statement: '**Error text, not error color alone.** `hasError` sets `aria-invalid="true"` and recolors the border and the text. None of that says what is wrong. Describe the problem in text and link it with `aria-describedby` (WCAG 3.3.1).'
      - level: should
        statement: '**A disabled Select cannot be focused or clicked.** It leaves the tab order and sets `pointer-events: none`, so no hover or click reaches it and it is hidden from screen readers. Never rely on a disabled field to explain why it is unavailable.'
      - refs:
          - to: forms#error-described-in-text
            rel: same-as
      - refs:
          - to: forms#error-prop-needs-visible-message
            rel: same-as
      - refs:
          - to: forms#border-contrast
            rel: same-as
  - kind: section
    for: all
    freeform:
      - title: Example - Controlled value
        body: |-
          ```
          import { Select } from '@sanity/ui'

          <Select
            aria-label="Choose a region"
            value={region}
            onChange={(e) => setRegion(e.currentTarget.value)}
          >
            <optgroup label="Europe">
              <option value="eu-west">Ireland</option>
              <option value="eu-central">Frankfurt</option>
            </optgroup>
            <option value="us-east">Virginia</option>
          </Select>
          ```

          Select forwards the native `select` events. Use `value` and
          `onChange` to drive the field from React state. Read the new
          value from `event.currentTarget.value`. Use `defaultValue` to pre-select
          an option and leave the field uncontrolled.

alternatives:
  - to: radio
    note: Single-select from 2–4 options, all visible at once
  - to: text-input
    note: Single-select from a large or async option set, with filtering
  - to: checkbox
    note: Multi-select from a small option set
  - to: popover
    note: A list whose items need icons, descriptions, or navigation
refs:
  - href: https://www.figma.com/design/NWmchNlsNdG66VBaCsTdSL/pjo-ui4-component-buildout?node-id=29-1944
    rel: design
    role: Figma component
sourceFiles:
  - platform: react
    file: packages/ui/src/components/select/Select.tsx
imports:
  - platform: react
    code: import { Select } from '@sanity/ui'
    package: '@sanity/ui'
traits:
  - traitType: state
    kind: boolean
    id: enabled
    description: Resting state. Backdrop background with a high separator border. The border carries the states below; the background only moves for `disabled`.
  - traitType: state
    kind: boolean
    id: hovered
    description: The border shifts one lightness step — darker in light mode, lighter in dark mode. In the error state it shifts from the error border.
  - traitType: state
    kind: boolean
    id: focused
    description: Focus outline on `:focus-visible`, offset from the border.
  - traitType: state
    kind: boolean
    id: disabled
    description: 'Inert background and a low separator border, with the text in the inert foreground color and the picker icon greyed to match. `pointer-events: none`, so the field is not focusable, not clickable, and leaves the tab order.'
  - traitType: state
    kind: boolean
    id: error
    description: Set with the `hasError` prop. The border turns the error separator color, the text turns the error foreground color, and the select gains `aria-invalid="true"`. It carries no message — supply that yourself.
$extensions:
  com.sanity.ui:
    implementationStatus:
      context: Implementation status. Lets a tool tell a component that is coming from one that does not exist, without parsing the status note.
      implemented: true
    migrationGuide:
      context: 'Migration guide for this component, covering the codemod and the changes it cannot make. Held as an extension because it is temporary: migration tooling and porting agents read it, and it should be dropped when Sanity UI 3 support ends.'
      guidance: |-
        The sizing props are gone. One `density` prop replaces them, and validation is now a boolean named `hasError`.

        ### Detailed list of differences

        | v3 pattern | v5 pattern | Notes |
        | :---- | :---- | :---- |
        | `<Select fontSize={2} />` | `<Select />` | The type size is fixed by the component at body size 1 |
        | `<Select padding={3} space={3} />` | `<Select density="loose" />` | `density` is `regular` or `loose`. It sets padding to space 1 or space 2, so neither value reproduces a v3 `padding={3}` exactly |
        | `<Select radius={2} />` | `<Select />` | The radius is fixed at step 2, {radius-2} |
        | `<Select customValidity="Pick one" />` | `<Select hasError />` plus your own message | `hasError` sets `aria-invalid` and recolors the border and text. It renders no text |
        | `<Select icon={ChevronDownIcon} />` | `<Select />` | The picker icon is drawn by the component |
        | All native `<select>` attributes | Forwarded unchanged | Pass them as before |

        ### Breaking changes

        - **No `fontSize`, `padding`, `radius` or `space`.** Passing them has no effect. Use `density` for padding.
        - **`customValidity` is replaced by `hasError`.** The old prop set the native validation message. The new one is styling plus `aria-invalid`. You own the message and where it appears. The `has` prefix marks it as a validation boolean.
        - **The width is no longer yours to set on the component.** Select fills its container. Size it from the parent.
