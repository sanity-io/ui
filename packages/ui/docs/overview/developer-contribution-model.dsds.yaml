kind: sanity.guide
id: developer-contribution-model
name: Developer contribution model
description: 'How a developer moves a working recipe into a pull request against @sanity/ui, and what that PR must include: branch naming, PR description, code formatting, Storybook stories, prop documentation, tests, and docs.'
metadata:
  tags:
    - contribution
    - developer
    - pull request
    - recipe
    - triage
    - branch naming
    - storybook
    - typedocs
    - testing
    - documentation
    - checklist
    - '@sanity/ui'
  status:
    status: stable
sections:
  - kind: guidelines
    for: agent
    framing: how-to-use
    items:
      - level: must
        statement: Name branches `<type>/<short-description>` using type feat, fix, docs, or refactor, 3-5 words, lowercase, hyphen-separated, with no ticket numbers.
      - level: must
        statement: Include What, Why, and How to review sections in every PR description. New components additionally need an API surface table and an Open questions section.
      - level: must
        statement: Write components as .tsx with explicit prop types exported alongside the component, one component per file, a named Props type (not inline types), React.forwardRef for anything rendering a DOM element, and named exports only — never a default export.
      - level: must
        statement: Include a Storybook story for every new component and every major change to an existing one, covering all tone/mode/state variants, both light and dark scheme, a composition example, and edge cases (long text, empty state, max children, disabled).
      - level: must
        statement: Give every public prop a TSDoc comment describing behavior, not accepted values. Do not enumerate inherited props, use @type, quote simple prop names, use @optional, or note defaults in description text — use @defaultValue only when the default is not undefined.
      - level: must
        statement: Cover a PR with tests across five categories before requesting review — accessibility, performance, visual regression, functional unit tests, and AI fluency — or explicitly mark a category N/A with a reason.
      - level: must
        statement: For new components, create a doc file with a complete props table and at least one working code example; usage guidelines, best practices, accessibility, and content sections are encouraged but not required.
      - level: must-not
        statement: Do not hardcode colors, spacing, font sizes, shadows, or border radii. Use design tokens through component props (padding, tone, radius, gap) or CSS custom properties.
  - kind: steps
    for: all
    ordered: true
    title: The three-step contribution model
    items:
      - title: 'Step 1: Build a recipe'
        description: |-
          A recipe is a working composition of existing Sanity UI components. It solves a real feature need. It lives in your project — not in `@sanity/ui` itself.

          Build the recipe with existing primitives (Card, VStack, Flex, Button, etc.). The more you use what the system already provides, the more accessibility, theming, and dark mode support come for free.

          You can stop here. The recipe works in your project. No PR needed. No review needed. You ship your feature and move on.
      - title: 'Step 2: Propose a contribution'
        description: |-
          If the recipe solves a problem other teams would face, propose graduating it into `@sanity/ui`. Ideally, three or more existing use cases would benefit from this recipe.

          Bring it to a triage sync. Share what kind of contribution this is (new component, changing an existing component, bug fix, etc.). Show the working code. Walk through the API — what props does it accept, what does it render, how does it compose with other primitives.

          The design system team and the contributor decide together whether it belongs in the core library. If it doesn't graduate, you still have a working recipe.
      - title: 'Step 3: Open a pull request'
        description: |-
          If the team agrees the recipe should become a core component, the contributor opens a PR against the `@sanity/ui` repo. The design system team collaborates on the PR — this is a partnership, not a gate.

          The rest of this guide describes how to format that PR.
  - kind: steps
    for: all
    ordered: false
    title: PR checklist
    items:
      - title: Branch follows `<type>/<description>` naming
      - title: PR description has What / Why / How to review sections
      - title: TypeScript types are exported for all public props
      - title: Component forwards refs
      - title: Named exports only (no default export)
      - title: No hardcoded colors, spacing, font sizes, or shadows — uses design tokens only
      - title: Story file created or updated (`ComponentName.stories.tsx`)
      - title: Stories cover all visual variants (tones, modes, states)
      - title: Light and dark scheme shown
      - title: Interactive controls wired to props
      - title: Story linked in PR description under "How to review"
      - title: Every public prop has a TSDoc comment
      - title: Docstrings describe behavior, not accepted values (types handle that)
      - title: No @type, @optional, or quoted simple prop names
      - title: '@defaultValue used only when default is not undefined'
      - title: Defaults are not noted in description text
      - title: Inherited props are not re-documented
      - title: 'Accessibility: axe-core scan passes, keyboard works, screen reader names correct'
      - title: 'Performance: renders within benchmark threshold (or N/A)'
      - title: 'Visual regression: snapshots captured for all states/schemes (or N/A)'
      - title: 'Functional: unit tests cover props, interactions, and edge cases'
      - title: 'AI fluency: LLM can build a working example from the docs (or N/A)'
      - title: Component doc file created or updated
      - title: Props table is complete
      - title: At least one code example included
  - kind: section
    for: all
    freeform:
      - title: Overview
        body: 'This model mirrors the designer contribution model. Same philosophy: low-process, high-trust, always walk away with something usable. The difference is that the workflow goes through code — branches, pull requests, and tests.'
  - kind: section
    for: all
    freeform:
      - title: Branch naming
        body: |-
          Use the format:

          ```
          <type>/<short-description>
          ```

          | Type | When to use | Example |
          | --- | --- | --- |
          | `feat` | New component or new prop on an existing component | `feat/combobox` |
          | `fix` | Bug fix | `fix/button-focus-ring-dark-mode` |
          | `docs` | Documentation only | `docs/card-selected-pattern` |
          | `refactor` | Internal change with no API impact | `refactor/flex-css-modules` |

          Keep the branch name to 3–5 words, lowercase, hyphen-separated. No ticket numbers in branch names — put those in the PR description.
      - title: PR description
        body: |-
          Every PR needs three sections. Copy this template:

          ```markdown
          ## What

          One or two sentences describing what the PR adds or changes. Name the component
          and the user-facing behavior.

          ## Why

          Link to the triage decision, the issue, or the feedback that motivated this
          change. If this graduated from a recipe, link to the original component or pattern.

          ## How to review

          Steps to see the change in action. Could be:
          - A Storybook story to open
          - A test command to run
          - A before/after screenshot
          ```

          For new components, also add:

          ```markdown
          ## API surface

          | Prop | Type | Default | Description |
          | --- | --- | --- | --- |
          | (list every public prop) | | | |

          ## Open questions

          - (anything the contributor is unsure about and wants feedback on)
          ```
      - title: Code formatting
        body: |-
          Follow the conventions already in `@sanity/ui`. The short version:

          - **TypeScript.** All components are `.tsx`. All props have explicit types. Export the props type alongside the component (`export type ComboboxProps = { ... }`).
          - **One component per file.** The file name matches the component name: `Combobox.tsx` exports `Combobox`.
          - **Props interface, not inline types.** Define a named `Props` or `ComponentNameProps` type. Do not inline complex types in the function signature.
          - **Forward refs.** Every component that renders a DOM element must use `React.forwardRef`. Tooltip, Popover, and other overlay components depend on this.
          - **No default exports.** Use named exports only.
          - **CSS.** Follow the existing styling approach in the repo (CSS modules or styled-components — match what's in place, do not introduce a new approach).
          - **Design tokens, not hardcoded values.** Do not hardcode colors, spacing, font sizes, shadows, or border radii. Use the theme's design tokens through component props (`padding`, `tone`, `radius`, `gap`). Hardcoded values break dark mode, ignore tone contexts, and diverge from the spacing scale.
      - title: Storybook story
        body: |-
          Each new component and each major change to an existing component must include a Storybook story. The story is the review artifact — designers and developers on the design system team use it to evaluate the component before approving the PR.

          **What to include**

          - **One story per visual variant.** Show each combination of `tone`, `mode`, and `state` the component supports.
          - **Interactive controls.** Use Storybook args/controls to let reviewers toggle props without editing code.
          - **Light and dark scheme.** Include at least one story that renders the component in both `scheme="light"` and `scheme="dark"`.
          - **Composition example.** Show the component used in context — inside a Card, alongside other primitives, in a realistic layout.
          - **Edge cases.** Long text, empty state, maximum children, disabled state.

          **File location**

          Place the story file next to the component:

          ```
          src/
            components/
              Combobox/
                Combobox.tsx
                Combobox.test.tsx
                Combobox.stories.tsx   ← story file
          ```

          The story is the primary artifact for design review. Link to it in the PR description under "How to review."
      - title: Prop documentation (TypeDocs)
        body: |-
          Every public prop must have a TSDoc comment in the props type definition. These comments power IDE tooltips, generated API docs, and AI context.

          **Rules**

          - **Describe what the prop does, not what values it accepts.** The TypeScript type already declares the accepted values. Do not repeat them in the docstring.
          - **Do not enumerate inherited props.** If the component extends `BoxProps` or `HTMLAttributes`, the inherited props are visible through the type. Only document props that the component adds or overrides.
          - **Do not use `@type`.** TypeScript declares the type. The tag is redundant.
          - **Do not quote simple prop names.** Props like `padding`, `tone`, and `selected` do not need quotes. Only quote names that contain special characters (for example, `aria-label`).
          - **Do not use `@optional`.** The `?` in the type definition marks a prop as optional. The tag adds no information.
          - **Use `@defaultValue` only when the default is not `undefined`.** If a prop defaults to `undefined` (the most common case), omit the tag. If the component applies a specific default (for example, `"div"`, `3`, `true`), document it with `@defaultValue`.
          - **Do not note defaults in any other way.** Do not write "Defaults to X" in the description text. Use `@defaultValue` or nothing.

          **Example — correct**

          ```tsx
          export interface ComboboxProps {
            /**
             * Text shown when no option is selected.
             */
            placeholder?: string

            /**
             * Disables the input and removes it from the tab order.
             * @defaultValue false
             */
            disabled?: boolean

            /**
             * HTML element to render.
             * @defaultValue "div"
             */
            as?: React.ElementType

            /**
             * Called when the selected value changes.
             */
            onChange?: (value: string) => void

            /**
             * Semantic background color.
             */
            tone?: 'default' | 'positive' | 'caution' | 'critical'
          }
          ```

          **Example — incorrect**

          ```tsx
          // ✗ Enumerates values in the docstring
          /**
           * Semantic background color.
           * Accepted values: "default", "positive", "caution", "critical".
           */
          tone?: 'default' | 'positive' | 'caution' | 'critical'

          // ✗ Uses @type (redundant with TypeScript)
          /**
           * @type {string}
           */
          placeholder?: string

          // ✗ Uses @optional (redundant with ?)
          /**
           * @optional
           */
          disabled?: boolean

          // ✗ Quotes a simple prop name
          /**
           * The "tone" prop sets the color.
           */
          tone?: Tone

          // ✗ Uses @defaultValue for undefined
          /**
           * @defaultValue undefined
           */
          onChange?: (value: string) => void

          // ✗ Notes default in description text instead of @defaultValue
          /**
           * HTML element to render. Defaults to "div".
           */
          as?: React.ElementType
          ```
      - title: Testing
        body: |-
          A PR is not ready for review until it has test coverage across five categories. Not all categories apply to every PR — but the contributor must confirm which apply and mark the rest as N/A.

          **Accessibility tests**

          Sanity UI components must meet WCAG 2.2 AA criteria at minimum. Sanity UI has built-in accessibility testing that acts as a baseline for accessibility compliance. A contributed component must pass all tests before it's officially submitted.

          Refer to "Component authoring accessibility standards" for specific information related to shipping accessible Sanity UI components.

          **Performance tests**

          Measure rendering cost for components that appear in lists or render many children.

          - Render time for a list of 100 instances should stay under the existing benchmark threshold.
          - No layout thrashing (forced reflows) during mount or state changes.

          **Visual regression tests**

          Sanity UI has built-in tests for visual regressing. A contribution cannot cause any visual regressions with existing components.

          **Functional unit tests**

          Cover the component's behavior with unit tests.

          - Every prop that changes rendered output has at least one test.
          - Every user interaction (click, keypress, focus) has a test.
          - Edge cases: empty state, overflow content, maximum prop values.

          Use the test framework already in the repo. Match the patterns in existing test files.

          **AI fluency tests**

          Verify that an LLM can use the component from its documentation alone.

          - Provide the component's doc page (props table, usage guidelines, examples) as context to an LLM.
          - Ask it to build a working example using the component.
          - The generated code must render without errors and pass the accessibility test suite.

          This measures whether the documentation and API are clear enough for both humans and AI agents to use correctly.
      - title: Documentation required
        body: |-
          Every PR that adds or changes a public API must include documentation updates. Don't merge without them.

          **For new components**

          Create a new `.md` file in the component documentation directory. It must include:

          | Section | What to write | Required |
          | --- | --- | --- |
          | **Props table** | Every public prop with type, accepted values, default, and description | Yes |
          | **Code examples** | At least one working example showing the primary use case | Yes |
          | **Usage guidelines** | When to use, when not to use, which component to use instead | No |
          | **Best practices** | Do / Don't list with rationale | No |
          | **Accessibility** | Keyboard interaction, ARIA attributes, accessible name source, contrast notes | No |
          | **Content** | Casing, label length, tone pairing, translation considerations | No |

          Use `button.md`, `card.md`, or `dialog.md` as a reference for the expected structure and depth.

          **For changes to existing components**

          Update the component's doc file to reflect the change. If you add a new prop, add it to the props table and write a usage example. If you change behavior, update the affected sections.

          **Writing standards**

          - Follow the casing rule in Content guidelines (`content-guidelines#sentence-case-all-system-set`).
          - Do not simplify technical terms (WCAG, aria-label, screen readers, etc.).
      - title: What happens after the PR is merged
        body: |-
          The design system team handles:

          - Publishing the next release of `@sanity/ui`.
          - Updating the public documentation site.
          - Announcing the new component or change to consuming teams.

          The design system team credits the contributor in the changelog.
      - title: Keep it simple
        body: This model works because the team is small enough that everyone knows each other. If a step feels unclear, ask in the triage sync. If a test category doesn't apply, mark it N/A and explain why. The goal is to ship good components — not to fill out forms.
  - kind: section
    for: agent
    freeform:
      - title: Intent
        body: 'Use this guide when opening a pull request against @sanity/ui: it defines branch naming, the PR description template, code and TSDoc conventions, Storybook requirements, the five test categories, and the documentation that must ship with the PR.'
