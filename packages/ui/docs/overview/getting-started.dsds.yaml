kind: sanity.guide
id: getting-started
name: Getting started
description: Everything needed to start with Sanity UI 5 — install it, set up a React project, use its props correctly, check what is available, and build a three-region admin interface.
metadata:
  tags:
    - getting-started
    - installation
    - install
    - setup
    - react
    - styles.css
    - peer dependency
    - overrides
    - ERESOLVE
    - legacy-peer-deps
    - tsconfig
    - doctor
    - package.json
    - vite
    - typescript
    - polyfills
  status:
    status: stable
sections:
  # ---------------------------------------------------------------- Read first
  - kind: guidelines
    for: all
    framing: how-to-use
    title: Before you write code
    items:
      - level: must
        statement: >-
          Check that a component is in the component list below, and verify its export before you write against it. Run `node -e "console.log(Object.keys(require('@sanity/ui')))"` in the project to list the exports of the installed version. When this guide and the installed package disagree, the package wins. Treat this guide as forward-looking.
      - level: must
        statement: >-
          Check a component's status before you write code against it. An unavailable component is documented ahead of its release, and importing it is a build error.
      - level: must
        statement: Do not write your own version of anything in the component list. Compose what exists.
      - level: should
        statement: >-
          Check the guidance in `docs/patterns/` before you build a common pattern out of primitives. Patterns cover the accessibility requirements that cause most failures in this library, such as landmarks and heading order.
  - kind: section
    for: all
    title: Component status
    freeform:
      - title: Status definitions
        body: |-
          Each component's status in Sanity UI 5 is set by its own document. The list below links to each one.

          - **stable**: exported from `@sanity/ui` 5 and ready to build with.
          - **beta**: exported from `@sanity/ui` 5 and ready to build with. Its API may still change before 5.0.
          - **unavailable**: not exported from `@sanity/ui` 5 yet. Importing it is a build error. Its doc keeps the usage guidance, so you can see what is coming and build a stand-in.
          - **deprecated**: still exported, but do not use it in new code. Its doc names the replacement.
          - **experimental**: exported, but marked `@alpha` in the source. Its API can change without notice. Check it before you rely on it.
  - kind: section
    for: agents
    title: Components by purpose
    freeform:
      - title: Layout
        body: Composes content into logical arrangements.
        refs:
          - to: box
            rel: relates-to
            role: stable
          - to: flex
            rel: relates-to
            role: stable
          - to: grid
            rel: relates-to
            role: stable
          - to: container
            rel: relates-to
            role: stable
          - to: v-stack
            rel: relates-to
            role: stable
          - to: h-stack
            rel: relates-to
            role: stable
          - to: inline
            rel: relates-to
            role: deprecated
            note: '**Deprecated**: use HStack instead'
          - to: visually-hidden
            rel: relates-to
            role: stable
      - title: Organization
        body: Orders content into logical groupings.
        refs:
          - to: card
            rel: relates-to
            role: stable
          - to: divider
            rel: relates-to
            role: stable
          - to: list
            rel: relates-to
            role: beta
          - to: list-item
            rel: relates-to
            role: beta
          - to: list-item-image
            rel: relates-to
            role: beta
          - to: list-item-button
            rel: relates-to
            role: beta
          - to: avatar-stack
            rel: relates-to
            role: beta
      - title: Action
        body: Triggers actions.
        refs:
          - to: button
            rel: relates-to
            role: beta
          - to: press-area
            rel: relates-to
            role: beta
          - to: icon-button
            rel: relates-to
            role: beta
      - title: Information
        body: Displays content in various formats.
        refs:
          - to: text
            rel: relates-to
            role: stable
          - to: heading
            rel: relates-to
            role: stable
          - to: code
            rel: relates-to
            role: stable
          - to: icon
            rel: relates-to
            role: stable
          - to: eyebrow
            rel: relates-to
            role: beta
          - to: kbd
            rel: relates-to
            role: experimental
          - to: hotkeys
            rel: relates-to
            role: experimental
          - to: badge
            rel: relates-to
            role: beta
          - to: avatar
            rel: relates-to
            role: beta
          - to: avatar-counter
            rel: relates-to
            role: beta
      - title: Disclosure
        body: Reveals relevant or contextual content when requested.
        refs:
          - to: tooltip
            rel: relates-to
            role: beta
          - to: tooltip-group
            rel: relates-to
            role: beta
          - to: dialog
            rel: relates-to
            role: beta
          - to: popover
            rel: relates-to
            role: beta
      - title: Discovery
        body: Provides a way to find relevant content. No components are confirmed in the source taxonomy yet.
      - title: Navigation
        body: Allows traversal to different areas of an application.
        refs:
          - to: link
            rel: relates-to
            role: beta
          - to: skip-to-content
            rel: relates-to
            role: beta
          - to: tabs
            rel: relates-to
            role: beta
      - title: Input
        body: Provides a way to add or manipulate content.
        refs:
          - to: checkbox
            rel: relates-to
            role: beta
          - to: radio
            rel: relates-to
            role: beta
          - to: switch
            rel: relates-to
            role: beta
          - to: text-input
            rel: relates-to
            role: beta
          - to: search-input
            rel: relates-to
            role: beta
          - to: text-area
            rel: relates-to
            role: beta
          - to: select
            rel: relates-to
            role: beta
      - title: Feedback
        body: Delivers a response to an action.
        refs:
          - to: spinner
            rel: relates-to
            role: beta
          - to: indicator
            rel: relates-to
            role: beta
          - to: indicator-stack
            rel: relates-to
            role: beta
      - title: Messaging
        body: Proactively communicates information. No components are confirmed in the source taxonomy yet.

  # ------------------------------------------------------------------- Setup
  - kind: guidelines
    for: all
    framing: how-to-use
    title: Stylesheet and polyfills
    items:
      - level: must
        statement: The `styles.css` import is required (`import '@sanity/ui/styles.css'`). Without it, all components render as plain, unstyled HTML. Import the Sanity UI stylesheet before your own global CSS. Sanity UI puts only its global reset in a cascade layer, `sui.global`, so any of your CSS overrides the reset. Its component styles are not layered, so when your CSS and a component rule have the same specificity, the later import wins.
      - level: must
        statement: >-
          Import `@sanity/ui/polyfills` on the line above the stylesheet. Tooltip and Dialog both need it, and both fail without it.
  - kind: guidelines
    for: agent
    framing: how-to-use
    title: Versions and packages
    items:
      - level: must
        statement: '`@sanity/ui` v5 requires React 19.2 or later. Installing it in a project with React 18 fails with ERESOLVE unless you add npm overrides or use `--legacy-peer-deps`.'
      - level: must
        statement: >-
          Install `@sanity/ui` with the `alpha` dist-tag, or with the exact v5 version you were given. If a task, a team or a lockfile names an exact version, use it as given. Never install a bare `@sanity/ui`: its `latest` tag is the pre-v5 line, and it resolves to the wrong major with no error.
      - level: must
        statement: >-
          Install `@sanity/icons` without a dist-tag, or with the exact version you were given. Unlike `@sanity/ui`, its v5 line (5.2.1 and later) is already the package's `latest` tag.
      - level: should
        statement: >-
          `@sanity/icons` is a regular dependency of `@sanity/ui` v5, not a peer dependency. It installs on its own. Add it to your own `package.json` only because your app code imports icons directly.
      - level: should
        statement: Run `npx @sanity/ui@alpha doctor` before you inspect an entry file by hand for a missing stylesheet import or a `tsconfig.json` gap. It checks both, and package and icons install state and React and Node versions, in one pass.
      - level: should
        statement: >-
          For React 18 projects, add overrides to `package.json` before you run install: `{ "overrides": { "react": "^19.2", "react-dom": "^19.2" } }`. Use `--legacy-peer-deps` as a fallback if overrides are not an option.
      - level: should-not
        statement: Do not add `react-refractor` to `package.json`. It is a regular dependency of `@sanity/ui` v5, not a peer dependency, and installs on its own.
      - level: must-not
        statement: Do not add `styled-components`. Version 5 does not use it.
  - kind: guidelines
    for: agent
    framing: how-to-use
    title: Project files
    items:
      - level: must
        statement: >-
          Add `@types/react` and `@types/react-dom` to `devDependencies`. Without them, every file reports `TS7016: Could not find a declaration file for module 'react'`. The error cascades, and components such as Switch, Radio and Card then look broken when nothing is wrong with them.
      - level: must
        statement: >-
          Add `@vitejs/plugin-react` to `devDependencies` in a Vite project. Without it the install and the type check both pass, and the dev server then fails to start with `ERR_MODULE_NOT_FOUND`.
  - kind: guidelines
    for: agent
    framing: how-to-use
    title: TypeScript configuration
    items:
      - level: must
        statement: >-
          Write the `tsconfig.json` in the Project files section below as the project's first file, as written. It is the config Sanity UI's CLI writes for a new project (`npx @sanity/ui@alpha init`).
      - level: must
        statement: 'Keep `"jsx": "react-jsx"` in `compilerOptions`. Leaving it out causes the most common build failure in this library, `TS17004: Cannot use JSX unless the ''--jsx'' flag is provided`, on every component.'
      - level: must
        statement: 'Use TypeScript 5 or later, with `"moduleResolution": "bundler"`. Sanity UI''s types are reached through its `exports` map, which `"node"` and `"classic"` do not read.'
      - level: should
        statement: Keep `"app"` in `include`, even with no `app` folder. The CLI writes it so the same config fits projects that keep their sources in `app/`. A missing folder is not an error while `src` has files.
      - level: must-not
        statement: 'Do not add `compilerOptions` keys beyond the ones shown. An invented or misspelled key fails the build with `TS5023: Unknown compiler option`.'
      - level: must-not
        statement: >-
          Do not run a bare `tsc`. The config sets no `noEmit`, so it writes `.js` files beside your sources, and Vite loads those instead of the `.tsx` files. Type-check with `tsc --noEmit`, as the `build` script below does.
      - level: must-not
        statement: >-
          Do not change `tsconfig.json` while you fix a build. The cause of a build failure is almost always in the source under `src/`. Editing the config turns one error into an error on every file.
  - kind: steps
    for: all
    ordered: true
    title: Automatic setup (recommended)
    items:
      - title: Run the setup CLI
        description: |-
          ```sh
          npx @sanity/ui@alpha init
          ```

          Detects your framework (Next.js, Remix, React Router, Vite, Astro, or plain React) and package manager, checks React and Node versions, installs `@sanity/ui@5` and `@sanity/icons` at matching versions, adds `import '@sanity/ui/styles.css'` to the detected entry file, reconciles `tsconfig.json` (creates it if missing, or adds only the missing required options), and writes `sanity-ui.json`. Prints the plan and asks for confirmation before it writes anything.

          `@sanity/ui`'s `latest` npm tag still points at the pre-v5 line. v5 publishes only under the `alpha` tag, so always pin `@sanity/ui@alpha`. A bare `@sanity/ui` install resolves to the wrong major. `init` is for new apps only. If it finds a pre-v5 `@sanity/ui` dependency, it stops with exit code 1.
      - title: Flags
        description: '`--dry` prints the plan and exits without changing anything. `--yes` or `-y` accepts every prompt with its default; use it for CI or when you run through an agent. `--cwd <dir>` runs against a directory other than the current one. Without a TTY, `init` applies the plan and reports it. `--yes` only silences the confirmation prompt in an interactive terminal.'
      - title: Verify an existing setup
        description: |-
          ```sh
          npx @sanity/ui@alpha doctor
          ```

          Re-runs the checks `init` verifies at the end of its run, and prints a one-line fix for anything that fails: package and `@sanity/icons` installed, stylesheet resolves and is imported, `tsconfig.json` has the required options, React and Node versions. It is read-only and never writes anything. Run it first whenever a component renders unstyled or a build fails for no obvious reason.

          If it finds `@sanity/ui` at a pre-v5 version, it prints a warning and exits with code 0 without running any checks.
  - kind: steps
    for: all
    ordered: true
    title: Install by hand
    items:
      - title: Check your React version
        description: '`@sanity/ui` requires React 19.2 or later. If your project has an older React version, `npm install` fails with a peer dependency error.'
      - title: 'New project: install React 19.2 first'
        description: |-
          Start with React 19.2:

          ```shell
          npm install react@^19.2 react-dom@^19.2
          ```

          Then add Sanity UI. Pin the `alpha` tag, because `@sanity/ui`'s `latest` npm tag is the pre-v5 line:

          ```shell
          npm install @sanity/ui@alpha
          ```

          `@sanity/ui` depends on `@sanity/icons` and `react-refractor` directly, and both install on their own. Add `@sanity/icons` to your own `package.json` if your app code imports icons directly. That keeps it from being a hidden transitive dependency:

          ```shell
          npm install @sanity/icons
          ```

          Sanity UI 5 has no `styled-components` dependency and no theme provider. Skip both.
      - title: 'Existing project with React 18: add npm overrides'
        description: |-
          Add `overrides` to your `package.json` before you run install:

          ```json
          "overrides": {
            "react": "^19.2",
            "react-dom": "^19.2"
          }
          ```

          Then install:

          ```shell
          npm install react@^19.2 react-dom@^19.2 @sanity/ui@alpha @sanity/icons
          ```

          If you can't add overrides, use `--legacy-peer-deps`:

          ```shell
          npm install @sanity/ui@alpha @sanity/icons --legacy-peer-deps
          ```
  - kind: steps
    for: all
    ordered: true
    title: Set up the entry point
    items:
      - title: Import the polyfills and the stylesheet
        description: |-
          Sanity UI 5 has no `ThemeProvider`. Import the polyfills and the stylesheet once, in the entry file.

          ```js
          import { createRoot } from 'react-dom/client'
          import '@sanity/ui/polyfills' // Tooltip and Dialog need this; both fail silently without it
          import '@sanity/ui/styles.css'
          import App from './App'

          createRoot(document.getElementById('root')!).render(<App />)
          ```
  - kind: section
    for: all
    title: Project files to start from
    freeform:
      - title: Starter files for a new Vite project
        body: |-
          For a new Vite project, start from these files. Where you were given exact versions, write those in place of `alpha` and `^5.2.1`.

          **`package.json`**

          ```json
          {
            "name": "my-app",
            "private": true,
            "version": "0.0.1",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "tsc --noEmit && vite build"
            },
            "dependencies": {
              "react": "^19.2",
              "react-dom": "^19.2",
              "@sanity/ui": "alpha",
              "@sanity/icons": "^5.2.1"
            },
            "devDependencies": {
              "typescript": "^5",
              "vite": "^6",
              "@vitejs/plugin-react": "^4",
              "@types/react": "^19",
              "@types/react-dom": "^19"
            }
          }
          ```

          **`vite.config.ts`**

          ```ts
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'

          export default defineConfig({
            plugins: [react()],
          })
          ```

          **`tsconfig.json`**

          ```json
          {
            "compilerOptions": {
              "target": "ES2022",
              "lib": ["DOM", "DOM.Iterable", "ES2022"],
              "module": "esnext",
              "moduleResolution": "bundler",
              "jsx": "react-jsx",
              "strict": true,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "resolveJsonModule": true,
              "isolatedModules": true,
              "moduleDetection": "force"
            },
            "include": ["src", "app"]
          }
          ```

  # --------------------------------------------------------------- Props
  - kind: guidelines
    for: all
    framing: how-to-use
    title: Prop value types
    items:
      - level: must
        statement: >-
          Spacing and sizing take different value types. Write `<Box padding={2} width="300px">`. The integer and the string are both correct on that one element. Do not carry the integer form over to a sizing prop.
        refs:
          - to: spacing-guidelines
            rel: relates-to
      - level: must
        statement: >-
          Pass spacing as an integer in braces. Write `<Box padding={2}>` or `<Flex gap={3}>`, never `padding="2"`. A string is a TypeScript error. `padding`, `margin` and `gap` take a step on the spacing scale, never a pixel value. The scale is non-linear: {space-0}, {space-1}, {space-2}, {space-3}, {space-4}, {space-5}, {space-6}, {space-7}, {space-8}, {space-9}. The number after `space-` is the step you pass. `radius` takes a step on its own scale: {radius-0}, {radius-1}, {radius-2}, {radius-3}, {radius-4}, {radius-5}, {radius-6}, and `radius="full"` for a pill or circle, which is {radius-round}.
        refs:
          - to: spacing-guidelines
            rel: relates-to
      - level: must
        statement: >-
          Pass a type size as a step too. `size` on Text, Heading, Code and Eyebrow is a step on that component's scale, not a pixel value. `<Text size={1}>` is {body-1}, and `<Text size={20}>` is a TypeScript error. Text runs {body-0} to {body-4}. Heading runs {heading-0} to {heading-5}. For every step, read `docs/tokens/typography.dsds.yaml`.
        refs:
          - to: typography-guidelines
            rel: relates-to
      - level: must
        statement: >-
          Pass `shadow` as a step from 0 to 5 on Box, Container, Flex or Grid. Choose it by the surface's role, not its look. Use `shadow={0}` for a flat surface, `1` for a resting card, `2` for a hovered card or small raised element, `3` for a popover, dropdown or menu, `4` for a modal or overlay, and `5` for a top-layer surface. Never write a `box-shadow` in `style`. The recipes are {shadow-0} to {shadow-5}; read `docs/tokens/shadow.dsds.yaml` for their values.
      - level: must
        statement: >-
          Position props take a spacing step, not a CSS length. `top`, `right`, `bottom`, `left` and `inset` on Box, Container, Flex and Grid accept a step from 0 to 9, or `"auto"`, the same values as `padding`. `top={0}` is {space-0}, but `top={4}` is {space-4}, not four pixels. For a length the scale does not have, such as `50%` or `64px`, set it in `style`. That is the one case where `style` is correct for these properties.
      - id: sizing-is-a-css-string
        level: must
        statement: >-
          Pass sizing as a CSS string, including zero. Write `<Box width="300px" maxWidth="100%" minHeight="0">`. A pixel value is a string as well: write `width="140px"`, not `width={140}`. A number is a TypeScript error. This is the exception to the integer rule above, and it covers `width`, `height`, `minWidth`, `maxWidth`, `minHeight` and `maxHeight`.
      - level: must
        statement: 'The flexbox shrink idiom also takes a string. Write `<Flex flexGrow={1} minHeight="0">`. `flexGrow` is a number and `minHeight` is a string, on the same element.'
      - level: must
        statement: 'Pass flex values as numbers. Write `<Box flexGrow={1} flexShrink={0}>`, never `flexGrow` on its own and never `flexGrow={true}`. A boolean is a TypeScript error.'
      - id: responsive-array-undefined-slot
        level: must
        statement: >-
          A responsive array has at most six slots, one per breakpoint: `[base, 360px, 600px, 900px, 1200px, 1800px]`. Each value applies from that `min-width` up. For CSS string and number props, fill every slot up to the last one you set. In `padding={[2, undefined, 4]}`, an `undefined` slot keeps the previous breakpoint's value for step and keyword props, such as `padding` and `flexDirection`. For a CSS string or number prop, such as `width` or `flexBasis`, it resets the value.
      - level: must
        statement: 'Pass tone and color as token keys, not CSS colors. Write `<Badge tone="critical">`. A hex value or an arbitrary string is a TypeScript error.'
      - level: must
        statement: >-
          In custom markup that no component covers, take color from the semantic custom properties, which follow light and dark mode on their own. Write `var(--background-low)` for a surface, `var(--foreground-high)` or `var(--foreground-low)` for text, and `var(--separator-low)` for a border. Their values are {background-low}, {foreground-high} and {foreground-low}. Read `docs/tokens/semantic.dsds.yaml` for the full set. The names `--card-border-color`, `--card-bg-color` and `--card-fg-color` do not exist, so a declaration that uses them does nothing.
        refs:
          - to: semantic-tokens
            rel: relates-to
  - kind: guidelines
    for: all
    framing: how-to-use
    title: Which component accepts which prop
    items:
      - level: must
        statement: Box, Container, Flex and Grid accept `padding` and `margin` directly. Reach for one of these when you need spacing.
      - level: must
        statement: >-
          Card sets spacing and radius through `density`. Leave it out for the regular spacing, or write `density="compact"` or `density="loose"`. Passing `padding`, `gap`, `radius` or any other layout prop to Card is a TypeScript error. To position a Card, wrap it in a `Box`, which takes the layout props: `<Box flexGrow={1}><Card>…</Card></Box>`.
      - level: must
        statement: >-
          VStack and HStack accept only `gap` and `as`. For a simple vertical list with even spacing, use `VStack`. For a container that needs `flexGrow`, `overflow`, `minHeight` or full flex control, use `Flex flexDirection="column"` with `alignItems`, `justifyContent` and `flexWrap`. Write `<Box padding={3}><VStack gap={2}>…</VStack></Box>` when you need anything else.
      - level: must
        statement: Icons render an SVG element and accept no layout props. Wrap a glyph in `<Icon>`, set its scale with `size`, and set its color with `tone`.
      - id: prop-before-inline-style
        level: should
        statement: >-
          Any CSS with a component-prop equivalent is passed as that prop, not inside a `style` object. `style` is for values with no prop path, such as a transform, a gradient, an aspect ratio or a CSS custom property. A native element with no Sanity UI equivalent, such as `<table>`, `<td>` or `<fieldset>`, has no props at all. `style` on it is correct.
        checks:
          - href: ../evals/cases.yaml
            role: agent-test
        checkedBy: assisted
        $extensions:
          io.jev:
            type: boolean
      - id: no-default-prop-values
        level: should-not
        statement: >-
          Don't write a prop at its default value. `<Card density="regular">`, `<Button level="primary">` and `<Text size={2}>` render the same as `<Card>`, `<Button>` and `<Text>`. Write a prop only to choose something other than the default. The linter removes a default-valued prop on its own.
  - kind: guidelines
    for: all
    framing: how-to-use
    title: Prop names
    items:
      - level: must
        statement: 'Flex uses the CSS property names. Write `<Flex flexDirection="column" alignItems="center" justifyContent="space-between">`. `direction`, `align`, `justify` and `wrap` do not exist.'
      - level: must
        statement: 'Do not put `flexDirection`, `alignItems`, `justifyContent` or `flexWrap` on `Box`. They belong to `Flex`. On `Box` they are a TypeScript error, not a setting that quietly does nothing.'
      - level: must
        statement: 'Grid takes `gridTemplateColumns` with a CSS string. Write `<Grid gridTemplateColumns="repeat(3, 1fr)" gap={3}>`. There is no `columns` prop.'
      - level: must
        statement: 'Icon takes `icon`, not `symbol`. Write `<Icon icon={SearchIcon} />`. Passing `symbol` is a TypeScript error and renders no icon.'
      - level: must
        statement: 'Tooltip takes its label as `content` and points at its `children`. Write `<Tooltip content="Search"><IconButton … /></Tooltip>`. There is no `text` or `trigger` prop.'
      - level: must
        statement: 'A label element takes its text as `children`. Write `<Text as="label" htmlFor="email">Email address</Text>`, linking `htmlFor` to the input''s `id`.'
      - level: must
        statement: 'IconButton takes `icon` plus native button attributes. Write `<IconButton icon={SearchIcon} aria-label="Search" />`. It has no `label` or `size` prop.'
      - level: must
        statement: 'Button accepts `tone="neutral"` or `tone="critical"`, and nothing else. Write `<Button text="Delete" tone="critical" />`. There is no `primary`, `positive` or `caution`. Use a plain Button for a default action, and `critical` only for a destructive one.'
      - level: must
        statement: 'SkipToContent takes `href` and `label`. Write `<SkipToContent href="#main-content" label="Skip to main content" />`, keeping the leading `#`. There is no `hash` prop.'
      - level: must
        statement: 'Name a Switch with a linked label element, `aria-label` or `aria-labelledby`. Switch has no `label` prop, so `<Switch label="…" />` is a TypeScript error. Write `<Switch id="notify" />` beside `<Text as="label" htmlFor="notify">Enable notifications</Text>`.'
      - level: should
        statement: ESLint fixes wrong prop names on Flex, Grid, Icon, Container and Tooltip on its own. Where your setup has it, run it after you write code that uses them.
      - level: should-not
        statement: >-
          Avoid spreading props from a loosely typed object, as in `const p: Record<string, unknown> = { direction: 'row' }` and then `<Flex {...p} />`. Those props skip type checking, so a wrong prop name stays silent and does nothing at runtime. If a new prop has no visible effect, check for a spread like this first.
      - id: no-layout-props-actions
        level: must-not
        statement: >-
          Button and IconButton accept no layout, spacing or sizing props. `padding`, `margin*`, `width`, `height`, `flexGrow`, `flexShrink`, `alignSelf` and the like belong on a wrapping Box. Text and Heading accept the margin props (`margin`, `marginX`, `marginY` and each side, on the spacing scale) and nothing else from that list.
        checks:
          - href: ../evals/cases.yaml
            role: agent-test
        checkedBy: assisted
        $extensions:
          io.jev:
            type: boolean
  - kind: guidelines
    for: all
    framing: how-to-use
    title: Imports
    items:
      - id: icon-import-from-subpath
        level: must
        statement: Each icon is imported from its own subpath, as in `import {SearchIcon} from '@sanity/icons/Search'`, not from the package root. The subpath drops the `Icon` suffix.
        checks:
          - href: ../evals/cases.yaml
            role: agent-test
        checkedBy: assisted
        $extensions:
          io.jev:
            type: boolean
      - level: must
        statement: Do not import an icon from the package root. The root ships a type-only stub. The import passes `tsc` and then fails in the browser.
      - level: must
        statement: 'Import `List` alone and reach its parts through dot access, as in `<List.Item>` and `<List.ItemButton>`. `ListItem` is not an export.'
      - id: choose-icons-from-icons-entry
        level: should
        statement: >-
          To choose an icon, look it up in the `icons` entry. It lists every icon in @sanity/icons with its import path, its purpose and the other names it goes by. To find an icon by purpose, search `docs/icons.dsds.yaml` for the purpose word.
  - kind: guidelines
    for: all
    framing: how-to-use
    title: Interaction and theming
    items:
      - level: must
        statement: >-
          Do not put `onClick` on Box or Card, and do not set `as="button"` on Box. To make a whole card, list row or media tile clickable, wrap it in `PressArea`, as in `<PressArea onClick={...}><Card>…</Card></PressArea>`. PressArea renders a real `<button>`, or an `<a>` with `as="a"`. Put padding and visual styling on the child `Card` or `Box`, not on `PressArea`. PressArea is interactive-only: do not use it as a backdrop or layout wrapper, and never pass `as="div"`. Use a styled `Box` for non-interactive surfaces.
      - level: must
        statement: v5 ships no theming API. It has no `ThemeProvider`, no `studioTheme` and no runtime scheme toggle. Importing one from v5 is a TypeScript error.
  - kind: guidelines
    for: agent
    framing: how-to-use
    title: Work within the system's opinions
    items:
      - level: must
        statement: Use the prop the component gives you, even when it is coarser than the control you had in mind. Card takes `density`, which is `compact`, `regular` or `loose`, and that is its whole spacing surface. It has no `padding`, `gap` or `radius` prop.
      - level: must
        statement: Treat a missing knob as a decision, not a gap. The system withholds a control when the choice belongs to the system, not the page. Pick the nearest value it offers and move on.
      - level: must
        statement: Build what the brief asks for out of the components the system provides. Match its content and its structure. Do not reproduce a specific visual treatment the system does not offer.
      - level: should-not
        statement: Avoid wrapping a design system component in a Box purely to add spacing it withholds. A wrapper that exists only to re-space a component is the same override written one level out.
      - level: must-not
        statement: 'Do not restyle a design system component with `style={{ … }}` or a `className`. Inline styles bypass the token system, break in dark mode and drift from every other instance of that component.'
      - level: must-not
        statement: Do not override a component's own color, spacing or radius through CSS custom properties. Those properties let custom markup match the system. They are not a way to restyle the system's own components.

  # ------------------------------------------------------- Build an interface
  - kind: guidelines
    for: all
    framing: how-to-use
    title: Accessibility and structure
    items:
      - level: must
        statement: Place `SkipToContent` as the first focusable element in the layout, pointing to the main content region's `id`.
      - level: must
        statement: 'Never skip heading levels. Use one `<h1>` for the page title and `<h2>` for sidebar and card headings.'
      - refs:
          - to: shared-foundations#container-inside-scroll-box
            rel: same-as
      - level: must
        statement: 'Set `lang="en"` on the `<html>` element in `index.html` so screen readers can detect the page language (WCAG 3.1.1 A).'
      - level: must
        statement: 'Add `flexWrap="wrap"` to every `Flex` with two or more children to prevent overflow at 320px.'
      - level: must
        id: icon-only-aria-label
        statement: 'Add `aria-label` to every icon-only button. A tooltip does not set an accessible name.'
      - level: must-not
        statement: 'Do not add `Container` to app chrome (sidebar, toolbar). Use `Box` or `Flex` directly for those regions.'
      - refs:
          - to: shared-foundations#card-not-for-structural-regions
            rel: same-as
  - kind: section
    for: all
    title: What you will build
    freeform:
      - title: Overview
        body: |-
          This tutorial walks through building a three-region admin interface with Sanity UI. You will create a sidebar, a toolbar and a content list, the same layout used in Sanity Studio.

          **Before you start:** complete the Installation sections above. You should have `@sanity/ui@alpha` and `@sanity/icons` installed, plus a working entry file.
      - title: Result
        body: |-
          A single-page app with:

          - A collapsible sidebar (`<nav>`) with navigation links
          - A toolbar with a page title and an action button
          - A scrollable list of document cards with status badges
          - Correct heading hierarchy, landmarks, keyboard access and responsive reflow
  - kind: steps
    for: all
    ordered: true
    title: Build the admin interface
    items:
      - title: 'Step 1: Create the outer shell'
        description: |-
          The outer shell is a `Flex` that fills the viewport. The sidebar and main area sit side by side. This assumes the project is set up as the Installation sections above describe: its `package.json`, `tsconfig.json` and entry file.

          The complete `src/App.tsx` after this step is in the example.

          **What to notice:**

          - `Box as="nav"` renders a `<nav>` element. Screen readers list it as a landmark.
          - `Flex as="main"` renders a `<main>` element.
          - `flexWrap="wrap"` on the outer Flex lets the sidebar stack above the content at narrow widths (WCAG 1.4.10).
          - `minWidth="0"` on the main area prevents content from pushing the layout wider than the viewport.
          - `as="h1"` on the page heading and `as="h2"` on the sidebar heading create a correct hierarchy.
          - `SkipToContent` is the first focusable element. A keyboard user's first Tab press reveals it; activating it jumps focus to `#main-content`.
        examples:
          - title: src/App.tsx after step 1
            ref:
              href: ./quick-start/step-1-app.tsx
              rel: source
              role: React
      - title: 'Step 2: Add a toolbar with reflow'
        description: |-
          The toolbar holds the page title and an action button. Both wrap to separate lines on mobile.

          The complete `src/App.tsx` after this step replaces the main area's placeholder `Box` with the toolbar, and adds the state that shows the sidebar again.

          **What to notice:**

          - `flexWrap="wrap"` is required on every `Flex` with two or more children. Without it the page overflows at 320px.
          - `truncate={1}` on the Heading truncates long titles with an ellipsis.
          - The `MenuIcon` button has `aria-label` because it has no visible text.
          - Button `level` controls visual weight: `"primary"` is the default (solid, full visual weight).
        examples:
          - title: src/App.tsx after step 2
            ref:
              href: ./quick-start/step-2-toolbar.tsx
              rel: source
              role: React
      - title: 'Step 3: Build the sidebar'
        description: |-
          Replace the sidebar placeholder with navigation links and a close button.

          The complete `src/App.tsx` after this step is in the example.

          **What to notice:**

          - `VStack` lays children out in a column with even `gap` spacing. It exposes only `as` and `gap`. For full flex control, use `Flex flexDirection="column"`.
          - `Link` renders a native `<a>` element and inherits color from the container. It adds an underline by default. Use `underlined={false}` to remove it for nav links.
        examples:
          - title: src/App.tsx after step 3
            ref:
              href: ./quick-start/step-3-sidebar.tsx
              rel: source
              role: React
      - title: 'Step 4: Add document cards'
        description: |-
          Create a scrollable list of cards below the toolbar. The documents are a constant array. The list goes inside the main area, below the toolbar.

          The complete `src/App.tsx` after this step is in the example.

          **What to notice:**

          - `Container size={2}` caps the card list at the width of {container-2} and centers it. On a wide monitor the cards won't stretch edge to edge.
          - `Container` goes inside the scroll `Box`, not around it. The `Box` handles `flexGrow` and `overflowY`. Container handles max-width only.
          - Don't add Container to the sidebar or toolbar. Those are app chrome and should fill their available width.
          - `Card` is a content surface. It adds a background and border. Do not use it for structural regions like sidebars or toolbars.
          - Layout props like `flexGrow` go on `Box`, not on `Card`. Passing one to Card is a TypeScript error.
          - Each card heading is `as="h2"` because `as="h1"` is the page title above. Never skip heading levels.
        examples:
          - title: src/App.tsx after step 4
            ref:
              href: ./quick-start/step-4-document-cards.tsx
              rel: source
              role: React
      - title: 'Step 5: Set the page language'
        description: |-
          In `index.html`, set `lang="en"` on the `<html>` element. The complete file is in the example.

          Without this, screen readers cannot detect the page language (WCAG 3.1.1 A).
        examples:
          - title: index.html after step 5
            ref:
              href: ./quick-start/step-5-index.html
              rel: source
              role: HTML
      - title: Run it
        description: |-
          ```shell
          npm run dev
          ```

          Open `http://localhost:5173`. You should see a sidebar with navigation links on the left and a document list on the right.
  - kind: section
    for: all
    title: Layout components
    freeform:
      - title: Box, Flex, Card and Container
        body: |-
          | Component | Use for | Adds a visual surface? |
          | :---- | :---- | :---- |
          | `Box` | Padding, borders, scroll containers, landmarks | No |
          | `Flex` | Row or column layout with alignment and gap | No |
          | `Card` | Content that needs a background, border and tone | Yes |
          | `Container` | Max-width constraint and horizontal centering for content areas | No |

          Do not use `Card` for toolbars, sidebars or scroll wrappers. Use `Box` or `Flex`. Do not use `Container` for app chrome. Use `Box` or `Flex` directly.
      - title: Icon-only buttons
        body: |-
          A tooltip does not set an accessible name. Add `aria-label`:

          ```tsx
          <IconButton icon={SearchIcon} level="tertiary" aria-label="Search" />
          ```
      - title: Next steps
        body: |-
          - Add a right-side inspector panel with `Box as="aside" aria-label="Inspector"`.
          - Use `tone` on Card and Button for status. Card accepts `"neutral"`, `"positive"`, `"caution"`, `"critical"` and `"suggest"`. Button accepts only `"neutral"` and `"critical"`. Use `critical` only for a destructive action.

  - kind: section
    for: agent
    title: Intent
    freeform:
      - title: Intent
        body: Use this guide to check component status and exports, set up a React project for Sanity UI 5, write props correctly, and scaffold a three-region admin layout that follows the accessibility, heading hierarchy and responsive reflow patterns.

$extensions:
  com.sanity.ui:
    implementationStatus:
      context: Implementation status. Lets a tool tell a component that is coming from one that does not exist, without parsing the status note.
      implemented: true
