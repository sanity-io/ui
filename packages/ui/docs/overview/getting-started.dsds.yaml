kind: sanity.guide
id: getting-started
name: Getting started
description: Everything needed to start with Sanity UI 5. Use this guide to check component status and exports, set up a React project for Sanity UI 5, write props correctly, and scaffold a three-region admin layout that follows the accessibility, heading hierarchy and responsive reflow patterns.
metadata:
  tags:
    - getting-started
    - installation
    - install
    - setup
    - react
    - styles.css
    - peer dependency
    - ERESOLVE
    - legacy-peer-deps
    - tsconfig
    - doctor
    - package.json
    - vite
    - typescript
    - polyfills
  status:
    status: stable
sections:
  # ---------------------------------------------------------------- Read first
  - kind: guidelines
    for: agent
    framing: how-to-use
    title: Before you write code
    items:
      - level: must
        statement: >-
          Verify a component's export before you write against it: run `node -e
          "console.log(Object.keys(require('@sanity/ui')))"` in the project. The installed package wins
          over this guide. Import a compound component, such as `List`, alone, and reach its parts with
          dot access: `<List.Item>`, `<List.ItemButton>`.
      - level: must
        statement: >-
          Check a component's status before you write code against it. Don't import a component whose
          status is unavailable, because the import fails the build.
      - level: must
        statement: >-
          Compose existing components. Don't write your own version of one.
      - id: icon-import-from-subpath
        level: must
        statement: >-
          Import each icon from its own subpath, without the `Icon` suffix: `import {SearchIcon} from
          '@sanity/icons/Search'`. Don't import from the package root, a type-only stub that passes `tsc`
          and fails in the browser. To find an icon by purpose, search `docs/icons.dsds.yaml`.
        checks:
          - href: ../evals/cases.yaml
            role: agent-test
        checkedBy: assisted
        $extensions:
          io.jev:
            type: boolean
      - level: should
        statement: >-
          Read the pattern in `docs/patterns/` before you build a common pattern out of primitives, such
          as landmarks and heading order.
  - kind: section
    for: all
    title: Component status
    freeform:
      - title: Status definitions
        body: |-
          Each component's status in Sanity UI 5 is set by its own document. The list below links to each one.

          - **stable**: exported from `@sanity/ui` 5 and ready to build with.
          - **beta**: exported from `@sanity/ui` 5 and ready to build with. Its API may still change before 5.0.
          - **deprecated**: still exported, but do not use it in new code. Its doc names the replacement.
          - **experimental**: exported, but marked `@alpha` in the source. Its API can change without notice. Check it before you rely on it.
  - kind: section
    for: agent
    title: Components by purpose
    freeform:
      - title: Layout
        body: Composes content into logical arrangements.
        refs:
          - to: box
            rel: relates-to
            role: stable
          - to: flex
            rel: relates-to
            role: stable
          - to: grid
            rel: relates-to
            role: stable
          - to: container
            rel: relates-to
            role: stable
          - to: v-stack
            rel: relates-to
            role: stable
          - to: h-stack
            rel: relates-to
            role: stable
          - to: inline
            rel: relates-to
            role: deprecated
            note: '**Deprecated**: use HStack instead'
          - to: visually-hidden
            rel: relates-to
            role: stable
      - title: Organization
        body: Orders content into logical groupings.
        refs:
          - to: card
            rel: relates-to
            role: stable
          - to: divider
            rel: relates-to
            role: stable
          - to: list
            rel: relates-to
            role: beta
          - to: list-item
            rel: relates-to
            role: beta
          - to: list-item-image
            rel: relates-to
            role: beta
          - to: list-item-button
            rel: relates-to
            role: beta
          - to: avatar-stack
            rel: relates-to
            role: beta
      - title: Action
        body: Triggers actions.
        refs:
          - to: button
            rel: relates-to
            role: beta
          - to: press-area
            rel: relates-to
            role: beta
          - to: icon-button
            rel: relates-to
            role: beta
      - title: Information
        body: Displays content in various formats.
        refs:
          - to: text
            rel: relates-to
            role: stable
          - to: heading
            rel: relates-to
            role: stable
          - to: code
            rel: relates-to
            role: stable
          - to: icon
            rel: relates-to
            role: stable
          - to: eyebrow
            rel: relates-to
            role: beta
          - to: kbd
            rel: relates-to
            role: experimental
          - to: hotkeys
            rel: relates-to
            role: experimental
          - to: badge
            rel: relates-to
            role: beta
          - to: avatar
            rel: relates-to
            role: beta
          - to: avatar-counter
            rel: relates-to
            role: beta
      - title: Disclosure
        body: Reveals relevant or contextual content when requested.
        refs:
          - to: tooltip
            rel: relates-to
            role: beta
          - to: tooltip-group
            rel: relates-to
            role: beta
          - to: dialog
            rel: relates-to
            role: beta
          - to: popover
            rel: relates-to
            role: beta
      - title: Discovery
        body: Provides a way to find relevant content. No components are confirmed in the source taxonomy yet.
      - title: Navigation
        body: Allows traversal to different areas of an application.
        refs:
          - to: link
            rel: relates-to
            role: beta
          - to: skip-to-content
            rel: relates-to
            role: beta
          - to: tabs
            rel: relates-to
            role: beta
      - title: Input
        body: Provides a way to add or manipulate content.
        refs:
          - to: checkbox
            rel: relates-to
            role: beta
          - to: radio
            rel: relates-to
            role: beta
          - to: switch
            rel: relates-to
            role: beta
          - to: text-input
            rel: relates-to
            role: beta
          - to: search-input
            rel: relates-to
            role: beta
          - to: text-area
            rel: relates-to
            role: beta
          - to: select
            rel: relates-to
            role: beta
      - title: Feedback
        body: Delivers a response to an action.
        refs:
          - to: spinner
            rel: relates-to
            role: beta
          - to: indicator
            rel: relates-to
            role: beta
          - to: indicator-stack
            rel: relates-to
            role: beta
      - title: Messaging
        body: Proactively communicates information. No components are confirmed in the source taxonomy yet.

  # ------------------------------------------------------------------- Setup
  - kind: guidelines
    for: agent
    framing: how-to-use
    title: Versions and packages
    items:
      - level: must
        statement: >-
          Use React 19.2 or later with `@sanity/ui` v5. For a React 18 project, add npm overrides or use
          `--legacy-peer-deps`.
      - level: must
        statement: >-
          Install `@sanity/ui@alpha`, or the exact v5 version that a task, team or lockfile names. Don't
          install a bare `@sanity/ui`, because its `latest` tag is the pre-v5 line.
      - level: must
        statement: >-
          Install `@sanity/icons` without a dist-tag, or with the exact version you were given. Its
          `latest` tag is already the v5 line (5.2.1 and later).
      - level: should
        statement: >-
          Add `@sanity/icons` to your own `package.json` only when your app code imports icons directly.
          It installs on its own as a dependency of `@sanity/ui`.
      - level: should
        statement: >-
          Run `npx @sanity/ui@alpha doctor` before you inspect the entry file or `tsconfig.json` by hand.
          It checks the stylesheet import, the tsconfig options, the install state and the React and Node
          versions in one pass.
      - level: should
        statement: >-
          For React 18 projects, add overrides to `package.json` before you run install: `{ "overrides": { "react": "^19.2", "react-dom": "^19.2" } }`. Use `--legacy-peer-deps` as a fallback if overrides are not an option.
      - level: must
        statement: >-
          After an in-place upgrade of `@sanity/ui`, stop the dev server, delete
          `node_modules/.sanity/vite`, and start the server again. Otherwise Vite serves the old
          pre-bundle, which lacks v5 exports such as `Eyebrow`.
      - level: should
        statement: >-
          In a monorepo, check the package manager and entry file that `init` and `doctor` report before
          you run their commands. They read the lockfile and the entry file only in the directory they run
          in. If they differ from your project, use your project's package manager, and add `import
          '@sanity/ui/styles.css'` to the entry file the app loads first.
      - level: should-not
        statement: >-
          Don't add `react-refractor` to `package.json`. It installs as a dependency of `@sanity/ui`.
      - level: must-not
        statement: Do not add `styled-components` or a theme provider. Version 5 uses neither.
  - kind: guidelines
    for: agent
    framing: how-to-use
    title: Project files
    items:
      - level: must
        statement: >-
          Add `@types/react` and `@types/react-dom` to `devDependencies`. Without them, every file reports
          `TS7016`, and components such as Switch, Radio and Card look broken.
      - level: must
        statement: >-
          Add `@vitejs/plugin-react` to `devDependencies` in a Vite project. Without it, the dev server
          fails to start with `ERR_MODULE_NOT_FOUND`.
  - kind: guidelines
    for: agent
    framing: how-to-use
    title: TypeScript configuration
    items:
      - level: must
        statement: >-
          For a new project, run `npx @sanity/ui@alpha init`. If it can't run, write `tsconfig.json` as shown in `project-files/tsconfig.json.example`. For an existing `tsconfig.json`, add only the required options, and don't replace the file.
      - level: must
        statement: >-
          Keep `"jsx": "react-jsx"` in `compilerOptions`. Without it, every component fails with
          `TS17004`. `doctor` checks this option.
      - level: must
        statement: >-
          Use TypeScript 5 or later, with `"moduleResolution": "bundler"`. `"node"` and `"classic"` cannot
          resolve Sanity UI's types. `doctor` checks this option.
      - level: should
        statement: >-
          Keep `"app"` in `include`, even with no `app` folder. The CLI writes it, so the same config fits
          projects that keep their sources in `app/`.
      - level: must-not
        statement: >-
          Don't add `compilerOptions` keys beyond the ones shown. An unknown key fails the build with
          `TS5023`.
      - level: must-not
        statement: >-
          Type-check with `tsc --noEmit`, never a bare `tsc`. A bare `tsc` writes `.js` files beside your
          sources, and Vite loads those instead of the `.tsx` files.
      - level: must-not
        statement: >-
          Don't change `tsconfig.json` to fix a build error. Fix the source under `src/`. The one
          exception is a required option that `doctor` reports: add only that option, and leave the rest
          of the file alone.
  - kind: section
    for: all
    title: Project files to start from
    freeform:
      - title: Starter files for a new Vite project
        body: |-
          For a new Vite project, start from these three files. Replace `alpha` and `^5.2.1` with the exact versions you were given, if any. `init` does not create `package.json` or `vite.config.ts`. It writes `tsconfig.json` only when the file is missing.
        examples:
          - title: package.json
            ref:
              href: ./project-files/package.json.example
              rel: source
              role: JSON
          - title: vite.config.ts
            ref:
              href: ./project-files/vite.config.ts.example
              rel: source
              role: TypeScript
          - title: tsconfig.json
            ref:
              href: ./project-files/tsconfig.json.example
              rel: source
              role: JSON
  - kind: section
    for: all
    title: What you will build
    freeform:
      - title: Overview
        body: |-
          This tutorial walks through building a three-region admin interface with Sanity UI. You will create a sidebar, a toolbar and a content list, the same layout used in Sanity Studio.
  - kind: steps
    for: all
    ordered: true
    title: Set up and build the app
    items:
      - title: 'Step 1: Install'
        description: |-
          Run the setup CLI. This tool handles all the setup and configuration for you. It prints the plan and asks before writing anything.

          ```shell
          npx @sanity/ui@alpha init
          ```

          `init` is for new apps only. If the app already has a pre-v5 `@sanity/ui`, it stops with exit code 1.

          To install by hand, install React 19.2 first, then Sanity UI and the icons. Pin the `alpha` tag, because `latest` is the pre-v5 line:

          ```shell
          npm install react@^19.2 react-dom@^19.2
          npm install @sanity/ui@alpha @sanity/icons
          ```

          Afterwards, run `npx @sanity/ui@alpha doctor` to check packages, stylesheet import, `tsconfig.json`, and React/Node versions. In a monorepo, check the package manager and entry file it reports before you act on them. v5 has no `styled-components` dependency and no theme provider, so skip both.
      - title: 'Step 2: Set up the entry point'
        description: |-
          Import the polyfills and the stylesheet in the entry file. Import `@sanity/ui/polyfills` on the line above the stylesheet. Tooltip and Dialog fail without it. Import `@sanity/ui/styles.css` before your own global CSS. Without it, components render unstyled. Your CSS overrides the global reset, which sits in the `sui.global` cascade layer. Component styles are not layered, so where specificity is equal, the later import wins. Sanity UI 5 has no `ThemeProvider` to wrap the app with.

          ```js
          import { createRoot } from 'react-dom/client'
          import '@sanity/ui/polyfills'
          import '@sanity/ui/styles.css'
          import App from './App'

          createRoot(document.getElementById('root')!).render(<App />)
          ```
      - title: 'Step 3: Create the outer shell'
        description: |-
          A `Flex` fills the viewport, with the sidebar and the main area side by side. `SkipToContent` comes first, so the first Tab press reveals it. Use `Box as="nav"` for the sidebar and `Flex as="main"` for the content area. `flexWrap="wrap"` stacks the sidebar above the content on narrow screens, and `minWidth="0"` stops content from widening the layout.

          Watch for: the layout rules in **Accessibility and structure**, and sizing as a CSS string in **Key props concepts**.
        examples:
          - title: src/App.tsx after step 3
            ref:
              href: ./quick-start/step-1-app.tsx
              rel: source
              role: React
      - title: 'Step 4: Add the toolbar'
        description: |-
          The toolbar holds the page title and an action button. Give the title `as="h1"` and `truncate={1}`. Give an icon-only button an `aria-label`. The toolbar wraps on mobile, so every `Flex` with two or more children needs `flexWrap="wrap"`.
        examples:
          - title: src/App.tsx after step 4
            ref:
              href: ./quick-start/step-2-toolbar.tsx
              rel: source
              role: React
      - title: 'Step 5: Build the sidebar'
        description: |-
          The sidebar is a `VStack` with the navigation links and a close button. `VStack` takes only `gap` and `as`. Use `underlined={false}` on `Link` to remove the underline from nav links.
        examples:
          - title: src/App.tsx after step 5
            ref:
              href: ./quick-start/step-3-sidebar.tsx
              rel: source
              role: React
      - title: 'Step 6: Add document cards'
        description: |-
          A scrollable `Box` holds a `Container size={2}`, which caps the list's width and centers it. The `Box` handles scrolling, and the `Container` handles only max-width, so keep it inside the `Box`. Each card title is `as="h2"`, because the page title is the `h1`. Each card is wrapped in `PressArea as="a"`, which makes the whole card one link to its document. Keep the padding and styling on the `Card`, not on `PressArea`.

          Watch for: `Card` takes `density` and no layout props, and its layout goes on a wrapping `Box`. The heading order rules are in **Accessibility and structure**.
        examples:
          - title: src/App.tsx after step 6
            ref:
              href: ./quick-start/step-4-document-cards.tsx
              rel: source
              role: React
      - title: 'Step 7: Set the page language'
        description: |-
          In `index.html`, set `lang="en"` on the `<html>` element. Screen readers use it to choose a pronunciation. This is WCAG 3.1.1 (A).
        examples:
          - title: index.html after step 7
            ref:
              href: ./quick-start/step-5-index.html
              rel: source
              role: HTML
      - title: Run it
        description: |-
          ```shell
          npm run dev
          ```

          Open `http://localhost:5173`. You should see the sidebar on the left and the document list on the right.
  - kind: guidelines
    for: all
    framing: how-to-use
    title: Key props concepts
    items:
      - level: must
        statement: >-
          Pass each prop the value type it takes. A wrong type is a TypeScript error.
      - level: must
        statement: >-
          Pass scale props as an integer step, never a string or a pixel value: `padding`, `margin`,
          `gap`, `radius`, `top`, `right`, `bottom`, `left` and `inset`, `shadow`, and `size` on Text,
          Heading, Code and Eyebrow. Write `<Box padding={2}>`. Position props also accept `"auto"`, and
          `radius` accepts `"full"`. For a length outside the scale, such as `50%`, use `style`. The step
          values are in the spacing, elevation and typography guidelines.
        refs:
          - to: spacing-guidelines
            rel: relates-to
          - to: elevation-guidelines
            rel: relates-to
          - to: typography-guidelines
            rel: relates-to
      - id: sizing-is-a-css-string
        level: must
        statement: >-
          Pass sizing props as CSS strings, including zero: `width`, `height`, `minWidth`, `maxWidth`,
          `minHeight`, `maxHeight`, `flexBasis` and `gridTemplateColumns`. Pass `flexGrow` and
          `flexShrink` as numbers, never booleans. Write `<Flex flexGrow={1} minHeight="0">`.
      - level: must
        statement: >-
          Pass `tone` as a token key, never a CSS color: `<Badge tone="critical">`. On Button, use only
          `neutral` or `critical`, and use `critical` only for a destructive action.
        refs:
          - to: semantic-tokens
            rel: relates-to
      - id: responsive-array-undefined-slot
        level: must
        statement: >-
          Use a responsive array with at most six slots, one per breakpoint: `[base, 360px, 600px, 900px,
          1200px, 1800px]`. Each value applies from its `min-width` up. For a step or keyword prop,
          `undefined` keeps the previous value: `padding={[2, undefined, 4]}`. For a CSS string or number
          prop, fill every slot up to the last one you set, because `undefined` resets the value.
      - level: must
        statement: >-
          Use CSS property names for layout: `flexDirection`, `alignItems`, `justifyContent` and
          `flexWrap` on `Flex`, and `gridTemplateColumns` on `Grid`. Don't use `direction`, `align`,
          `justify`, `wrap` or `columns`, and don't pass the flex props to `Box`.
      - id: no-layout-props-actions
        level: must-not
        statement: >-
          Put layout, spacing and sizing props on a wrapping `Box`, not on `Button` or `IconButton`.
          `Text` and `Heading` accept only the margin props: `margin`, `marginX`, `marginY` and the side
          props.
        checks:
          - href: ../evals/cases.yaml
            role: agent-test
        checkedBy: assisted
        $extensions:
          io.jev:
            type: boolean
  - kind: guidelines
    for: agent
    framing: how-to-use
    title: Work within the system's opinions
    items:
      - level: must
        statement: >-
          Use the prop the component provides, even when it is coarser than the control you had in mind.
          Card's spacing is `density` (`compact`, `regular` or `loose`). Card has no `padding`, `gap` or
          `radius` prop.
      - level: must
        statement: >-
          Treat a missing knob as a decision. Pick the nearest value the system offers, and move on.
      - level: must
        statement: >-
          Build the brief from the components the system provides, and match its content and structure.
          Don't reproduce a visual treatment the system doesn't offer.
      - level: should-not
        statement: >-
          Don't wrap a component in a Box only to add spacing the component withholds. That wrapper is an
          override one level out.
      - level: must-not
        statement: >-
          Don't restyle a design system component with `style={{ … }}` or a `className`.
      - level: must-not
        statement: >-
          Don't override a component's color, spacing or radius through CSS custom properties. Use custom
          properties only in custom markup, to match the system.

  # ------------------------------------------------------- Build an interface
  - kind: guidelines
    for: all
    framing: how-to-use
    title: Key accessibility concepts
    items:
      - refs:
          - to: accessibility-guidelines#skip-link-first
            rel: same-as
      - refs:
          - to: accessibility-guidelines#heading-hierarchy
            rel: same-as
      - refs:
          - to: accessibility-guidelines#page-language
            rel: same-as
      - refs:
          - to: accessibility-guidelines#flex-wrap-for-reflow
            rel: same-as
      - refs:
          - to: shared-foundations#icon-only-control-needs-name
            rel: same-as
      - refs:
          - to: shared-foundations#container-inside-scroll-box
            rel: same-as
      - refs:
          - to: shared-foundations#card-not-for-structural-regions
            rel: same-as
  - kind: section
    for: all
    title: Next steps
    freeform:
      - title: Recommended reading
        body: |-
          **Foundations**

          - <dsds:layout>: which layout component to use, and which one adds a visual surface.
          - <dsds:spacing-guidelines>: how to choose a spacing step.
          - <dsds:typography-guidelines>: the type scale and heading hierarchy.
          - <dsds:color-guidelines>: tones and the semantic color tokens.
          - <dsds:elevation-guidelines>: the shadow levels and when to use each.
          - <dsds:accessibility-guidelines>: the WCAG 2.2 AA requirements every screen meets.
          - <dsds:content-guidelines>: UI copy, labels and casing.

          **Patterns**

          - <dsds:layouts>: app layouts and their regions.
          - <dsds:navigation>: sidebar navigation built with List.
          - <dsds:forms>: form fields, labels and errors.
$extensions:
  com.sanity.ui:
    implementationStatus:
      context: Implementation status. Lets a tool tell a component that is coming from one that does not exist, without parsing the status note.
      implemented: true
