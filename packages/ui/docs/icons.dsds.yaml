kind: dsds.asset
id: icons
name: Icons
description: >-
  Interface icons for actions, objects and status. The @sanity/icons package
  ships 236 icons as React components and SVG files. Use these icons, and only
  these icons, across Sanity products — never substitute emoji, third-party icon
  sets, or hand-crafted SVG unless the icon is genuinely not in this set.
metadata:
  status:
    status: stable
assetType: icon
source:
  href: https://www.npmjs.com/package/@sanity/icons
formats: [react, svg]
license:
  name: MIT
  href: https://github.com/sanity-io/icons/blob/main/LICENSE
sections:
  - kind: definitions
    for: all
    title: Members
    items:
      - id: access-denied
        term: AccessDeniedIcon
        definition: Indicates access restrictions or permissions denial.
        aliases: [access-denied, Forbidden, No Entry, Restricted]
        usage: >-
          Use when: - Use when a user lacks permission to access content or features Do not use: -
          For errors that aren't related to user permissions. Use ErrorOutlineIcon or
          ErrorFilledIcon instead.  - For warnings that aren't related to user permissions. Use
          WarningOutlineIcon or WarningFilledIcon instead. - To represent an action to gain access.
          Use LockIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/access-denied.svg
            rel: source
      - id: activity
        term: ActivityIcon
        definition: 'Represents activity feeds, monitoring, or diagnostics.'
        aliases: [activity, Feed, Timeline, EKG]
        usage: >-
          Use when: - For activity logs or feeds.  - For performance or health checks. Do not use: -
          For general analytics or data visualization tools. Use BarChartIcon instead. - To
          represent usage or a general line chart. Use ChartUpwardIcon instead. - To represent a
          trend in data. Use TrendUpwardIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/activity.svg
            rel: source
      - id: add
        term: AddIcon
        definition: Adding a new or existing item to an element.
        aliases: [add, Plus, Create, New]
        usage: >-
          Use when: - Adding/creating a new item that doesn't benefit from the specificity of an
          icon with an "add" modifier  (example: add-document) - As a button for the primary
          add/create action - As a button when only one type of content can be added - As a menu
          button to display the options of what type of item to add Do not use: - When there are
          multiple add actions on a page. Use a more specific icon is available like AddCommentIcon
          for comments - To indicate showing UI columns/rows in the UI. Use split-horizontal or
          split-vertical instead. - To indicate inviting people/members to an organization or group.
          Use AddUserIcon instead. - For adding content in a list where position does matters. Use
          InsertAboveIcon or InsertBelowIcon instead. Best practices: - Add a label with the icon
          when space permits.   - When creating a new item, use "New [ITEM TYPE]". Example: "New
          document"    - When adding an existing item, use "Add [ITEM TYPE ]". Example: "Add tag". -
          In cases where a label is not used, add a tooltip.    - When creating a new item, use
          "Create a new [ITEM TYPE]". Example: "Create a new document"    - When adding an existing
          item, use "Add a [ITEM TYPE ]". Example: "Add a tag".
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/add.svg
            rel: source
      - id: add-circle
        term: AddCircleIcon
        definition: '<!-- TODO: describe AddCircleIcon -->'
        aliases: [add-circle]
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/add-circle.svg
            rel: source
      - id: add-comment
        term: AddCommentIcon
        definition: To provide an affordance for adding a comment or reply.
        aliases: [add-comment, Comment Add, New Comment, Reply]
        usage: >-
          Use when: - To represent the ability to add a comment or reply to a thread. Especially
          when commenting is a secondary action. Do not use: - To view comments. Use CommentIcon
          instead. - When commenting is the primary action within a feature. Consider AddIcon
          instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/add-comment.svg
            rel: source
      - id: add-document
        term: AddDocumentIcon
        definition: Adding or creating a document.
        aliases: [add-document, New document]
        usage: >-
          Use when: - For adding a document to a group/collection/list  - For creating a new
          document as a secondary action Do not use: - When adding/creating a document is the
          primary action. Use AddIcon instead. - For general adding or creation. Use AddIcon
          instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/add-document.svg
            rel: source
      - id: add-user
        term: AddUserIcon
        definition: To add a role or add/invite users to a group.
        aliases: [add-user]
        usage: >-
          Use when: - For adding people to a user group or a team - To add people to a permissions
          group - To add a role Do not use: - As a general action for sharing. Use ShareIcon
          instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/add-user.svg
            rel: source
      - id: api
        term: ApiIcon
        definition: DECORATIVE. USE WITH DISCRETION. ONLY USE IF ANOTHER ICON DOES NOT FIT THE NEED.
        aliases: [api, Code Interface, Integration]
        usage: 'Use when: DECORATIVE. USE WITH DISCRETION. ONLY USE IF ANOTHER ICON DOES NOT FIT THE NEED.'
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/api.svg
            rel: source
      - id: archive
        term: ArchiveIcon
        definition: Archiving or storing items for later reference.
        aliases: [archive, Box, Storage, Deprecated]
        usage: >-
          Use when: - For archival actions - For stashing changes Do not use: - For removal actions.
          Use RemoveIcon instead. - For delete actions. Use TrashIcon instead. - To represent adding
          to a collection. Use PackageIcon instead. - To represent download or export actions. Use
          DownloadIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/archive.svg
            rel: source
      - id: arrow-down
        term: ArrowDownIcon
        definition: Downward screen-level movement/scrolling.
        aliases: [arrow-down, Down, Descend, Download Direction]
        usage: >-
          Use when: - Moving/scrolling down within a page Do not use: - As an indicator for
          downloads. Use DownloadIcon for viewing instead. - To represent unpublish actions. Use
          UnpublishIcon instead. - To move, transition or resize elements within a page. Use
          ChevronDownIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/arrow-down.svg
            rel: source
      - id: arrow-left
        term: ArrowLeftIcon
        definition: Backward navigation across surfaces.
        aliases: [arrow-left, Left, Back, Previous]
        usage: >-
          Use when: - Navigating back to a previous page - Paginating backward/previous Do not use:
          - To move, resize or reveal elements within a page. Use ChevronLeftIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/arrow-left.svg
            rel: source
      - id: arrow-right
        term: ArrowRightIcon
        definition: Forward navigation across surfaces.
        aliases: [arrow-right, Right, Forward, Next]
        usage: >-
          Use when: - Navigating forward to a new page - Paginating forward/next Do not use: - To
          move, resize or reveal elements within a page. Use ChevronRightIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/arrow-right.svg
            rel: source
      - id: arrow-top-right
        term: ArrowTopRightIcon
        definition: To outside a link outside of the current application context.
        aliases: [arrow-top-right, External, Open New, Diagonal Up Right]
        usage: >-
          Use when: - To open a link to another Studio or application - To open content from the
          existing Studio/application in a new tab/window or preview Do not use: - To represent
          opening an external link in a new window or tab. Use LaunchIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/arrow-top-right.svg
            rel: source
      - id: arrow-up
        term: ArrowUpIcon
        definition: Upward screen-level movement/scrolling.
        aliases: [arrow-up, Up, Ascend, Upload Direction]
        usage: >-
          Use when: - Moving/scrolling up within a page - Scrolling back to the top of a page Do not
          use: - To represent uploads. Use UploadIcon instead. - To represent publish actions. Use
          PublishIcon instead. - To move, transition or resize elements within a page. Use
          ChevronUpIcon instead. - To represent opening a new window or tab. Use LaunchIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/arrow-up.svg
            rel: source
      - id: asterisk
        term: AsteriskIcon
        definition: DECORATIVE. USE WITH DISCRETION. ONLY USE IF ANOTHER ICON DOES NOT FIT THE NEED.
        aliases: [asterisk, Star Symbol, Required, Wildcard]
        usage: 'Use when: DECORATIVE. USE WITH DISCRETION. ONLY USE IF ANOTHER ICON DOES NOT FIT THE NEED.'
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/asterisk.svg
            rel: source
      - id: bar-chart
        term: BarChartIcon
        definition: Analytics or general data visualization.
        aliases: [bar-chart, Chart, Statistics, Analytics]
        usage: >-
          Use when: - For general analytics or data visualization tools - Displaying data as a bar
          chart Do not use: - To represent activity or health metrics. Use ActivityIcon instead. -
          To represent trends in data. Use TrendUpwardIcon instead. - To represent usage or a
          general line chart. Use ChartUpwardIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/bar-chart.svg
            rel: source
      - id: basket
        term: BasketIcon
        definition: DECORATIVE. USE WITH DISCRETION. ONLY USE IF ANOTHER ICON DOES NOT FIT THE NEED.
        aliases: [basket]
        usage: 'Use when: DECORATIVE. USE WITH DISCRETION. ONLY USE IF ANOTHER ICON DOES NOT FIT THE NEED.'
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/basket.svg
            rel: source
      - id: bell
        term: BellIcon
        definition: 'Viewing, receiving, or managing notifications/alerts.'
        aliases: [bell, Notification, Alert, Ring]
        usage: >-
          Use when: - For notifications, alerts, or reminders. Do not use: - For reminders related
          to a task. Use TaskIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/bell.svg
            rel: source
      - id: bill
        term: BillIcon
        definition: Financial information or invoices.
        aliases: [bill, Invoice, Receipt, Payment]
        usage: >-
          Use when: - For billing information or invoice management. - To view payment history Do
          not use: - For general documents. Use DocumentIcon instead. - For documentation. Use
          BookIcon instead. - For payment actions. Use CreditCardIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/bill.svg
            rel: source
      - id: binary-document
        term: BinaryDocumentIcon
        definition: To represent binary or executable files.
        aliases: [binary-document, Code File, Binary, Data File]
        usage: >-
          Use when: - As an indicator for a binary file or executable Do not use: - For general
          documents or files. Use DocumentIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/binary-document.svg
            rel: source
      - id: block-content
        term: BlockContentIcon
        definition: Block-based content or structured text.
        aliases: [block-content, Content Block, Rich Text, Structured Content]
        usage: >-
          Use when: - To represent a block of text, like a paragraph. - To indicate rich text
          formatting. Do not use: - As a prompt for editing or composing content. Use EditIcon or
          ComposeIcon respectively.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/block-content.svg
            rel: source
      - id: block-element
        term: BlockElementIcon
        definition: Block layout elements.
        aliases: [block-element, Block, Container, Box]
        usage: >-
          Use when: - To represent content that is displayed as a block element (taking the full
          width of its parent and starting a new line). Do not use: - To represent the size or
          aspect ratio of an element. - For spliting a layout vertically. Use SplitVerticalIcon
          instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/block-element.svg
            rel: source
      - id: blockquote
        term: BlockquoteIcon
        definition: Blockquote text formatting.
        aliases: [blockquote, Quote, Citation, Excerpt]
        usage: >-
          Use when: - For toggling text as a blockquote within a text editing feature. Do not use: -
          Outside text editing. This icon is intended for formatting toolsets. - To represent a
          general text block. Use BlockContentIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/blockquote.svg
            rel: source
      - id: bold
        term: BoldIcon
        definition: Bold text formatting.
        aliases: [bold, Strong, Emphasis, Heavy]
        usage: >-
          Use when: - For toggling text as bold within a text editing feature. Do not use: - Outside
          text editing. This icon is intended for formatting toolsets.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/bold.svg
            rel: source
      - id: bolt
        term: BoltIcon
        definition: DECORATIVE. USE WITH DISCRETION. ONLY USE IF ANOTHER ICON DOES NOT FIT THE NEED.
        aliases: [bolt, Lightning, Fast, Energy]
        usage: 'Use when: DECORATIVE. USE WITH DISCRETION. ONLY USE IF ANOTHER ICON DOES NOT FIT THE NEED.'
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/bolt.svg
            rel: source
      - id: book
        term: BookIcon
        definition: Represent documentation or reading material.
        aliases: [book, Documentation, Manual, Guide]
        usage: >-
          Use when: - To represent reading material–most notably documentation or learning guides.
          Do not use: - For product tips or suggestions. Use BulbOutlineIcon instead. - To represent
          help or support. Use HelpCircleIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/book.svg
            rel: source
      - id: bookmark
        term: BookmarkIcon
        definition: DECORATIVE. USE WITH DISCRETION. ONLY USE IF ANOTHER ICON DOES NOT FIT THE NEED.
        aliases: [bookmark]
        usage: 'Use when: DECORATIVE. USE WITH DISCRETION. ONLY USE IF ANOTHER ICON DOES NOT FIT THE NEED.'
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/bookmark.svg
            rel: source
      - id: bookmark-filled
        term: BookmarkFilledIcon
        definition: DECORATIVE. USE WITH DISCRETION. ONLY USE IF ANOTHER ICON DOES NOT FIT THE NEED.
        aliases: [bookmark-filled]
        usage: 'Use when: DECORATIVE. USE WITH DISCRETION. ONLY USE IF ANOTHER ICON DOES NOT FIT THE NEED.'
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/bookmark-filled.svg
            rel: source
      - id: bottle
        term: BottleIcon
        definition: DECORATIVE. USE WITH DISCRETION. ONLY USE IF ANOTHER ICON DOES NOT FIT THE NEED.
        aliases: [bottle, Container, Liquid, Product]
        usage: 'Use when: DECORATIVE. USE WITH DISCRETION. ONLY USE IF ANOTHER ICON DOES NOT FIT THE NEED.'
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/bottle.svg
            rel: source
      - id: bug
        term: BugIcon
        definition: Code debugging.
        aliases: [bug, Issue]
        usage: >-
          Use when: - To indicate a debugging action, mode, or process. Do not use: - To represent
          user-facing errors. Use ErrorOutlineIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/bug.svg
            rel: source
      - id: bulb-filled
        term: BulbFilledIcon
        definition: '<!-- TODO: describe BulbFilledIcon -->'
        aliases: [bulb-filled]
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/bulb-filled.svg
            rel: source
      - id: bulb-outline
        term: BulbOutlineIcon
        definition: Product tips and suggestions.
        aliases: [bulb-outline, Idea, Light, Suggestion]
        usage: >-
          Use when: - To represent product tips/suggestions for user onboarding or revealing new
          features Do not use: - For deeper learning or to represent documentation. Use BookIcon
          instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/bulb-outline.svg
            rel: source
      - id: calendar
        term: CalendarIcon
        definition: Calendar or date selection.
        aliases: [calendar, Date, Schedule, Event]
        usage: >-
          Use when: - To indicate date selection or scheduling. - To represent calendar views or
          features. Do not use: - For time or duration. Use ClockIcon instead. - To represent a
          collection of events. Use TimelineIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/calendar.svg
            rel: source
      - id: case
        term: CaseIcon
        definition: DECORATIVE. USE WITH DISCRETION. ONLY USE IF ANOTHER ICON DOES NOT FIT THE NEED.
        aliases: [case, Briefcase, Portfolio, Business]
        usage: 'Use when: DECORATIVE. USE WITH DISCRETION. ONLY USE IF ANOTHER ICON DOES NOT FIT THE NEED.'
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/case.svg
            rel: source
      - id: chart-upward
        term: ChartUpwardIcon
        definition: Product/feature usage or specific line chart data visualization.
        aliases: [chart-upward, Growth, Trend, Increase]
        usage: >-
          Use when: - To represent usage reports for a product or feature - Displaying data as a
          line chart Do not use: - For, general analytics, data visualization or charts. Use
          BarChartIcon instead. - To represent activity or health metrics. Use ActivityIcon instead.
          - To represent trends in data. Use TrendUpwardIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/chart-upward.svg
            rel: source
      - id: checkmark
        term: CheckmarkIcon
        definition: Success or selection.
        aliases: [checkmark, Check, Done, Confirmed]
        usage: >-
          Use when: - To represent general positive outcomes - To indicate selection of an item - To
          indicate success of a flow or operation Do not use: - To represent tasks. Use TaskIcon
          instead. - As a interactive element for toggling an item. Use the Checkbox component
          instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/checkmark.svg
            rel: source
      - id: checkmark-circle
        term: CheckmarkCircleIcon
        definition: Represents tasks in general, independent of completion state.
        aliases: [checkmark-circle, Success Circle, Confirmed Circle, Done Circle]
        usage: >-
          Use when: - To represent general tasks independent of completion state. - To view/manage
          tasks. Do not use: - For tasks with an explicitly defined deadline. Use TaskIcon instead.
          - To explicitly indicate an incomplete task. Use CircleIcon instead. - To indicate
          success or a completed task. Use CheckmarkIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/checkmark-circle.svg
            rel: source
      - id: chevron-down
        term: ChevronDownIcon
        definition: 'Moving, resizing, transitioning, or revealing/concealing an element in a downward direction.'
        aliases: [chevron-down, Expand, Dropdown, More]
        usage: >-
          Use when: - As a general affordance for expanding content for an element when direction is
          not explicitly known (example: a menu button) - For expanding an elements's content in a
          top-to-bottom direction (example: accordions) - For collapsing an element in a bottom-to-
          top direction (example: a fixed footer) Do not use: - As the trailing affordance for
          Select inputs. Use SelectIcon instead. - Moving/resizing/revealing a group of elements.
          Use DoubleChevronDownIcon instead. - To represent downloads or the download action. Use
          DownloadIcon instead. - As an affordance to scroll down to an element. Use ArrowDownIcon
          instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/chevron-down.svg
            rel: source
      - id: chevron-left
        term: ChevronLeftIcon
        definition: 'Moving, resizing, transitioning, or revealing/concealing an element in a leftward direction.'
        aliases: [chevron-left, Collapse Left, Previous]
        usage: >-
          Use when: - Drilling out through a column based hierarchical view - Moving backward in a
          carousel view Do not use: - Expanding/collapsing sidebars. Use PanelLeftIcon or
          PanelRightIcon instead - Moving/resizing/revealing a group of elements. Use
          DoubleChevronLeftIcon instead. - Navigating backward to a previous surface. Use
          ArrowLeftIcon instead. Best practices: - Consider RTL languages when using chevrons.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/chevron-left.svg
            rel: source
      - id: chevron-right
        term: ChevronRightIcon
        definition: 'Moving, resizing, transitioning, or revealing/concealing an element in a rightward direction.'
        aliases: [chevron-right, Expand Right, Next]
        usage: >-
          Use when: - Drilling out through a column based hierarchical view - Moving forward in a
          carousel view Do not use: - Expanding/collapsing sidebars. Use PanelLeftIcon or
          PanelRightIcon instead - Moving/resizing/revealing a group of elements. Use
          DoubleChevronRightIcon instead. - Navigating to a new surface. Use ArrowRightIcon instead.
          Best practices: - Consider RTL languages when using chevrons.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/chevron-right.svg
            rel: source
      - id: chevron-up
        term: ChevronUpIcon
        definition: 'Moving, resizing, transitioning, or revealing/concealing an element in an upward direction.'
        aliases: [chevron-up, Collapse, Hide, Less]
        usage: >-
          Use when: - As a general affordance for concealing additional content when direction is
          not explicitly known (example: a menu button) - For collapsing an element's content in a
          top-to-bottom direction (example: accordions) - For expanding an element in a bottom-to-
          top direction (example: a fixed footer) Do not use: - Moving/resizing/revealing a group of
          elements. Use DoubleChevronUpIcon instead. - For concealing a popover menu. Use Close
          instead. - To represent uploads or the upload action. Use UploadIcon instead. instead. -
          As an affordance to scroll up to an element or back to top. Use ArrowUpIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/chevron-up.svg
            rel: source
      - id: circle
        term: CircleIcon
        definition: Incompleted general tasks.
        aliases: [circle, Dot Large, Point, Marker]
        usage: >-
          Use when: - To represent general tasks in an incompleted state. Do not use: - Explicitly
          as a radio button or checkbox. Use actual components instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/circle.svg
            rel: source
      - id: clipboard
        term: ClipboardIcon
        definition: To represent pasting text from clipboard.
        aliases: [clipboard, Copy, Paste, Buffer]
        usage: >-
          Use when: - For pasting from clipboard actions only. Do not use: - To represent copying or
          copying to clipboard. Use CopyIcon instead. - To represent pasting an image from
          clipboard. Use  ClipboardImageIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/clipboard.svg
            rel: source
      - id: clipboard-image
        term: ClipboardImageIcon
        definition: To represent pasting an image from clipboard.
        aliases: [clipboard-image, Copy Image, Image Buffer, Screenshot]
        usage: >-
          Use when: - Specifically for pasting image data from the clipboard. Do not use: - For
          general pasting actions. Use ClipboardIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/clipboard-image.svg
            rel: source
      - id: clock
        term: ClockIcon
        definition: To represent time or duration.
        aliases: [clock, Time, History]
        usage: >-
          Use when: - To indicate a time or duration based value - To represent a timestamp Do not
          use: - To represent specific dates. Use CalendarIcon instead. - To view the history or
          activity log of an item. Use RestoreIcon instead. - To represent time-zones. Use
          EarthAmericasIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/clock.svg
            rel: source
      - id: close
        term: CloseIcon
        definition: Close or dismiss UI elements.
        aliases: [close, X, Exit, Dismiss]
        usage: >-
          Use when: - Closing a menu or popover. - Dismissing a modal, panel, or sheet. - Removing a
          Card from view. Do not use: - For deleting or removing items. Use RemoveIcon instead.  -
          For errors. Use ErrorOutlineIcon instead.  - For permission issues. Use AccessDeniedIcon
          instead. - For clearing content from an input. Use CloseCircleIcon instead. - Concealing a
          panel. Use PanelLeftIcon/PanelRightIcon instead.
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/close.svg
            rel: source
      - id: close-circle
        term: CloseCircleIcon
        definition: '<!-- TODO: describe CloseCircleIcon -->'
        aliases: [close-circle, Cancel Circle, Remove Circle, Exit Circle]
        refs:
          - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/close-circle.svg
            rel: source
      - id: code
        term: CodeIcon
        definition: General indicator of code or Inline code snippets.
        aliases: [code, Programming, Markup, Syntax]
