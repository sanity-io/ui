  - kind: guidelines
    for: all
    title: Accessibility
    tags: [accessibility]
    items:
      - id: icon-accessible-name
        level: must
        statement: >-
          Give every meaningful icon an accessible name. A meaningful icon is one that conveys
          information or triggers an action with no visible text label beside it. Put
          aria-label on the interactive element around it (IconButton, Button, PressArea), or
          pass aria-label to Icon when it stands alone.
        checkedBy: manual
      - id: icon-decorative-hidden
        level: must
        statement: >-
          Hide decorative icons from assistive technology. When an icon accompanies a visible
          text label that already names the action, the icon adds no information. Icon, and a
          component's icon prop such as Button's `iconStart`, hide the icon on their own unless
          it has an aria-label. A raw icon component from @sanity/icons rendered by itself does
          not: give it aria-hidden.
        checkedBy: manual
  - kind: guidelines
    for: all
    title: Usage
    items:
      - id: icon-with-label
        level: should
        statement: >-
          Pair icons with a visible label in unfamiliar or high-stakes contexts. An icon alone
          is faster to scan but demands recognition — use labels wherever the audience or
          context is uncertain.
      - id: icon-only-when-recognised
        level: must
        statement: >-
          Use icons within IconButton only for universally recognised actions (close, search, add)
          and in toolbars where space is constrained. Add a Tooltip for sighted users. The Tooltip
          does not name the control, so it doesn't replace the aria-label.
        refs:
          - to: shared-foundations#icon-only-control-needs-name
            rel: same-as
      - id: icon-size-in-ui
        level: should
        statement: >-
          Size an icon to the text beside it. Icon's `size` is a step, not a pixel value, and
          each step is built to sit beside the Text step of the same number: write
          `<Icon size={1}>` next to `<Text size={1}>`. Each step renders a little taller than
          the text it pairs with, and the default is 2. A raw icon component from
          @sanity/icons renders at 1em, the text's font size, which is smaller than Icon's
          matching step; use Icon when it should line up with Icon elsewhere.
      - id: icon-no-substitute
        level: must-not
        statement: >-
          Do not substitute emoji, third-party icon sets, or hand-crafted SVGs for icons
          from @sanity/icons. This set is the single source of truth for Sanity product
          iconography.
        checkedBy: manual
