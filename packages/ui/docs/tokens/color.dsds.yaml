        items:
          - level: must
            statement: Use semantic tokens when composing UI. Reach for a palette token only when the semantic layer does not cover the use case. The Color guidelines explain the two layers.
      - kind: section
        for: all
        freeform:
          - title: Overview
            body: |-
              The palette holds the base hues, each in a ramp from `50` to `950`, plus `black` and `white`. Tokens are named by hue and step: `gray-500`, `blue-100`. Components take their color from `tone` and the semantic layer, which is built on this palette.
