  - kind: entry
    id: typography
    name: Typography styles
    description: Composite text styles for body, code, heading, and eyebrow roles, each binding a family, size, weight, and line height.
    metadata:
      tags: [typography, type, text, heading, eyebrow, code, scale, line-height]
      status:
        status: stable
      group: typography
    sections:
      - kind: guidelines
        for: all
        framing: how-to-use
        items:
          - refs:
              - to: semantics#heading-level-from-outline
                rel: same-as
          - level: should
            statement: Use the fewest roles a layout needs — three or four. Lean on weight and space before adding a size.
          - level: should
            statement: Constrain body measure to roughly 45–75 characters per line.
          - level: should-not
            statement: Don't use display steps (`body`/`code` `3`–`4`) for product chrome. They are for hero and empty-state text.
      - kind: guidelines
        for: agent
        framing: how-to-use
        items:
          - level: must
            statement: The `size` prop takes an integer step, not a px value. Weight comes from the `weight` prop, not the size token.
      - kind: section
        for: all
        freeform:
          - title: Overview
            body: |-
              Each typography token bundles a font family, size, weight, and line height into one style. The set covers four roles: `body`, `code`, `heading`, and `eyebrow`. Every token carries the regular weight; the rendered weight comes from the component's `weight` prop (see Font weights).
          - title: Roles and components
            body: |-
              | Token role | Component | Family | Default size |
              | --- | --- | --- | --- |
              | `body` | Text | `sans` | `2` |
              | `code` | Code | `mono` | `2` |
              | `heading` | Heading | `sans` | `2` |
              | `eyebrow` | Eyebrow | `sans` | — |

              `heading` runs `0`–`5`, and Heading's `size` accepts all six steps. `body` and `code` run `0`–`4`. `eyebrow` runs `0`–`5`, and Eyebrow's `size` uses steps `0`–`4`. The `eyebrow` role belongs to Eyebrow.
          - title: Sizes
            body: |-
              Each step is one token, named by role and step: `body-2`, `heading-4`, `eyebrow-1`. The size, line height and letter spacing of each live in `docs/tokens/dtcg/json/typography.tokens.json`. Read a role, such as `heading`, to see a whole ramp. Larger heading steps carry negative letter spacing.

              | Role | Steps | Tokens |
              | --- | --- | --- |
              | `body` | `0`–`4` | `body-0` … `body-4` |
              | `code` | `0`–`4` | `code-0` … `code-4` |
              | `heading` | `0`–`5` | `heading-0` … `heading-5` |
              | `eyebrow` | `0`–`5` | `eyebrow-0` … `eyebrow-5` |

              Run large steps (`heading` `4`–`5`, `body`/`code` `3`–`4`) tighter where needed.
          - title: Related
            body: |-
              - **Typography guidelines** — hierarchy table, measure (45–75 characters), alignment, and weight.
              - **Font families** and **Font weights** — the family and weight a style binds.
              - **Spacing** — the spacing scale and vertical rhythm.
      - kind: section
        for: agent
        freeform:
          - title: Intent
            body: Choose a type style by role (Text, Code, Heading, Eyebrow) and step. Use the fewest roles a layout needs.
    refs:
