  - kind: entry
    id: semantic-tokens
    name: Semantic tokens
    description: The theme-aware custom properties Sanity UI 5 builds from the palette, for colour, focus, opacity and motion in custom markup.
    metadata:
      tags:
        [
          color,
          colour,
          semantic,
          css custom property,
          background,
          foreground,
          separator,
          border,
          focus,
          opacity,
          dark mode,
          tone,
        ]
      status:
        status: stable
      group: color.semantic
    sections:
      - kind: guidelines
        for: all
        framing: how-to-use
        items:
          - level: must
            statement: >-
              In custom markup that no component covers, take color from these properties, as
              `var(--separator-low)` or `var(--foreground-high)`. Each resolves for light and dark
              mode on its own.
            checkedBy: manual
          - level: should
            statement: >-
              Inside an element with a `tone`, the surface properties follow that tone:
              `--background-*`, `--foreground-*` and `--separator-*` switch to the tone's ramp.
              Read them there instead of choosing a tone color by hand.
          - level: must-not
            statement: >-
              Do not use the names `--card-border-color`, `--card-bg-color`, `--card-fg-color` or
              `--card-muted-bg-color`, and do not invent names like `--token-color-border`. They do not
              exist, so the declaration does nothing.
            checkedBy: manual
          - level: must-not
            statement: >-
              Do not use these properties to restyle a design system component. They let custom markup
              match the system; a component takes its color from `tone`.
            checkedBy: manual
      - kind: section
        for: all
        freeform:
          - title: Overview
            body: |-
              Sanity UI 5 defines this layer in its own CSS, not in `@sanity-labs/design-tokens`. Each property is built from the palette with `light-dark()`, so one name serves both color schemes. This corpus keeps a generated copy in `tokens/dtcg/json/semantic.tokens.json`. Read `docs/tokens/dtcg/json/semantic.tokens.json` for every name with its light and dark value.
    uses:
      - to: color-palette
    refs:
      - to: color-guidelines
        rel: relates-to
      - href: ./dtcg/json/semantic.tokens.json
        rel: source
        role: DTCG source
