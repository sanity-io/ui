kind: component
id: icon-trend-upward
name: TrendUpwardIcon
description: Trends in data.
metadata:
  status:
    status: stable
  aliases:
    - Growth
    - Increase
    - Rising
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/trend-upward.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For representing trending indicators in data.
      - level: should-not
        statement: To represent a general data visualization or a line chart. Use BarChartIcon instead.
        alternatives:
          - to: icon-bar-chart
      - level: should-not
        statement: To represent usage or a general line chart. Use ChartUpwardIcon instead.
        alternatives:
          - to: icon-chart-upward
      - level: should-not
        statement: To represent usage overages. Use OverageIcon instead.
        alternatives:
          - to: icon-overage
      - level: should-not
        statement: To represent activity or health metrics. Use ActivityIcon instead.
        alternatives:
          - to: icon-activity
