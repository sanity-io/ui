kind: component
id: icon-schema
name: SchemaIcon
description: Schema, data structure or hierarchical content.
metadata:
  status:
    status: stable
  aliases:
    - Structure
    - Model
    - Definition
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/schema.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For schema editors or data models
      - level: should
        statement: To represent general hierarchical structure of content
      - level: should-not
        statement: For general representation of data queries. Use DatabaseIcon instead.
        alternatives:
          - to: icon-database
      - level: should-not
        statement: For GROQ-specific features or queries. Use GroqIcon instead.
        alternatives:
          - to: icon-groq
