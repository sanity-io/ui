kind: component
id: icon-arrow-up
name: ArrowUpIcon
description: Upward screen-level movement/scrolling.
metadata:
  status:
    status: stable
  aliases:
    - Up
    - Ascend
    - Upload Direction
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/arrow-up.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: Moving/scrolling up within a page
      - level: should
        statement: Scrolling back to the top of a page
      - level: should-not
        statement: To represent uploads. Use UploadIcon instead.
        alternatives:
          - to: icon-upload
      - level: should-not
        statement: To represent publish actions. Use PublishIcon instead.
        alternatives:
          - to: icon-publish
      - level: should-not
        statement: To move, transition or resize elements within a page. Use ChevronUpIcon instead.
        alternatives:
          - to: icon-chevron-up
      - level: should-not
        statement: To represent opening a new window or tab. Use LaunchIcon instead.
        alternatives:
          - to: icon-launch
