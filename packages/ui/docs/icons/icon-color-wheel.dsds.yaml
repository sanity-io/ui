sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To reference or represent a color theme or collection of colors.
      - level: should-not
        statement: For targeting an individual color or coloring an individual element. Use DropIcon instead.
