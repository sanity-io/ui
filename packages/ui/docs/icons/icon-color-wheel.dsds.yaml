description: Color collections, palettes, or themes.
metadata:
  status:
    status: stable
  aliases:
    - Color Picker
    - Palette
    - Hue
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/color-wheel.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
