kind: component
id: icon-video
name: VideoIcon
description: To represent a single video.
metadata:
  status:
    status: stable
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/video.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To represent a video
      - level: should
        statement: As a placeholder for an video before it's loaded
      - level: should-not
        statement: To represent a video file. Use DocumentVideoIcon instead.
        alternatives:
          - to: icon-document-video
      - level: should-not
        statement: To represent playback. Use PlayIcon instead.
        alternatives:
          - to: icon-play
