kind: component
id: icon-arrow-left
name: ArrowLeftIcon
description: Backward navigation across surfaces.
metadata:
  status:
    status: stable
  aliases:
    - Left
    - Back
    - Previous
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/arrow-left.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: Navigating back to a previous page
      - level: should
        statement: Paginating backward/previous
      - level: should-not
        statement: To move, resize or reveal elements within a page. Use ChevronLeftIcon instead.
        alternatives:
          - to: icon-chevron-left
