kind: component
id: icon-users
name: UsersIcon
description: To represent multiple people, or group, or a team.
metadata:
  status:
    status: stable
  aliases:
    - People
    - Team
    - Group
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/users.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To represent people, a group, or a team.
      - level: should-not
        statement: To represent a single user. Use UserIcon instead.
        alternatives:
          - to: icon-user
      - level: should-not
        statement: To add a user. Use AddUserIcon instead.
        alternatives:
          - to: icon-add-user
