kind: component
id: icon-trash
name: TrashIcon
description: Permanent deletion of content/data.
metadata:
  status:
    status: stable
  aliases:
    - Delete
    - Remove
    - Discard
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/trash.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For permanent deletion/removal actions.
      - level: should-not
        statement: For archiving of content. Use ArchiveIcon instead.
        alternatives:
          - to: icon-archive
      - level: should-not
        statement: For any form of non-destructive deletion. Use RemoveIcon instead.
        alternatives:
          - to: icon-remove
