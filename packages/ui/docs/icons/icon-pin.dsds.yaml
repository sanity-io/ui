kind: component
id: icon-pin
name: PinIcon
description: To represent an item that can be pinned.
metadata:
  status:
    status: stable
  aliases:
    - Unpinned
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/pin.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: As an affordance for pinning an item to a view
      - level: should-not
        statement: For representing an actively pinned item. Use PinFilledIcon instead.
        alternatives:
          - to: icon-pin-filled
      - level: should-not
        statement: For favoriting or saving content. Use StarIcon instead.
        alternatives:
          - to: icon-star
