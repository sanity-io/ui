kind: component
id: icon-undo
name: UndoIcon
description: To undo the last user action.
metadata:
  status:
    status: stable
  aliases:
    - Revert
    - Back
    - Cancel
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/undo.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For undo operations
      - level: should-not
        statement: For reverting changes. Use RevertIcon instead.
        alternatives:
          - to: icon-revert
      - level: should-not
        statement: For going backward in history. Use ArrowLeftIcon instead.
        alternatives:
          - to: icon-arrow-left
