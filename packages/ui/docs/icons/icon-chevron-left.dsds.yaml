kind: component
id: icon-chevron-left
name: ChevronLeftIcon
description: Moving, resizing, transitioning, or revealing/concealing an element in a leftward direction.
metadata:
  status:
    status: stable
  aliases:
    - Collapse Left
    - Previous
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/chevron-left.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: Drilling out through a column based hierarchical view
      - level: should
        statement: Moving backward in a carousel view
      - level: should-not
        statement: Expanding/collapsing sidebars. Use PanelLeftIcon or PanelRightIcon instead
        alternatives:
          - to: icon-panel-left
          - to: icon-panel-right
      - level: should-not
        statement: Moving/resizing/revealing a group of elements. Use DoubleChevronLeftIcon instead.
        alternatives:
          - to: icon-double-chevron-left
      - level: should-not
        statement: 'Navigating backward to a previous surface. Use ArrowLeftIcon instead. Best practices:'
        alternatives:
          - to: icon-arrow-left
      - level: should-not
        statement: Consider RTL languages when using chevrons.
