kind: component
id: icon-bell
name: BellIcon
description: Viewing, receiving, or managing notifications/alerts.
metadata:
  status:
    status: stable
  aliases:
    - Notification
    - Alert
    - Ring
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/bell.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For notifications, alerts, or reminders.
      - level: should-not
        statement: For reminders related to a task. Use TaskIcon instead.
        alternatives:
          - to: icon-task
