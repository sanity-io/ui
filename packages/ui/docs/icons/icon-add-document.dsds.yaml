kind: component
id: icon-add-document
name: AddDocumentIcon
description: Adding or creating a document.
metadata:
  status:
    status: stable
  aliases:
    - New document
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/add-document.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For adding a document to a group/collection/list
      - level: should
        statement: For creating a new document as a secondary action
      - level: should-not
        statement: When adding/creating a document is the primary action. Use AddIcon instead.
        alternatives:
          - to: icon-add
      - level: should-not
        statement: For general adding or creation. Use AddIcon instead.
        alternatives:
          - to: icon-add
