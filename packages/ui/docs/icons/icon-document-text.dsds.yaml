kind: component
id: icon-document-text
name: DocumentTextIcon
description: Text-based documents.
metadata:
  status:
    status: stable
  aliases:
    - Text File
    - Article
    - Written
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/document-text.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: As an indicator for text-based files, such as .txt, .rtf, or Markdown
      - level: should-not
        statement: Don't use for rich text. Use BlockContentIcon instead.
        alternatives:
          - to: icon-block-content
