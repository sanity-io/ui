kind: component
id: icon-document-pdf
name: DocumentPdfIcon
description: To specifically represent PDF documents.
metadata:
  status:
    status: stable
  aliases:
    - PDF
    - Portable Document
    - PDF File
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/document-pdf.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: As an indicator for a PDF document
      - level: should-not
        statement: For general documents or files. Use DocumentIcon instead.
        alternatives:
          - to: icon-document
      - level: should-not
        statement: To represent text-based documents. Use DocumentTextIcon instead.
        alternatives:
          - to: icon-document-text
