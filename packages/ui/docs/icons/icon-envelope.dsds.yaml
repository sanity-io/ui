kind: component
id: icon-envelope
name: EnvelopeIcon
description: Email or email communication.
metadata:
  status:
    status: stable
  aliases:
    - Email
    - Mail
    - Message
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/envelope.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: Specifically for email-based communication/features
      - level: should-not
        statement: For in-app chat. Use CommentIcon instead.
        alternatives:
          - to: icon-comment
      - level: should-not
        statement: For general feedback. Use FeedbackIcon instead.
        alternatives:
          - to: icon-feedback
