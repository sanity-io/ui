kind: component
id: icon-images
name: ImagesIcon
description: To represent a collection of images or a collection of mixed media formats.
metadata:
  status:
    status: stable
  aliases:
    - Gallery
    - Multiple Photos
    - Collection
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/images.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To represent multiple images or media files
      - level: should-not
        statement: To represent a single image. Use ImageIcon instead.
        alternatives:
          - to: icon-image
      - level: should-not
        statement: To represent a general collection. Use PackageIcon instead.
        alternatives:
          - to: icon-package
