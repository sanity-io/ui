kind: component
id: icon-olist
name: OlistIcon
description: Ordered/numbered lists.
metadata:
  status:
    status: stable
  aliases:
    - Ordered List
    - Numbered
    - Sequence
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/olist.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To represent numbered lists
      - level: should
        statement: List formatting for ordered lists
      - level: should-not
        statement: To represent a general list. Use ListIcon instead.
        alternatives:
          - to: icon-list
      - level: should-not
        statement: For unordered lists. Use UlistIcon instead.
        alternatives:
          - to: icon-ulist
