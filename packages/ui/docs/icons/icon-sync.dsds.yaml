kind: component
id: icon-sync
name: SyncIcon
description: Synchronization or bi-directional sync.
metadata:
  status:
    status: stable
  aliases:
    - Synchronize
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/sync.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For bi-directional syncing of content/information.
      - level: should-not
        statement: For general refreshing of information. Use RefreshIcon instead.
        alternatives:
          - to: icon-refresh
      - level: should-not
        statement: For transferring information from one location to another. Use TransferIcon instead.
        alternatives:
          - to: icon-transfer
      - level: should-not
        statement: To represent loading content. Use SpinnerIcon instead.
        alternatives:
          - to: icon-spinner
