kind: component
id: icon-image-remove
name: ImageRemoveIcon
description: Removing or deleting an image.
metadata:
  status:
    status: stable
  aliases:
    - Delete Image
    - Remove Photo
    - Clear
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/image-remove.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For image removal or deletion
      - level: should-not
        statement: For general removal. Use RemoveIcon instead.
        alternatives:
          - to: icon-remove
      - level: should-not
        statement: For any actions associated with image editing.
