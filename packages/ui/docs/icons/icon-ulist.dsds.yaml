kind: component
id: icon-ulist
name: UlistIcon
description: Unordered/bulleted lists.
metadata:
  status:
    status: stable
  aliases:
    - Unordered List
    - Bullets
    - Items
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/ulist.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To represent bulleted lists
      - level: should
        statement: List formatting for unordered lists
      - level: should-not
        statement: To represent a general list. Use ListIcon instead.
        alternatives:
          - to: icon-list
      - level: should-not
        statement: For numbered lists. Use OlistIcon instead.
        alternatives:
          - to: icon-olist
