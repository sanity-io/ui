kind: component
id: icon-link
name: LinkIcon
description: Links or connections.
metadata:
  status:
    status: stable
  aliases:
    - Hyperlink
    - Connection
    - URL
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/link.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To represent a link or copying a link to the clipboard
      - level: should
        statement: To represent linking one item to another
      - level: should-not
        statement: For unlinked items. Use LinkRemovedIcon instead.
        alternatives:
          - to: icon-link-removed
      - level: should-not
        statement: For broken links. Use UnlinkIcon instead.
        alternatives:
          - to: icon-unlink
