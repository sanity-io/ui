kind: component
id: icon-document-sheet
name: DocumentSheetIcon
description: Spreadsheet or tabular documents.
metadata:
  status:
    status: stable
  aliases:
    - Spreadsheet
    - Table
    - Grid
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/document-sheet.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: As an indicator for spreadsheet or tabular-data files, such as Excel, CSV, or TSV
      - level: should-not
        statement: For general documents or files. Use DocumentIcon instead.
        alternatives:
          - to: icon-document
      - level: should-not
        statement: For representing tabular data. Use ThListIcon instead.
        alternatives:
          - to: icon-th-list
