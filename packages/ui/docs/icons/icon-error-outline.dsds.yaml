kind: component
id: icon-error-outline
name: ErrorOutlineIcon
description: To represent a general error within the application.
metadata:
  status:
    status: stable
  aliases:
    - Error
    - Alert
    - Failed
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/error-outline.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To represent a critical or blocking error
      - level: should
        statement: When an operation or process fails
      - level: should
        statement: To visually demarcate an error message
      - level: should-not
        statement: To represent issues that are neither critical nor blocking. Use WarningOutlineIcon instead.
        alternatives:
          - to: icon-warning-outline
      - level: should-not
        statement: To represent issues related to user permissions. Use AccessDeniedIcon instead.
        alternatives:
          - to: icon-access-denied
