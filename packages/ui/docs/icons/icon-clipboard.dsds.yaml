kind: component
id: icon-clipboard
name: ClipboardIcon
description: To represent pasting text from clipboard.
metadata:
  status:
    status: stable
  aliases:
    - Copy
    - Paste
    - Buffer
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/clipboard.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For pasting from clipboard actions only.
      - level: should-not
        statement: To represent copying or copying to clipboard. Use CopyIcon instead.
        alternatives:
          - to: icon-copy
      - level: should-not
        statement: To represent pasting an image from clipboard. Use ClipboardImageIcon instead.
        alternatives:
          - to: icon-clipboard-image
