kind: component
id: icon-add-comment
name: AddCommentIcon
description: To provide an affordance for adding a comment or reply.
metadata:
  status:
    status: stable
  aliases:
    - Comment Add
    - New Comment
    - Reply
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/add-comment.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To represent the ability to add a comment or reply to a thread. Especially when commenting is a secondary action.
      - level: should-not
        statement: To view comments. Use CommentIcon instead.
        alternatives:
          - to: icon-comment
      - level: should-not
        statement: When commenting is the primary action within a feature. Consider AddIcon instead.
        alternatives:
          - to: icon-add
