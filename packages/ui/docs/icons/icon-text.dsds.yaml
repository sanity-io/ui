kind: component
id: icon-text
name: TextIcon
description: Representation of general text content.
metadata:
  status:
    status: stable
  aliases:
    - Typography
    - Font
    - Letters
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/text.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: As an indicator for setting font size or family.
      - level: should
        statement: To represent general text content.
      - level: should-not
        statement: To represent text data or a String type value. Use StringIcon instead.
        alternatives:
          - to: icon-string
