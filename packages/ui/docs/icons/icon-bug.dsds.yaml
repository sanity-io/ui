kind: component
id: icon-bug
name: BugIcon
description: Code debugging.
metadata:
  status:
    status: stable
  aliases:
    - Issue
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/bug.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To indicate a debugging action, mode, or process.
      - level: should-not
        statement: To represent user-facing errors. Use ErrorOutlineIcon instead.
        alternatives:
          - to: icon-error-outline
