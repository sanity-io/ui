kind: component
id: icon-double-chevron-right
name: DoubleChevronRightIcon
description: Moving, resizing, transitioning, or revealing/concealing a group of elements in a rightward direction.
metadata:
  status:
    status: stable
  aliases:
    - Fast Right
    - Jump Next
    - Fast Forward
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/double-chevron-right.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: "For expanding a group of elements' content in a left-to-right direction (example: a trailing floating panel)"
      - level: should-not
        statement: For moving, resizing, or expanding/collapsing a single element. Use ChevronRightIcon instead.
        alternatives:
          - to: icon-chevron-right
      - level: should-not
        statement: To navigate forward to a new page. Use ArrowRightIcon instead.
        alternatives:
          - to: icon-arrow-right
