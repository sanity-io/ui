kind: component
id: icon-access-denied
name: AccessDeniedIcon
description: Indicates access restrictions or permissions denial.
metadata:
  status:
    status: stable
  aliases:
    - Forbidden
    - No Entry
    - Restricted
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/access-denied.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: Use when a user lacks permission to access content or features
      - level: should-not
        statement: For errors that aren't related to user permissions. Use ErrorOutlineIcon or ErrorFilledIcon instead.
        alternatives:
          - to: icon-error-outline
          - to: icon-error-filled
      - level: should-not
        statement: For warnings that aren't related to user permissions. Use WarningOutlineIcon or WarningFilledIcon instead.
        alternatives:
          - to: icon-warning-outline
          - to: icon-warning-filled
      - level: should-not
        statement: To represent an action to gain access. Use LockIcon instead.
        alternatives:
          - to: icon-lock
