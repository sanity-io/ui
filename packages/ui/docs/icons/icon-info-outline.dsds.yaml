kind: component
id: icon-info-outline
name: InfoOutlineIcon
description: To represent additional information or details.
metadata:
  status:
    status: stable
  aliases:
    - Information
    - Details
    - About
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/info-outline.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For informational tooltips
      - level: should
        statement: Indicators for details or additional information
      - level: should
        statement: To demarcate notifications that are for general information/context
      - level: should-not
        statement: To represent help/support. Use HelpCircleIcon instead.
        alternatives:
          - to: icon-help-circle
      - level: should-not
        statement: To represent documentation. Use BookIcon instead.
        alternatives:
          - to: icon-book
