kind: component
id: icon-stop
name: StopIcon
description: Stopping media playback or terminating actions.
metadata:
  status:
    status: stable
  aliases:
    - End
    - Terminate
    - Cancel
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/stop.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For stopping media playback
      - level: should
        statement: For terminating processes or actions
      - level: should-not
        statement: Don't use for pausing playback temporarily or holding actions. Use PauseIcon instead.
        alternatives:
          - to: icon-pause
