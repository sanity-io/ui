kind: component
id: icon-archive
name: ArchiveIcon
description: Archiving or storing items for later reference.
metadata:
  status:
    status: stable
  aliases:
    - Box
    - Storage
    - Deprecated
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/archive.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For archival actions
      - level: should
        statement: For stashing changes
      - level: should-not
        statement: For removal actions. Use RemoveIcon instead.
        alternatives:
          - to: icon-remove
      - level: should-not
        statement: For delete actions. Use TrashIcon instead.
        alternatives:
          - to: icon-trash
      - level: should-not
        statement: To represent adding to a collection. Use PackageIcon instead.
        alternatives:
          - to: icon-package
      - level: should-not
        statement: To represent download or export actions. Use DownloadIcon instead.
        alternatives:
          - to: icon-download
