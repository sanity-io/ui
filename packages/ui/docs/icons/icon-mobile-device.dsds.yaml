kind: component
id: icon-mobile-device
name: MobileDeviceIcon
description: Mobile device or phone.
metadata:
  status:
    status: stable
  aliases:
    - Phone
    - Smartphone
    - Mobile
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/mobile-device.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To represent a mobile device when choosing between different device types
      - level: should
        statement: To represent general touch-based devices
      - level: should-not
        statement: To represent tablets. Use TabletDeviceIcon instead.
        alternatives:
          - to: icon-tablet-device
