kind: component
id: icon-code
name: CodeIcon
description: General indicator of code or Inline code snippets.
metadata:
  status:
    status: stable
  aliases:
    - Programming
    - Markup
    - Syntax
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/code.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To indicate something as code
      - level: should
        statement: Inline code formatting in rich text
      - level: should-not
        statement: To represent multiline code blocks. Use CodeBlockIcon instead.
        alternatives:
          - to: icon-code-block
      - level: should-not
        statement: For general API references. Use PlugIcon instead.
        alternatives:
          - to: icon-plug
      - level: should-not
        statement: To represent JSON. Use JsonIcon instead.
        alternatives:
          - to: icon-json
