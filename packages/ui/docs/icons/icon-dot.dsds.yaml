kind: component
id: icon-dot
name: DotIcon
description: Minimal status indicator.
metadata:
  status:
    status: stable
  aliases:
    - Point
    - Bullet
    - Marker Small
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/dot.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To visually highlight an item as updated
      - level: should
        statement: To mark an item with a minimal status indicator
      - level: should-not
        statement: As a bullet for unordered lists. Use unicode characters instead.
      - level: should-not
        statement: To mark items with a warning or error status. Use WarningOutlineIcon or ErrorOutlineIcon respectively.
