kind: component
id: icon-menu
name: MenuIcon
description: Reveal main navigation in a menu or panel.
metadata:
  status:
    status: stable
  aliases:
    - Hamburger
    - Navigation
    - Drawer
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/menu.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To represent the main navigational menu.
      - level: should-not
        statement: For any menu that is not the primary navigation.
      - level: should-not
        statement: For filter menus, use FilterIcon instead.
        alternatives:
          - to: icon-filter
      - level: should-not
        statement: For options menus, use EllipsisHorizontalIcon instead.
        alternatives:
          - to: icon-ellipsis-horizontal
      - level: should-not
        statement: 'For secondary menus, use ChevronDown instead. Best practices:'
      - level: should-not
        statement: MenuIcon should be used once in a screen. Avoid multiple menu affordances to represent different navigational elements.
