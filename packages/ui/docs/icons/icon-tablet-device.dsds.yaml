kind: component
id: icon-tablet-device
name: TabletDeviceIcon
description: Tablet device.
metadata:
  status:
    status: stable
  aliases:
    - Tablet
    - iPad
    - Device
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/tablet-device.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To represent a tablet device when choosing between different device types
      - level: should-not
        statement: To represent general touch-based devices. Use MobileDeviceIcon instead.
        alternatives:
          - to: icon-mobile-device
