kind: component
id: icon-tags
name: TagsIcon
description: Multiple tags, labels or keywords.
metadata:
  status:
    status: stable
  aliases:
    - Labels
    - Categories
    - Keywords
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/tags.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To indicate multiple tags or keywords exist for an item
      - level: should
        statement: To indicate editing a groupd of keywords/tags.
      - level: should-not
        statement: For a single tag or keyword. Use TagIcon instead.
        alternatives:
          - to: icon-tag
      - level: should-not
        statement: To represent adding a tag. Use TagIcon instead.
        alternatives:
          - to: icon-tag
