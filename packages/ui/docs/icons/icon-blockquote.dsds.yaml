kind: component
id: icon-blockquote
name: BlockquoteIcon
description: Blockquote text formatting.
metadata:
  status:
    status: stable
  aliases:
    - Quote
    - Citation
    - Excerpt
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/blockquote.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For toggling text as a blockquote within a text editing feature.
      - level: should-not
        statement: Outside text editing. This icon is intended for formatting toolsets.
      - level: should-not
        statement: To represent a general text block. Use BlockContentIcon instead.
        alternatives:
          - to: icon-block-content
