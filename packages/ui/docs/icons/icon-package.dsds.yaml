kind: component
id: icon-package
name: PackageIcon
description: Packages, or bundles, or collections.
metadata:
  status:
    status: stable
  aliases:
    - Bundle
    - Module
    - Dependency
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/package.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To represent package management, bundles, or collections of data.
      - level: should-not
        statement: For shipping general groups of documents. Use DocumentsIcon instead.
        alternatives:
          - to: icon-documents
      - level: should-not
        statement: For directories/folders of files. Use FolderIcon instead.
        alternatives:
          - to: icon-folder
