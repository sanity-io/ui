kind: component
id: icon-dashboard
name: DashboardIcon
description: Dashboard pages/screens.
metadata:
  status:
    status: stable
  aliases:
    - Overview
    - Home
    - Main
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/dashboard.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To represent pages/screens that act as a dashboard of information.
      - level: should-not
        statement: To represent Sanity's home page. Use HomeIcon instead.
        alternatives:
          - to: icon-home
      - level: should-not
        statement: To represent a gallery of media. Use ImagesIcon instead.
        alternatives:
          - to: icon-images
