kind: component
id: icon-arrow-right
name: ArrowRightIcon
description: Forward navigation across surfaces.
metadata:
  status:
    status: stable
  aliases:
    - Right
    - Forward
    - Next
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/arrow-right.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: Navigating forward to a new page
      - level: should
        statement: Paginating forward/next
      - level: should-not
        statement: To move, resize or reveal elements within a page. Use ChevronRightIcon instead.
        alternatives:
          - to: icon-chevron-right
