kind: component
id: icon-bill
name: BillIcon
description: Financial information or invoices.
metadata:
  status:
    status: stable
  aliases:
    - Invoice
    - Receipt
    - Payment
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/bill.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For billing information or invoice management.
      - level: should
        statement: To view payment history
      - level: should-not
        statement: For general documents. Use DocumentIcon instead.
        alternatives:
          - to: icon-document
      - level: should-not
        statement: For documentation. Use BookIcon instead.
        alternatives:
          - to: icon-book
      - level: should-not
        statement: For payment actions. Use CreditCardIcon instead.
        alternatives:
          - to: icon-credit-card
