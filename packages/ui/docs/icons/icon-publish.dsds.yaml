kind: component
id: icon-publish
name: PublishIcon
description: Publishing or releasing.
metadata:
  status:
    status: stable
  aliases:
    - Release
    - Deploy
    - Go Live
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/publish.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For publishing, deploying or releasing content.
      - level: should-not
        statement: For unpublishing content. Use UnpublishIcon instead.
        alternatives:
          - to: icon-unpublish
      - level: should-not
        statement: For uploading content. Use UploadIcon instead.
        alternatives:
          - to: icon-upload
      - level: should-not
        statement: For collapsing content vertically. Use ChevronUpIcon instead.
        alternatives:
          - to: icon-chevron-up
