kind: component
id: icon-plug
name: PlugIcon
description: Represents API endpoints or integrations.
metadata:
  status:
    status: stable
  aliases:
    - Plugin
    - Extension
    - Connection
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/plug.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: Referencing API integrations, features, or endpoints
      - level: should-not
        statement: For general code references. Use CodeIcon or CodeBlockIcon instead.
        alternatives:
          - to: icon-code
          - to: icon-code-block
      - level: should-not
        statement: For code inspection. Use JsonIcon instead.
        alternatives:
          - to: icon-json
