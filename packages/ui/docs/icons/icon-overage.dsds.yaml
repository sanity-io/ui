kind: component
id: icon-overage
name: OverageIcon
description: Overage or exceeding limits.
metadata:
  status:
    status: stable
  aliases:
    - Excess
    - Limit
    - Quota
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/overage.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For quota warnings, exceeded limit indicators, or overage alerts
      - level: should-not
        statement: For general warnings Use WarningOutlineIcon instead.
        alternatives:
          - to: icon-warning-outline
      - level: should-not
        statement: To represent usage or a general line chart. Use ChartUpwardIcon instead.
        alternatives:
          - to: icon-chart-upward
      - level: should-not
        statement: To represent activity or health metrics. Use ActivityIcon instead.
        alternatives:
          - to: icon-activity
      - level: should-not
        statement: To represent trends in data. Use TrendUpwardIcon instead.
        alternatives:
          - to: icon-trend-upward
