kind: component
id: icon-bar-chart
name: BarChartIcon
description: Analytics or general data visualization.
metadata:
  status:
    status: stable
  aliases:
    - Chart
    - Statistics
    - Analytics
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/bar-chart.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For general analytics or data visualization tools
      - level: should
        statement: Displaying data as a bar chart
      - level: should-not
        statement: To represent activity or health metrics. Use ActivityIcon instead.
        alternatives:
          - to: icon-activity
      - level: should-not
        statement: To represent trends in data. Use TrendUpwardIcon instead.
        alternatives:
          - to: icon-trend-upward
      - level: should-not
        statement: To represent usage or a general line chart. Use ChartUpwardIcon instead.
        alternatives:
          - to: icon-chart-upward
