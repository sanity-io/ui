kind: component
id: icon-unlink
name: UnlinkIcon
description: Broken/missing links or disconnected items.
metadata:
  status:
    status: stable
  aliases:
    - Broken Link
    - Disconnected
    - Unlinked
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/unlink.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: To represent a broken or missing web link.
      - level: should
        statement: To represent a disconnected state between two previously connected items
      - level: should-not
        statement: To represent the action of removing a link or disconnecting two items. Use LinkRemovedIcon instead.
        alternatives:
          - to: icon-link-removed
