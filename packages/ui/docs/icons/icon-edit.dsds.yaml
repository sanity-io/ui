kind: component
id: icon-edit
name: EditIcon
description: Edit or modify actions.
metadata:
  status:
    status: stable
  aliases:
    - Modify
    - Change
    - Update
refs:
  - href: https://github.com/sanity-io/icons/blob/main/packages/icons/src/edit.svg
    rel: source
$extensions:
  com.sanity.ui:
    iconOf: icons
    described: true
sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: For editing, modifying or updating content.
      - level: should-not
        statement: For creating new general content. Use AddIcon instead.
        alternatives:
          - to: icon-add
      - level: should-not
        statement: For creating new written content. Use ComposeIcon instead.
        alternatives:
          - to: icon-compose
