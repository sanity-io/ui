packages:
  - apps/*
  - apps/frameworks/*
  - packages/*

allowBuilds:
  esbuild: false
  sharp: false

catalog:
  '@sanity/pkg-utils': ^13.0.0
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^6.1.1
  babel-plugin-react-compiler: ^1.0.0
  oxc-transform-react: ^0.149.0
  react: ^19.2.6
  react-dom: ^19.2.6
  ui3: npm:@sanity/ui@^3.3.0

overrides:
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  react: 'catalog:'
  react-dom: 'catalog:'
