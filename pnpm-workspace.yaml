packages:
  - 'apps/*'
  - 'apps/blueprints/*'
  - 'packages/*'

linkWorkspacePackages: deep
strictPeerDependencies: false

# Version ranges for dependencies used by more than one workspace package.
# Referenced from package.json files via the `catalog:` protocol.
# apps/docs may still diverge from the workspace-wide @types/node catalog pin,
# so that keeps an explicit range there when needed. (See packageExtensions for
# vitest peer wiring across packages that share different vitest versions.)
catalog:
  '@sanity/blueprints': ^0.23.6
  '@sanity/client': ^8.0.0
  '@sanity/functions': ^1.6.6
  '@sanity/tsdown-config': ^0.24.1
  '@sanity/vanilla-extract-vite-plugin': ^0.2.12
  '@types/node': ^24.13.3
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@types/react-is': ^19.2.0
  babel-plugin-react-compiler: ^1.0.0
  react: ^19.2.8
  react-dom: ^19.2.8
  react-is: ^19.2.8
  react-refractor: ^4.0.0
  refractor: ^5.0.0
  rimraf: ^5.0.5
  sanity: ^6.9.2
  styled-components: ^6.5.3
  tsdown: ^0.22.14
  typescript: 7.0.2
  unrun: ^0.3.1
  vite: ^8.2.1
  vitest: ^4.1.10

allowBuilds:
  # Like esbuild, @swc/core's postinstall is only a fallback downloader — the
  # native binary arrives through platform-specific optionalDependencies
  '@swc/core': false
  core-js: false
  esbuild: false
  fsevents: false
  sharp: true
  unrs-resolver: true

# Sanity-owned build tooling releases frequently; don't gate it on the
# default minimum release age (1 day). Same for next, which apps/docs tracks
# closely. tsdown and its lightningcss / verkit / @tsdown/* / publint
# transitive deps are included for the same reason when we deliberately bump
# the catalog to `latest`.
# Version-pinned entries approve one specific release we deliberately picked
# before it aged out of the gate; the lockfile is re-verified against these on
# every install, so they have to stay until the version is a day old.
minimumReleaseAgeExclude:
  - '@next/*'
  - '@portabletext/react'
  - '@sanity/*'
  - '@tsdown/*'
  - lightningcss
  - lightningcss-*
  - next
  - next-sanity
  - groq@6.9.2
  - publint
  - sanity
  - sanity-plugin-media@6.1.3
  - tsdown
  - verkit
  - framer-motion@13.0.0
  - motion-dom@13.0.0
  - motion-utils@13.0.0
  - motion@13.0.0
  - styled-components@6.5.2

# @testing-library/jest-dom/vitest imports `vitest` without declaring it, so it
# falls back to pnpm's hidden hoist — which can resolve to another workspace
# package's vitest version (e.g. apps/docs uses vitest 3, packages/ui vitest 4),
# registering the matchers on the wrong `expect` instance. Declare the peer so
# each consumer gets its own vitest linked.
packageExtensions:
  '@testing-library/jest-dom':
    peerDependencies:
      vitest: '*'
    peerDependenciesMeta:
      vitest:
        optional: true

overrides:
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  react: 'catalog:'
  react-dom: 'catalog:'
