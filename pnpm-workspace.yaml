packages:
  - 'apps/*'
  - 'packages/*'

linkWorkspacePackages: deep
strictPeerDependencies: false
autoDedupe: true
lockfile:
  includeResolutionSettings: true

# `pnpm add` writes `catalog:` when the requested version is covered by an
# existing catalog entry, or when the dependency is not cataloged yet (the
# entry is then added to `catalog` below). A version outside an existing
# entry's range warns and is kept as a direct range (`strict` would error).
catalogMode: prefer

# Version ranges for dependencies used by more than one workspace package.
# Referenced from package.json files via the `catalog:` protocol.
# apps/docs may still diverge from the workspace-wide @types/node catalog pin,
# so that keeps an explicit range there when needed. (See packageExtensions for
# vitest peer wiring across packages that share different vitest versions.)
catalog:
  '@pandacss/dev': ^2.2.0
  '@pandacss/transformer': ^2.2.0
  '@pandacss/vite': ^2.2.0
  '@sanity/color': ^3.0.9
  '@sanity/icons': ^5.2.3
  '@sanity/logos': ^2.2.6
  '@sanity/pandacss-tsdown-plugin': ^0.3.0
  '@sanity/tsdown-config': ^0.31.1
  '@types/node': ^24.19.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/react-is': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  motion: ^14.3.0
  oxc-transform-react: ^0.154.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-is: ^19.3.1
  react-refractor: ^4.0.0
  refractor: ^5.0.0
  rimraf: ^5.0.5
  sanity: ^6.19.0
  styled-components: ^6.6.0
  tsdown: ^0.23.1
  typescript: 7.0.2
  unrun: ^0.3.1
  vite: ^8.3.4
  vitest: ^5.0.5

allowBuilds:
  # Like esbuild, @swc/core and @parcel/watcher postinstall scripts are only
  # fallback downloaders/builders — their native binaries arrive through
  # platform-specific optionalDependencies
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  esbuild: false
  fsevents: false
  sharp: true
  unrs-resolver: true

# Sanity-owned build tooling releases frequently; don't gate it on the
# default minimum release age (1 day). Same for next, which apps/docs tracks
# closely. tsdown and its lightningcss / verkit / @tsdown/* / publint
# transitive deps are included for the same reason when we deliberately bump
# the catalog to `latest`.
# Version-pinned entries approve one specific release we deliberately picked
# before it aged out of the gate; the lockfile is re-verified against these on
# every install, so they have to stay until the version is a day old.
minimumReleaseAgeExclude:
  - '@next/*'
  - '@oxc-transform-react/*'
  - '@portabletext/*'
  - '@sanity/*'
  - '@sanity-labs/*'
  - '@storybook/*'
  - '@tsdown/*'
  - lightningcss
  - lightningcss-*
  - chrome-devtools-mcp
  - next
  - oxc-transform-react
  - publint
  - sanity
  - storybook
  - tsdown
  - verkit
  - framer-motion
  - motion-dom
  - motion-utils
  - motion
  - use-effect-event@2.0.4
  - '@types/react-dom@19.3.0'
  - '@types/react-is@19.3.0'
  - '@types/react@19.3.0'
  - react-dom@19.3.1
  - react-is@19.3.1
  - react@19.3.1
  - scheduler@0.28.0
  - '@oxfmt/binding-android-arm-eabi@0.73.0'
  - '@oxfmt/binding-android-arm64@0.73.0'
  - '@oxfmt/binding-darwin-arm64@0.73.0'
