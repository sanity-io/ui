packages:
  - 'apps/*'
  - 'apps/blueprints/*'
  - 'packages/*'

linkWorkspacePackages: deep
strictPeerDependencies: false

# Version ranges for dependencies used by more than one workspace package.
# Referenced from package.json files via the `catalog:` protocol.
# apps/docs may still diverge from the workspace-wide @types/node catalog pin,
# so that keeps an explicit range there when needed. (See packageExtensions for
# vitest peer wiring across packages that share different vitest versions.)
catalog:
  '@sanity/blueprints': ^0.24.0
  '@sanity/client': ^8.5.0
  '@sanity/functions': ^1.7.1
  '@sanity/tsdown-config': ^0.28.0
  '@sanity/vanilla-extract-vite-plugin': ^0.2.18
  '@types/node': ^24.13.3
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.7
  '@types/react-is': ^19.2.0
  '@vitejs/plugin-react': ^6.1.1
  oxc-transform-react: ^0.149.0
  react: ^19.2.8
  react-dom: ^19.2.8
  react-is: ^19.2.8
  react-refractor: ^4.0.0
  refractor: ^5.0.0
  rimraf: ^5.0.5
  sanity: ^6.12.0
  styled-components: ^6.5.3
  tsdown: ^0.23.0
  typescript: 7.0.2
  unrun: ^0.3.1
  vite: ^8.2.2
  vitest: ^5.0.0

allowBuilds:
  # Like esbuild, @swc/core's postinstall is only a fallback downloader — the
  # native binary arrives through platform-specific optionalDependencies
  '@swc/core': false
  core-js: false
  esbuild: false
  fsevents: false
  sharp: true
  unrs-resolver: true

# Sanity-owned build tooling releases frequently; don't gate it on the
# default minimum release age (1 day). Same for next, which apps/docs tracks
# closely. tsdown and its lightningcss / verkit / @tsdown/* / publint
# transitive deps are included for the same reason when we deliberately bump
# the catalog to `latest`.
# Version-pinned entries approve one specific release we deliberately picked
# before it aged out of the gate; the lockfile is re-verified against these on
# every install, so they have to stay until the version is a day old.
minimumReleaseAgeExclude:
  - '@next/*'
  - '@oxc-transform-react/*'
  - '@portabletext/react'
  - '@sanity/*'
  - '@tsdown/*'
  - lightningcss
  - lightningcss-*
  - next
  - oxc-transform-react
  - publint
  - sanity
  - tsdown
  - verkit
  - motion-utils@13.0.0
  - use-effect-event@2.0.4
  - '@oxfmt/binding-android-arm-eabi@0.67.0'
  - '@oxfmt/binding-android-arm64@0.67.0'
  - '@oxfmt/binding-darwin-arm64@0.67.0'
  - '@oxfmt/binding-darwin-x64@0.67.0'
  - '@oxfmt/binding-freebsd-x64@0.67.0'
  - '@oxfmt/binding-linux-arm-gnueabihf@0.67.0'
  - '@oxfmt/binding-linux-arm-musleabihf@0.67.0'
  - '@oxfmt/binding-linux-arm64-gnu@0.67.0'
  - '@oxfmt/binding-linux-arm64-musl@0.67.0'
  - '@oxfmt/binding-linux-ppc64-gnu@0.67.0'
  - '@oxfmt/binding-linux-riscv64-gnu@0.67.0'
  - '@oxfmt/binding-linux-riscv64-musl@0.67.0'
  - '@oxfmt/binding-linux-s390x-gnu@0.67.0'
  - '@oxfmt/binding-linux-x64-gnu@0.67.0'
  - '@oxfmt/binding-linux-x64-musl@0.67.0'
  - '@oxfmt/binding-openharmony-arm64@0.67.0'
  - '@oxfmt/binding-win32-arm64-msvc@0.67.0'
  - '@oxfmt/binding-win32-ia32-msvc@0.67.0'
  - '@oxfmt/binding-win32-x64-msvc@0.67.0'
  - oxfmt@0.67.0

minimumReleaseAgeExcludePrune: true

# @testing-library/jest-dom/vitest imports `vitest` without declaring it, so it
# can resolve a different copy than the package under test. That happens across
# vitest versions (hoist) and across same-version isolates (pnpm splits vitest
# per vite optional-peer set). The `/vitest` entry then rebinds snapshot
# matchers onto an expect whose SnapshotClient was never set up. Declare the
# peer so each consumer gets a vitest linked, and extend matchers from the
# package's own `expect` (see packages/ui/test/setup.ts).
packageExtensions:
  '@testing-library/jest-dom':
    peerDependencies:
      vitest: '*'
    peerDependenciesMeta:
      vitest:
        optional: true

overrides:
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  react: 'catalog:'
  react-dom: 'catalog:'
